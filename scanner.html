<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOLD AFTER DARK — CHECK IN</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #1f1f1f 0%,
          #0a0a0a 38%,
          #000000 78%,
          #000000 100%
        );
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .top-nav {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 18px;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      background: #171717;
      color: #ffffff;
      border: 1px solid #444444;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.8px;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;
    }

    .home-button:hover {
      background: #242424;
      border-color: #e00000;
    }

    .home-button:active {
      transform: scale(0.98);
    }

    .brand {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 4px;
      line-height: 1.15;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .brand span {
      color: #e00000;
    }

    .subtitle {
      font-size: 12px;
      letter-spacing: 3px;
      color: #9b9b9b;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .scanner-card {
      background: #111111;
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 16px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55),
        0 0 25px rgba(224, 0, 0, 0.08);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #050505;
      min-height: 280px;
    }

    #reader video {
      width: 100% !important;
      max-width: 100%;
      border-radius: 10px;
      display: block;
      object-fit: cover;
    }

    #reader__dashboard_section_swaplink {
      display: none !important;
    }

    #reader__status_span {
      display: none !important;
    }

    #reader__dashboard_section {
      background: #111111 !important;
    }

    #reader__scan_region {
      min-height: 220px;
      background: #050505 !important;
    }

    #reader img {
      max-width: 100%;
    }

    #reader button {
      background: #e00000 !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 8px !important;
      padding: 11px 16px !important;
      font-weight: 900 !important;
      cursor: pointer !important;
    }

    #reader select {
      background: #1a1a1a !important;
      color: #ffffff !important;
      border: 1px solid #444444 !important;
      border-radius: 7px !important;
      padding: 8px !important;
    }

    .camera-button {
      width: 100%;
      margin-top: 10px;
      padding: 13px 16px;
      background: #e00000;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.6px;
      display: none;
    }

    .camera-button.show {
      display: block;
    }

    .camera-button:hover {
      background: #ff0000;
    }

    .camera-button:active {
      transform: scale(0.98);
    }

    .status-text {
      margin-top: 12px;
      min-height: 18px;
      color: #888888;
      font-size: 12px;
      line-height: 1.4;
    }

    .status-text.error {
      color: #ff6b6b;
    }

    .status-text.success {
      color: #35e878;
    }

    .manual {
      margin-top: 18px;
      display: flex;
      gap: 8px;
    }

    .manual input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      background: #1a1a1a;
      color: #ffffff;
      border: 1px solid #3b3b3b;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .manual input::placeholder {
      color: #666666;
    }

    .manual input:focus {
      border-color: #e00000;
      box-shadow:
        0 0 0 2px rgba(224, 0, 0, 0.12);
    }

    .manual button {
      padding: 14px 20px;
      background: #e00000;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 900;
      letter-spacing: 0.5px;
      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .manual button:hover {
      background: #ff0000;
    }

    .manual button:active {
      transform: scale(0.98);
    }

    .manual button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result {
      margin-top: 18px;
      padding: 20px;
      border-radius: 14px;
      display: none;
      text-align: center;
    }

    .result.valid {
      display: block;
      background: #061c10;
      border: 2px solid #16c75a;
    }

    .valid .result-title {
      color: #35e878;
    }

    .result.used {
      display: block;
      background: #201b05;
      border: 2px solid #d7ad00;
    }

    .used .result-title {
      color: #f0c62d;
    }

    .result.invalid {
      display: block;
      background: #210707;
      border: 2px solid #e00000;
    }

    .invalid .result-title {
      color: #ff4b4b;
    }

    .result.error {
      display: block;
      background: #181818;
      border: 2px solid #555555;
    }

    .error .result-title {
      color: #ffffff;
    }

    .result-title {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .detail {
      margin-top: 10px;
      font-size: 14px;
      color: #dddddd;
      line-height: 1.5;
    }

    .detail strong {
      color: #ffffff;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .reset {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      background: #e00000;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 900;
      letter-spacing: 0.5px;
      font-size: 14px;
      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .reset:hover {
      background: #ff0000;
    }

    .reset:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 20px;
      font-size: 10px;
      color: #555555;
      letter-spacing: 2px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .top-nav {
        margin-bottom: 14px;
      }

      .home-button {
        width: 100%;
      }

      .brand {
        font-size: 23px;
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 11px;
        letter-spacing: 2px;
      }

      .scanner-card {
        padding: 12px;
        border-radius: 15px;
      }

      #reader {
        min-height: 250px;
      }

      .manual {
        flex-direction: column;
      }

      .manual button {
        width: 100%;
      }

      .result {
        padding: 18px 14px;
      }

      .result-title {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HOME BUTTON -->
    <div class="top-nav">
      <a
        href="https://boldafterdark.my.id/"
        class="home-button"
      >
        ← HOME
      </a>
    </div>

    <!-- BRAND -->
    <div class="brand">
      BOLD <span>AFTER DARK</span>
    </div>

    <div class="subtitle">
      EVENT CHECK-IN
    </div>

    <!-- SCANNER CARD -->
    <div class="scanner-card">

      <div id="reader"></div>

      <button
        type="button"
        id="cameraButton"
        class="camera-button"
      >
        AKTIFKAN KAMERA
      </button>

      <div
        id="scannerStatus"
        class="status-text"
      ></div>

      <!-- MANUAL TOKEN -->
      <div class="manual">

        <input
          id="manualToken"
          type="text"
          placeholder="Masukkan QR token"
          autocomplete="off"
          spellcheck="false"
        >

        <button
          type="button"
          id="manualButton"
        >
          CHECK
        </button>

      </div>

      <!-- RESULT -->
      <div
        id="result"
        class="result"
      >

        <div
          id="resultTitle"
          class="result-title"
        ></div>

        <div
          id="resultDetails"
        ></div>

        <button
          type="button"
          id="resetButton"
          class="reset"
        >
          SCAN BERIKUTNYA
        </button>

      </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
      BOLD AFTER DARK • THE NIGHT STARTS HERE
    </div>

  </div>

  <script>
    "use strict";

    /* =========================================================
       CONFIG
       ========================================================= */

    const API_URL =
      "https://yrvnmmascklkuzpjkwxn.supabase.co/functions/v1/dynamic-service";


    /* =========================================================
       STATE
       ========================================================= */

    let scanner = null;
    let processing = false;
    let requestTimeout = null;
    let scannerStarting = false;


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const reader =
      document.getElementById("reader");

    const cameraButton =
      document.getElementById("cameraButton");

    const scannerStatus =
      document.getElementById("scannerStatus");

    const manualToken =
      document.getElementById("manualToken");

    const manualButton =
      document.getElementById("manualButton");

    const result =
      document.getElementById("result");

    const resultTitle =
      document.getElementById("resultTitle");

    const resultDetails =
      document.getElementById("resultDetails");

    const resetButton =
      document.getElementById("resetButton");


    /* =========================================================
       STATUS
       ========================================================= */

    function setScannerStatus(
      text,
      type = ""
    ) {
      scannerStatus.className =
        "status-text" +
        (type ? " " + type : "");

      scannerStatus.textContent =
        text || "";
    }


    /* =========================================================
       START SCANNER
       ========================================================= */

    async function startScanner() {

      if (scannerStarting) {
        return;
      }

      scannerStarting = true;
      processing = false;

      cameraButton.classList.remove("show");

      setScannerStatus(
        "Memulai kamera..."
      );


      if (scanner) {

        try {
          await scanner.clear();
        } catch (error) {
          console.warn(
            "Scanner clear:",
            error
          );
        }

        scanner = null;
      }


      reader.innerHTML = "";


      try {

        scanner =
          new Html5QrcodeScanner(
            "reader",
            {
              fps: 10,

              qrbox: {
                width: 250,
                height: 250
              },

              aspectRatio: 1.0,

              rememberLastUsedCamera: false,

              supportedScanTypes: [
                Html5QrcodeScanType.SCAN_TYPE_CAMERA,
                Html5QrcodeScanType.SCAN_TYPE_FILE
              ]
            },
            false
          );


        scanner.render(
          onScanSuccess,
          onScanError
        );


        setScannerStatus(
          "Meminta akses kamera..."
        );

      } catch (error) {

        console.error(
          "SCANNER INITIALIZATION ERROR:",
          error
        );

        cameraButton.classList.add("show");

        setScannerStatus(
          "Kamera belum aktif. Tekan AKTIFKAN KAMERA.",
          "error"
        );

      } finally {

        scannerStarting = false;

      }
    }


    /* =========================================================
       MANUAL CAMERA START
       ========================================================= */

    async function forceStartCamera() {

      cameraButton.disabled = true;

      setScannerStatus(
        "Mengaktifkan kamera..."
      );


      try {

        if (scanner) {

          try {
            await scanner.clear();
          } catch (error) {
            console.warn(
              "Scanner clear before retry:",
              error
            );
          }

          scanner = null;
        }


        reader.innerHTML = "";


        scanner =
          new Html5QrcodeScanner(
            "reader",
            {
              fps: 10,

              qrbox: {
                width: 250,
                height: 250
              },

              aspectRatio: 1.0,

              rememberLastUsedCamera: false,

              supportedScanTypes: [
                Html5QrcodeScanType.SCAN_TYPE_CAMERA,
                Html5QrcodeScanType.SCAN_TYPE_FILE
              ]
            },
            false
          );


        scanner.render(
          onScanSuccess,
          onScanError
        );


        cameraButton.classList.remove("show");

        setScannerStatus(
          "Arahkan kamera ke QR code."
        );

      } catch (error) {

        console.error(
          "FORCE CAMERA ERROR:",
          error
        );

        cameraButton.classList.add("show");

        setScannerStatus(
          "Kamera tidak dapat diaktifkan. Pastikan izin kamera diberikan.",
          "error"
        );

      } finally {

        cameraButton.disabled = false;

      }
    }


    /* =========================================================
       SCAN SUCCESS
       ========================================================= */

    function onScanSuccess(decodedText) {

      if (processing) {
        return;
      }


      const token =
        String(
          decodedText || ""
        ).trim();


      if (!token) {

        showServerError({
          message:
            "QR terbaca tetapi token kosong."
        });

        return;
      }


      processing = true;

      stopScanner();

      processToken(token);
    }


    /* =========================================================
       SCAN ERROR
       ========================================================= */

    function onScanError() {
      // Error scanning biasa tidak ditampilkan.
    }


    /* =========================================================
       STOP SCANNER
       ========================================================= */

    async function stopScanner() {

      if (!scanner) {
        return;
      }


      try {
        await scanner.clear();
      } catch (error) {
        console.warn(
          "Scanner stop:",
          error
        );
      }


      scanner = null;
    }


    /* =========================================================
       PROCESS TOKEN
       ========================================================= */

    async function processToken(token) {

      showLoading();

      setScannerStatus(
        "Menghubungi server check-in..."
      );


      const cleanToken =
        String(
          token || ""
        ).trim();


      if (!cleanToken) {

        showServerError({
          message:
            "QR token kosong."
        });

        processing = false;

        return;
      }


      const requestUrl =
        API_URL +
        "?action=checkIn&token=" +
        encodeURIComponent(
          cleanToken
        );


      if (requestTimeout) {

        clearTimeout(
          requestTimeout
        );

        requestTimeout = null;
      }


      let finished = false;


      requestTimeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }

            finished = true;
            requestTimeout = null;


            showServerError({
              message:
                "Server check-in tidak memberikan respons dalam 15 detik."
            });

          },
          15000
        );


      try {

        const response =
          await fetch(
            requestUrl,
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (finished) {
          return;
        }


        finished = true;


        if (requestTimeout) {

          clearTimeout(
            requestTimeout
          );

          requestTimeout = null;
        }


        const rawResponse =
          await response.text();


        console.log(
          "CHECK-IN HTTP STATUS:",
          response.status
        );

        console.log(
          "CHECK-IN RAW RESPONSE:",
          rawResponse
        );


        let data = null;


        try {

          data =
            JSON.parse(
              rawResponse
            );

        } catch (error) {

          console.error(
            "JSON PARSE ERROR:",
            error
          );


          showServerError({
            message:
              "Server mengembalikan response yang tidak valid."
          });

          return;
        }


        if (!response.ok) {

          showServerError({
            message:
              data &&
              data.message
                ? data.message
                : "Server check-in menolak request."
          });

          return;
        }


        showResult(data);

      } catch (error) {

        if (finished) {
          return;
        }

        finished = true;


        if (requestTimeout) {

          clearTimeout(
            requestTimeout
          );

          requestTimeout = null;
        }


        console.error(
          "CHECK-IN REQUEST ERROR:",
          error
        );


        showServerError({
          message:
            error &&
            error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
        });

      }
    }


    /* =========================================================
       MANUAL CHECK-IN
       ========================================================= */

    function manualCheckIn() {

      if (processing) {
        return;
      }


      const token =
        manualToken.value.trim();


      if (!token) {

        showTemporaryError(
          "QR TOKEN KOSONG"
        );

        manualToken.focus();

        return;
      }


      processing = true;

      stopScanner();

      processToken(token);
    }


    /* =========================================================
       SHOW RESULT
       ========================================================= */

    function showResult(data) {

      result.className = "result";
      result.style.display = "block";


      if (
        data &&
        data.status === "VALID"
      ) {

        result.classList.add("valid");

        resultTitle.textContent =
          "✓ ENTRY APPROVED";


        resultDetails.innerHTML =

          '<div class="detail">' +
            '<strong>NAMA</strong><br>' +
            escapeHtml(data.name) +
          '</div>' +

          '<div class="detail">' +
            '<strong>PASS ID</strong><br>' +
            escapeHtml(data.passId) +
          '</div>' +

          '<div class="detail">' +
            '<strong>ACCESS</strong><br>' +
            escapeHtml(data.accessType) +
          '</div>' +

          (
            data.tablePackage
              ? (
                  '<div class="detail">' +
                    '<strong>TABLE</strong><br>' +
                    escapeHtml(data.tablePackage) +
                  '</div>'
                )
              : ""
          ) +

          '<div class="detail">' +
            '<strong>CHECK-IN</strong><br>' +
            escapeHtml(data.checkInTime) +
          '</div>';


        setScannerStatus(
          "Check-in berhasil.",
          "success"
        );

        return;
      }


      if (
        data &&
        data.status === "ALREADY_USED"
      ) {

        result.classList.add("used");

        resultTitle.textContent =
          "⚠ ALREADY USED";


        resultDetails.innerHTML =

          '<div class="detail">' +
            '<strong>QR INI SUDAH DIGUNAKAN</strong>' +
          '</div>' +

          '<div class="detail">' +
            '<strong>NAMA</strong><br>' +
            escapeHtml(data.name) +
          '</div>' +

          '<div class="detail">' +
            '<strong>PASS ID</strong><br>' +
            escapeHtml(data.passId) +
          '</div>' +

          '<div class="detail">' +
            '<strong>ACCESS</strong><br>' +
            escapeHtml(data.accessType) +
          '</div>' +

          (
            data.tablePackage
              ? (
                  '<div class="detail">' +
                    '<strong>TABLE</strong><br>' +
                    escapeHtml(data.tablePackage) +
                  '</div>'
                )
              : ""
          ) +

          '<div class="detail">' +
            '<strong>CHECK-IN</strong><br>' +
            escapeHtml(data.checkInTime) +
          '</div>';


        setScannerStatus(
          "QR sudah pernah digunakan."
        );

        return;
      }


      if (
        data &&
        (
          data.status === "INVALID" ||
          data.status === "NOT_FOUND"
        )
      ) {

        result.classList.add("invalid");

        resultTitle.textContent =
          "✕ INVALID QR";


        resultDetails.innerHTML =

          '<div class="detail">' +
            escapeHtml(
              data.message ||
              "QR tidak terdaftar."
            ) +
          '</div>';


        setScannerStatus(
          "QR tidak valid."
        );

        return;
      }


      result.classList.add("error");

      resultTitle.textContent =
        "SYSTEM ERROR";


      resultDetails.innerHTML =

        '<div class="detail">' +
          escapeHtml(
            data &&
            data.message
              ? data.message
              : "Terjadi kesalahan pada server check-in."
          ) +
        '</div>';


      setScannerStatus(
        "Terjadi kesalahan."
      );
    }


    /* =========================================================
       LOADING
       ========================================================= */

    function showLoading() {

      result.className =
        "result error";

      result.style.display =
        "block";


      resultTitle.textContent =
        "CHECKING...";


      resultDetails.innerHTML =
        '<div class="detail">' +
          'Memverifikasi QR ke server...' +
        '</div>';
    }


    /* =========================================================
       SERVER ERROR
       ========================================================= */

    function showServerError(error) {

      result.className =
        "result error";

      result.style.display =
        "block";


      resultTitle.textContent =
        "SYSTEM ERROR";


      resultDetails.innerHTML =

        '<div class="detail">' +
          escapeHtml(
            error &&
            error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
          ) +
        '</div>';


      setScannerStatus(
        "Server check-in tidak dapat dihubungi.",
        "error"
      );
    }


    /* =========================================================
       TEMPORARY ERROR
       ========================================================= */

    function showTemporaryError(message) {

      result.className =
        "result invalid";

      result.style.display =
        "block";


      resultTitle.textContent =
        "✕ INVALID";


      resultDetails.innerHTML =

        '<div class="detail">' +
          escapeHtml(message) +
        '</div>';


      setScannerStatus(
        "Input tidak valid.",
        "error"
      );
    }


    /* =========================================================
       RESET SCANNER
       ========================================================= */

    async function resetScanner() {

      if (requestTimeout) {

        clearTimeout(
          requestTimeout
        );

        requestTimeout = null;
      }


      result.style.display =
        "none";

      result.className =
        "result";

      resultTitle.textContent =
        "";

      resultDetails.innerHTML =
        "";

      manualToken.value =
        "";

      processing =
        false;


      await startScanner();
    }


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(value) {

      return String(
        value == null
          ? ""
          : value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    /* =========================================================
       EVENTS
       ========================================================= */

    manualButton.addEventListener(
      "click",
      manualCheckIn
    );


    resetButton.addEventListener(
      "click",
      resetScanner
    );


    cameraButton.addEventListener(
      "click",
      forceStartCamera
    );


    manualToken.addEventListener(
      "keydown",
      function(event) {

        if (
