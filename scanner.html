<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOLD AFTER DARK — CHECK IN</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #2a0000 0%,
          #080808 45%,
          #000000 100%
        );

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* =========================================================
       TOP NAV
       ========================================================= */

    .top-nav {
      width: 100%;
      margin-bottom: 18px;
      text-align: left;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 11px 16px;

      background: #111;

      color: white;

      border: 1px solid #444;

      border-radius: 8px;

      text-decoration: none;

      font-size: 13px;
      font-weight: 800;

      letter-spacing: 0.5px;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .home-button:hover {
      background: #1d1d1d;
      border-color: #e00000;
    }

    .home-button:active {
      transform: scale(0.98);
    }

    /* =========================================================
       BRAND
       ========================================================= */

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 4px;
    }

    .brand span {
      color: #e00000;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 3px;
      color: #aaa;
      margin-bottom: 24px;
    }

    /* =========================================================
       SCANNER CARD
       ========================================================= */

    .scanner-card {
      background: #111;

      border: 1px solid #333;

      border-radius: 18px;

      padding: 16px;

      box-shadow:
        0 0 30px rgba(255, 0, 0, 0.12);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    /* Sembunyikan elemen bawaan html5-qrcode */

    #reader__dashboard_section_swaplink,
    #reader__status_span,
    #reader__dashboard_section_csr {
      display: none !important;
    }

    #reader video {
      border-radius: 10px;
    }

    #reader__scan_region {
      min-height: 180px;
    }

    /* =========================================================
       MANUAL TOKEN
       ========================================================= */

    .manual {
      margin-top: 18px;

      display: flex;

      gap: 8px;
    }

    .manual input {
      flex: 1;

      min-width: 0;

      padding: 14px;

      background: #1c1c1c;

      color: white;

      border: 1px solid #444;

      border-radius: 8px;

      font-size: 15px;

      outline: none;
    }

    .manual input::placeholder {
      color: #777;
    }

    .manual input:focus {
      border-color: #e00000;

      box-shadow:
        0 0 0 2px rgba(224, 0, 0, 0.12);
    }

    .manual button {
      padding: 14px 18px;

      background: #e00000;

      color: white;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;
    }

    .manual button:hover {
      background: #ff0000;
    }

    .manual button:active {
      transform: scale(0.98);
    }

    .manual button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =========================================================
       RESULT
       ========================================================= */

    .result {
      margin-top: 18px;

      padding: 20px;

      border-radius: 14px;

      display: none;
    }

    .result.valid {
      display: block;

      background: #062d16;

      border: 2px solid #16c75a;
    }

    .result.used {
      display: block;

      background: #2d2100;

      border: 2px solid #e2b400;
    }

    .result.invalid {
      display: block;

      background: #300000;

      border: 2px solid #e00000;
    }

    .result.error {
      display: block;

      background: #222;

      border: 2px solid #777;
    }

    .result-title {
      font-size: 28px;

      font-weight: 900;

      margin-bottom: 12px;
    }

    .valid .result-title {
      color: #16c75a;
    }

    .used .result-title {
      color: #e2b400;
    }

    .invalid .result-title {
      color: #ff3333;
    }

    .error .result-title {
      color: #fff;
    }

    .detail {
      margin-top: 8px;

      font-size: 15px;

      color: #ddd;

      line-height: 1.5;
    }

    .detail strong {
      color: white;
    }

    /* =========================================================
       RESET
       ========================================================= */

    .reset {
      margin-top: 18px;

      width: 100%;

      padding: 14px;

      background: #e00000;

      color: white;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

      font-size: 15px;
    }

    .reset:hover {
      background: #ff0000;
    }

    .reset:active {
      transform: scale(0.98);
    }

    /* =========================================================
       STATUS
       ========================================================= */

    .status-text {
      margin-top: 12px;

      font-size: 12px;

      color: #888;

      min-height: 18px;

      line-height: 1.5;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {
      margin-top: 20px;

      font-size: 11px;

      color: #666;

      letter-spacing: 2px;
    }

    /* =========================================================
       NAVIGATION ERROR
       ========================================================= */

    .navigation-error {
      display: none;

      margin-top: 12px;

      padding: 10px 12px;

      background: rgba(224, 0, 0, 0.1);

      border:
        1px solid
        rgba(224, 0, 0, 0.4);

      border-radius: 8px;

      color: #ff8b8b;

      font-size: 11px;

      line-height: 1.5;

      text-align: left;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      .top-nav {
        margin-bottom: 14px;
      }

      .home-button {
        width: 100%;
      }

      .brand {
        font-size: 23px;
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 11px;
        letter-spacing: 2px;
      }

      .scanner-card {
        padding: 12px;

        border-radius: 15px;
      }

      #reader {
        min-height: 250px;
      }

      .manual {
        flex-direction: column;
      }

      .manual button {
        width: 100%;
      }

      .result {
        padding: 18px 14px;
      }

      .result-title {
        font-size: 22px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- =======================================================
         HOME BUTTON
         URL TIDAK DITULIS DI SINI.
         URL DIBACA DARI navigation.html.
         ======================================================= -->

    <div class="top-nav">

      <a
        href="#"
        id="homeButton"
        class="home-button"
      >
        ← HOME
      </a>

    </div>

    <!-- =======================================================
         BRAND
         ======================================================= -->

    <div class="brand">
      BOLD <span>AFTER DARK</span>
    </div>

    <div class="subtitle">
      EVENT CHECK-IN
    </div>

    <!-- =======================================================
         SCANNER CARD
         ======================================================= -->

    <div class="scanner-card">

      <div id="reader"></div>

      <div
        id="scannerStatus"
        class="status-text"
      ></div>

      <!-- =====================================================
           NAVIGATION ERROR
           ===================================================== -->

      <div
        id="navigationError"
        class="navigation-error"
      ></div>

      <!-- =====================================================
           MANUAL TOKEN
           ===================================================== -->

      <div class="manual">

        <input
          id="manualToken"
          type="text"
          placeholder="Masukkan QR token"
          autocomplete="off"
          spellcheck="false"
        >

        <button
          type="button"
          id="manualButton"
        >
          CHECK
        </button>

      </div>

      <!-- =====================================================
           RESULT
           ===================================================== -->

      <div
        id="result"
        class="result"
      >

        <div
          id="resultTitle"
          class="result-title"
        ></div>

        <div id="resultDetails"></div>

        <button
          type="button"
          id="resetButton"
          class="reset"
        >
          SCAN BERIKUTNYA
        </button>

      </div>

    </div>

    <!-- =======================================================
         FOOTER
         ======================================================= -->

    <div class="footer">
      BOLD AFTER DARK • THE NIGHT STARTS HERE
    </div>

  </div>

  <script>

    "use strict";

    /* =========================================================
       SUPABASE CONFIGURATION
       ========================================================= */

    const SUPABASE_URL =
      "https://yrvnmmascklkuzpjkwxn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_YGi3tPBuF9tW4KKnLJ5dDQ_AcBZ19WH";

    const API_URL =
      SUPABASE_URL +
      "/functions/v1/dynamic-service";


    /* =========================================================
       NAVIGATION CONFIGURATION
       =========================================================

       PENTING:

       Jangan ubah URL di scanner.html.

       Semua URL halaman website dibaca dari:

       https://boldafterdark.my.id/navigation.html

       Jadi apabila Home berubah, cukup edit
       navigation.html.
       ========================================================= */

    const NAVIGATION_URL =
      "https://boldafterdark.my.id/navigation.html";


    /* =========================================================
       STATE
       ========================================================= */

    let scanner = null;

    let processing = false;

    let requestTimeout = null;

    let navigationConfig = null;


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const homeButton =
      document.getElementById(
        "homeButton"
      );

    const reader =
      document.getElementById(
        "reader"
      );

    const scannerStatus =
      document.getElementById(
        "scannerStatus"
      );

    const navigationError =
      document.getElementById(
        "navigationError"
      );

    const manualToken =
      document.getElementById(
        "manualToken"
      );

    const manualButton =
      document.getElementById(
        "manualButton"
      );

    const result =
      document.getElementById(
        "result"
      );

    const resultTitle =
      document.getElementById(
        "resultTitle"
      );

    const resultDetails =
      document.getElementById(
        "resultDetails"
      );

    const resetButton =
      document.getElementById(
        "resetButton"
      );


    /* =========================================================
       NAVIGATION — LOAD REFERENCE PAGE
       ========================================================= */

    async function loadNavigationConfig() {

      try {

        const response =
          await fetch(
            NAVIGATION_URL +
            "?t=" +
            Date.now(),
            {
              method: "GET",

              cache: "no-store",

              headers: {
                "Accept":
                  "text/html"
              }
            }
          );

        if (!response.ok) {

          throw new Error(
            "navigation.html HTTP " +
            response.status
          );

        }

        const html =
          await response.text();

        const parser =
          new DOMParser();

        const documentObject =
          parser.parseFromString(
            html,
            "text/html"
          );

        const configElement =
          documentObject.getElementById(
            "navigation-config"
          );

        if (!configElement) {

          throw new Error(
            "Elemen navigation-config tidak ditemukan."
          );

        }

        const rawConfig =
          configElement.textContent.trim();

        if (!rawConfig) {

          throw new Error(
            "Konfigurasi navigasi kosong."
          );

        }

        const config =
          JSON.parse(
            rawConfig
          );

        validateNavigationConfig(
          config
        );

        navigationConfig =
          config;

        navigationError.style.display =
          "none";

        return config;

      } catch (error) {

        console.error(
          "NAVIGATION CONFIG ERROR:",
          error
        );

        navigationConfig =
          null;

        navigationError.textContent =
          "Konfigurasi navigasi tidak dapat dimuat. " +
          "Pastikan navigation.html tersedia.";

        navigationError.style.display =
          "block";

        return null;

      }

    }


    /* =========================================================
       NAVIGATION — VALIDATION
       ========================================================= */

    function validateNavigationConfig(
      config
    ) {

      if (
        !config ||
        typeof config !== "object"
      ) {

        throw new Error(
          "Format konfigurasi navigasi tidak valid."
        );

      }

      const requiredPages = [
        "home",
        "admin",
        "report",
        "scanner"
      ];

      requiredPages.forEach(
        function(page) {

          if (
            typeof config[page] !== "string" ||
            !config[page].trim()
          ) {

            throw new Error(
              "URL halaman '" +
              page +
              "' tidak tersedia."
            );

          }

        }
      );

      requiredPages.forEach(
        function(page) {

          try {

            const url =
              new URL(
                config[page]
              );

            if (
              url.protocol !== "https:" &&
              url.protocol !== "http:"
            ) {

              throw new Error(
                "Protocol URL tidak valid."
              );

            }

          } catch (error) {

            throw new Error(
              "URL halaman '" +
              page +
              "' tidak valid."
            );

          }

        }
      );

    }


    /* =========================================================
       NAVIGATION — GO TO PAGE
       ========================================================= */

    async function navigateTo(
      pageName
    ) {

      /*
       * Selalu baca navigation.html
       * sebelum redirect.
       *
       * Jadi kalau URL berubah di
       * navigation.html, halaman ini
       * langsung menggunakan URL terbaru.
       */

      const config =
        await loadNavigationConfig();

      if (!config) {

        alert(
          "Alamat halaman tidak dapat dibaca dari navigation.html."
        );

        return;

      }

      const target =
        config[pageName];

      if (
        typeof target !== "string" ||
        !target.trim()
      ) {

        alert(
          "Alamat halaman '" +
          pageName +
          "' tidak tersedia."
        );

        return;

      }

      window.location.href =
        target;

    }


    /* =========================================================
       HOME BUTTON
       ========================================================= */

    homeButton.addEventListener(
      "click",
      async function(event) {

        event.preventDefault();

        homeButton.style.pointerEvents =
          "none";

        homeButton.style.opacity =
          "0.6";

        try {

          await navigateTo(
            "home"
          );

        } finally {

          homeButton.style.pointerEvents =
            "";

          homeButton.style.opacity =
            "";

        }

      }
    );


    /* =========================================================
       SCANNER STATUS
       ========================================================= */

    function setScannerStatus(
      text
    ) {

      scannerStatus.textContent =
        text || "";

    }


    /* =========================================================
       START SCANNER
       ========================================================= */

    async function startScanner() {

      processing = false;

      setScannerStatus(
        "Memulai kamera..."
      );

      if (scanner) {

        try {

          await scanner.clear();

        } catch (error) {

          console.warn(
            "Scanner clear:",
            error
          );

        }

        scanner = null;

      }

      reader.innerHTML =
        "";

      try {

        scanner =
          new Html5QrcodeScanner(
            "reader",
            {
              fps: 10,

              qrbox: {
                width: 250,
                height: 250
              },

              rememberLastUsedCamera:
                true,

              supportedScanTypes: [
                Html5QrcodeScanType.SCAN_TYPE_CAMERA,
                Html5QrcodeScanType.SCAN_TYPE_FILE
              ]
            },
            false
          );

        scanner.render(
          onScanSuccess,
          onScanError
        );

        setScannerStatus(
          "Arahkan kamera ke QR code."
        );

      } catch (error) {

        console.error(
          "Scanner initialization error:",
          error
        );

        showServerError({
          message:
            "Kamera scanner tidak dapat dimulai."
        });

      }

    }


    /* =========================================================
       QR SCAN SUCCESS
       ========================================================= */

    function onScanSuccess(
      decodedText
    ) {

      if (processing) {
        return;
      }

      const token =
        String(
          decodedText || ""
        ).trim();

      if (!token) {

        showServerError({
          message:
            "QR terbaca tetapi token kosong."
        });

        return;

      }

      processing = true;

      stopScanner();

      processToken(
        token
      );

    }


    /* =========================================================
       QR SCAN ERROR
       ========================================================= */

    function onScanError() {

      /*
       * Error scanning biasa
       * tidak ditampilkan.
       */

    }


    /* =========================================================
       STOP SCANNER
       ========================================================= */

    async function stopScanner() {

      if (!scanner) {
        return;
      }

      try {

        await scanner.clear();

      } catch (error) {

        console.warn(
          "Scanner stop:",
          error
        );

      }

      scanner = null;

    }


    /* =========================================================
       PROCESS TOKEN
       ========================================================= */

    async function processToken(
      token
    ) {

      showLoading();

      setScannerStatus(
        "Menghubungi server Supabase..."
      );

      const cleanToken =
        String(
          token || ""
        ).trim();

      if (!cleanToken) {

        showServerError({
          message:
            "QR token kosong."
        });

        processing = false;

        return;

      }

      const requestUrl =
        API_URL +
        "?action=checkIn&token=" +
        encodeURIComponent(
          cleanToken
        );

      if (requestTimeout) {

        clearTimeout(
          requestTimeout
        );

        requestTimeout =
          null;

      }

      let finished =
        false;

      requestTimeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }

            finished =
              true;

            requestTimeout =
              null;

            showServerError({
              message:
                "Server check-in tidak memberikan respons dalam 15 detik."
            });

          },
          15000
        );

      try {

        const response =
          await fetch(
            requestUrl,
            {
              method: "GET",

              cache: "no-store"
            }
          );

        if (finished) {
          return;
        }

        finished =
          true;

        if (requestTimeout) {

          clearTimeout(
            requestTimeout
          );

          requestTimeout =
            null;

        }

        const rawResponse =
          await response.text();

        let data =
          null;

        try {

          data =
            JSON.parse(
              rawResponse
            );

        } catch (error) {

          console.error(
            "JSON PARSE ERROR:",
            error
          );

          showServerError({
            message:
              "Server mengembalikan response yang tidak valid."
          });

          return;

        }

        showResult(
          data
        );

      } catch (error) {

        if (finished) {
          return;
        }

        finished =
          true;

        if (requestTimeout) {

          clearTimeout(
            requestTimeout
          );

          requestTimeout =
            null;

        }

        console.error(
          "CHECK-IN REQUEST ERROR:",
          error
        );

        showServerError({
          message:
            error &&
            error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
        });

      }

    }


    /* =========================================================
       MANUAL CHECK-IN
       ========================================================= */

    function manualCheckIn() {

      if (processing) {
        return;
      }

      const token =
        manualToken.value.trim();

      if (!token) {

        showTemporaryError(
          "QR TOKEN KOSONG"
        );

        manualToken.focus();

        return;

      }

      processing = true;

      stopScanner();

      processToken(
        token
      );

    }


    /* =========================================================
       SHOW RESULT
       ========================================================= */

    function showResult(
      data
    ) {

      result.className =
        "result";

      result.style.display =
        "block";


      /* =======================================================
         VALID
         ======================================================= */

      if (
        data &&
        data.status === "VALID"
      ) {

        result.classList.add(
          "valid"
        );

        resultTitle.textContent =
          "✓ ENTRY APPROVED";

        resultDetails.innerHTML =
          '<div class="detail">' +
          '<strong>NAMA</strong><br>' +
          escapeHtml(
            data.name
          ) +
          '</div>' +

          '<div class="detail">' +
          '<strong>PASS ID</strong><br>' +
          escapeHtml(
            data.passId
          ) +
          '</div>' +

          '<div class="detail">' +
          '<strong>ACCESS</strong><br>' +
          escapeHtml(
            data.accessType
          ) +
          '</div>' +

          (
            data.tablePackage
              ? (
                  '<div class="detail">' +
                  '<strong>TABLE</strong><br>' +
                  escapeHtml(
                    data.tablePackage
                  ) +
                  '</div>'
                )
              : ""
          ) +

          '<div class="detail">' +
          '<strong>CHECK-IN</strong><br>' +
          escapeHtml(
            data.checkInTime
          ) +
          '</div>';

        setScannerStatus(
          "Check-in berhasil."
        );

        return;

      }


      /* =======================================================
         ALREADY USED
         ======================================================= */

      if (
        data &&
        data.status === "ALREADY_USED"
      ) {

        result.classList.add(
          "used"
        );

        resultTitle.textContent =
          "⚠ ALREADY USED";

        resultDetails.innerHTML =
          '<div class="detail">' +
          '<strong>QR INI SUDAH DIGUNAKAN</strong>' +
          '</div>' +

          '<div class="detail">' +
          '<strong>NAMA</strong><br>' +
          escapeHtml(
            data.name
          ) +
          '</div>' +

          '<div class="detail">' +
          '<strong>PASS ID</strong><br>' +
          escapeHtml(
            data.passId
          ) +
          '</div>' +

          '<div class="detail">' +
          '<strong>ACCESS</strong><br>' +
          escapeHtml(
            data.accessType
          ) +
          '</div>' +

          (
            data.tablePackage
              ? (
                  '<div class="detail">' +
                  '<strong>TABLE</strong><br>' +
                  escapeHtml(
                    data.tablePackage
                  ) +
                  '</div>'
                )
              : ""
          ) +

          '<div class="detail">' +
          '<strong>CHECK-IN</strong><br>' +
          escapeHtml(
            data.checkInTime
          ) +
          '</div>';

        setScannerStatus(
          "QR sudah pernah digunakan."
        );

        return;

      }


      /* =======================================================
         INVALID
         ======================================================= */

      if (
        data &&
        (
          data.status === "INVALID" ||
          data.status === "NOT_FOUND"
        )
      ) {

        result.classList.add(
          "invalid"
        );

        resultTitle.textContent =
          "✕ INVALID QR";

        resultDetails.innerHTML =
          '<div class="detail">' +
          escapeHtml(
            data.message ||
            "QR tidak terdaftar."
          ) +
          '</div>';

        setScannerStatus(
          "QR tidak valid."
        );

        return;

      }


      /* =======================================================
         SYSTEM ERROR
         ======================================================= */

      result.classList.add(
        "error"
      );

      resultTitle.textContent =
        "SYSTEM ERROR";

      resultDetails.innerHTML =
        '<div class="detail">' +
        escapeHtml(
          data &&
          data.message
            ? data.message
            : "Terjadi kesalahan pada server check-in."
        ) +
        '</div>';

      setScannerStatus(
        "Terjadi kesalahan."
      );

    }


    /* =========================================================
       SHOW LOADING
       ========================================================= */

    function showLoading() {

      result.className =
        "result error";

      result.style.display =
        "block";

      resultTitle.textContent =
        "CHECKING...";

      resultDetails.innerHTML =
        '<div class="detail">' +
        'Memverifikasi QR ke Supabase...' +
        '</div>';

    }


    /* =========================================================
       SERVER ERROR
       ========================================================= */

    function showServerError(
      error
    ) {

      result.className =
        "result error";

      result.style.display =
        "block";

      resultTitle.textContent =
        "SYSTEM ERROR";

      resultDetails.innerHTML =
        '<div class="detail">' +
        escapeHtml(
          error &&
          error.message
            ? error.message
            : "Tidak dapat menghubungi server check-in."
        ) +
        '</div>';

      setScannerStatus(
        "Server check-in tidak dapat dihubungi."
      );

    }


    /* =========================================================
       TEMPORARY ERROR
       ========================================================= */

    function showTemporaryError(
      message
    ) {

      result.className =
        "result invalid";

      result.style.display =
        "block";

      resultTitle.textContent =
        "✕ INVALID";

      resultDetails.innerHTML =
        '<div class="detail">' +
        escapeHtml(
          message
        ) +
        '</div>';

      setScannerStatus(
        "Input tidak valid."
      );

    }


    /* =========================================================
       RESET SCANNER
       ========================================================= */

    async function resetScanner() {

      if (requestTimeout) {

        clearTimeout(
          requestTimeout
        );

        requestTimeout =
          null;

      }

      result.style.display =
        "none";

      result.className =
        "result";

      resultTitle.textContent =
        "";

      resultDetails.innerHTML =
        "";

      manualToken.value =
        "";

      processing =
        false;

      await startScanner();

    }


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ""
          : value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================================================
       EVENT LISTENERS
       ========================================================= */

    manualButton.addEventListener(
      "click",
      manualCheckIn
    );

    resetButton.addEventListener(
      "click",
      resetScanner
    );


    manualToken.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          manualCheckIn();

        }

      }
    );


    /* =========================================================
       PAGE LOAD
       ========================================================= */

    window.addEventListener(
      "load",
      async function() {

        /*
         * Load konfigurasi terlebih dahulu.
         *
         * Scanner tetap dapat bekerja meskipun
         * navigation.html bermasalah.
         *
         * Yang terpengaruh hanya navigasi.
         */

        await loadNavigationConfig();

        await startScanner();

      }
    );

  </script>

</body>
</html>
