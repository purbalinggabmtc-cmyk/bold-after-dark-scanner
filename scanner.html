<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOLD AFTER DARK — CHECK IN</title>

  <!-- QR SCANNER LIBRARY -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ></script>

  <!-- CENTRAL NAVIGATION CONFIG -->
  <script
    src="/config/navigation.js"
    defer
  ></script>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --black: #050505;
      --card: #111111;
      --card-2: #181818;
      --white: #ffffff;
      --gray: #999999;
      --red: #e00000;
      --green: #16c75a;
      --yellow: #e2b400;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #2a0000 0%,
          #080808 45%,
          #000000 100%
        );

      color: var(--white);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    /* =========================================================
       NAVIGATION
       ========================================================= */

    .top-nav {
      width: 100%;
      margin-bottom: 18px;
      text-align: left;
    }

    .home-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 11px 16px;

      background: #111111;

      color: #ffffff;

      border: 1px solid #444444;

      border-radius: 8px;

      text-decoration: none;

      font-size: 13px;
      font-weight: 800;

      letter-spacing: 0.5px;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .home-button:hover {
      background: #1d1d1d;
      border-color: #e00000;
    }

    .home-button:active {
      transform: scale(0.98);
    }

    /* =========================================================
       BRAND
       ========================================================= */

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 4px;
    }

    .brand span {
      color: #e00000;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 3px;
      color: #aaaaaa;
      margin-bottom: 24px;
    }

    /* =========================================================
       SCANNER CARD
       ========================================================= */

    .scanner-card {
      background: #111111;

      border: 1px solid #333333;

      border-radius: 18px;

      padding: 16px;

      box-shadow:
        0 0 30px rgba(255, 0, 0, 0.12);
    }

    /* =========================================================
       CAMERA AREA
       ========================================================= */

    .camera-title {
      margin-bottom: 12px;

      color: #aaaaaa;

      font-size: 11px;

      font-weight: 800;

      letter-spacing: 2px;
    }

    .camera-container {
      position: relative;

      width: 100%;

      min-height: 300px;

      background: #000000;

      border:
        1px solid
        #333333;

      border-radius: 12px;

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: center;
    }

    #reader {
      width: 100%;
      min-height: 280px;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;

      display: block;

      border-radius: 10px;
    }

    #reader img {
      max-width: 100%;
    }

    /* =========================================================
       CAMERA PLACEHOLDER
       ========================================================= */

    .camera-placeholder {
      position: absolute;

      inset: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding: 30px;

      background: #080808;

      color: #777777;

      z-index: 5;
    }

    .camera-placeholder.hidden {
      display: none;
    }

    .camera-icon {
      font-size: 45px;

      margin-bottom: 12px;
    }

    .camera-placeholder-title {
      color: #ffffff;

      font-size: 15px;

      font-weight: 800;

      margin-bottom: 7px;
    }

    .camera-placeholder-text {
      color: #777777;

      font-size: 12px;

      line-height: 1.5;

      max-width: 300px;
    }

    .start-camera-button {
      margin-top: 16px;

      padding: 12px 18px;

      background: #e00000;

      color: #ffffff;

      border: none;

      border-radius: 8px;

      font-weight: 800;
    }

    .start-camera-button:hover {
      background: #ff0000;
    }

    /* =========================================================
       SCANNER STATUS
       ========================================================= */

    .status-text {
      margin-top: 12px;

      min-height: 18px;

      font-size: 12px;

      color: #888888;

      line-height: 1.5;
    }

    /* =========================================================
       CAMERA ERROR
       ========================================================= */

    .camera-error {
      display: none;

      margin-top: 12px;

      padding: 12px;

      background:
        rgba(224, 0, 0, 0.10);

      border:
        1px solid
        rgba(224, 0, 0, 0.45);

      border-radius: 8px;

      color: #ff9a9a;

      font-size: 11px;

      line-height: 1.5;

      text-align: left;
    }

    .camera-error.visible {
      display: block;
    }

    /* =========================================================
       MANUAL TOKEN
       ========================================================= */

    .manual {
      margin-top: 18px;

      display: flex;

      gap: 8px;
    }

    .manual input {
      flex: 1;

      min-width: 0;

      padding: 14px;

      background: #1c1c1c;

      color: #ffffff;

      border:
        1px solid
        #444444;

      border-radius: 8px;

      font-size: 15px;

      outline: none;
    }

    .manual input::placeholder {
      color: #777777;
    }

    .manual input:focus {
      border-color: #e00000;

      box-shadow:
        0 0 0 2px
        rgba(224, 0, 0, 0.12);
    }

    .manual button {
      padding: 14px 18px;

      background: #e00000;

      color: #ffffff;

      border: none;

      border-radius: 8px;

      font-weight: bold;
    }

    .manual button:hover {
      background: #ff0000;
    }

    /* =========================================================
       RESULT
       ========================================================= */

    .result {
      margin-top: 18px;

      padding: 20px;

      border-radius: 14px;

      display: none;

      text-align: center;
    }

    .result.valid {
      display: block;

      background: #062d16;

      border:
        2px solid
        #16c75a;
    }

    .result.used {
      display: block;

      background: #2d2100;

      border:
        2px solid
        #e2b400;
    }

    .result.invalid {
      display: block;

      background: #300000;

      border:
        2px solid
        #e00000;
    }

    .result.error {
      display: block;

      background: #222222;

      border:
        2px solid
        #777777;
    }

    .result-title {
      font-size: 28px;

      font-weight: 900;

      margin-bottom: 12px;
    }

    .valid .result-title {
      color: #16c75a;
    }

    .used .result-title {
      color: #e2b400;
    }

    .invalid .result-title {
      color: #ff3333;
    }

    .error .result-title {
      color: #ffffff;
    }

    .detail {
      margin-top: 8px;

      font-size: 15px;

      color: #dddddd;

      line-height: 1.5;
    }

    .detail strong {
      color: #ffffff;
    }

    /* =========================================================
       RESET
       ========================================================= */

    .reset {
      margin-top: 18px;

      width: 100%;

      padding: 14px;

      background: #e00000;

      color: #ffffff;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

      font-size: 15px;
    }

    .reset:hover {
      background: #ff0000;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {
      margin-top: 20px;

      font-size: 11px;

      color: #666666;

      letter-spacing: 2px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      .home-button {
        width: 100%;
      }

      .brand {
        font-size: 23px;
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 11px;
        letter-spacing: 2px;
      }

      .scanner-card {
        padding: 12px;

        border-radius: 15px;
      }

      .camera-container {
        min-height: 260px;
      }

      #reader {
        min-height: 240px;
      }

      .manual {
        flex-direction: column;
      }

      .manual button {
        width: 100%;
      }

      .result {
        padding: 18px 14px;
      }

      .result-title {
        font-size: 22px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- =======================================================
         HOME
         ======================================================= -->

    <div class="top-nav">

      <a
        href="#"
        id="homeButton"
        class="home-button"
      >
        ← HOME
      </a>

    </div>

    <!-- =======================================================
         BRAND
         ======================================================= -->

    <div class="brand">
      BOLD <span>AFTER DARK</span>
    </div>

    <div class="subtitle">
      EVENT CHECK-IN
    </div>

    <!-- =======================================================
         SCANNER
         ======================================================= -->

    <div class="scanner-card">

      <div class="camera-title">
        QR CODE SCANNER
      </div>

      <div class="camera-container">

        <div id="reader"></div>

        <div
          id="cameraPlaceholder"
          class="camera-placeholder"
        >

          <div class="camera-icon">
            📷
          </div>

          <div class="camera-placeholder-title">
            KAMERA BELUM AKTIF
          </div>

          <div class="camera-placeholder-text">
            Tekan tombol di bawah untuk mengaktifkan
            kamera scanner.
          </div>

          <button
            type="button"
            id="startCameraButton"
            class="start-camera-button"
          >
            AKTIFKAN KAMERA
          </button>

        </div>

      </div>

      <div
        id="scannerStatus"
        class="status-text"
      >
        Menyiapkan scanner...
      </div>

      <div
        id="cameraError"
        class="camera-error"
      ></div>

      <!-- =====================================================
           MANUAL TOKEN
           ===================================================== -->

      <div class="manual">

        <input
          id="manualToken"
          type="text"
          placeholder="Masukkan QR token"
          autocomplete="off"
          spellcheck="false"
        >

        <button
          type="button"
          id="manualButton"
        >
          CHECK
        </button>

      </div>

      <!-- =====================================================
           RESULT
           ===================================================== -->

      <div
        id="result"
        class="result"
      >

        <div
          id="resultTitle"
          class="result-title"
        ></div>

        <div id="resultDetails"></div>

        <button
          type="button"
          id="resetButton"
          class="reset"
        >
          SCAN BERIKUTNYA
        </button>

      </div>

    </div>

    <!-- =======================================================
         FOOTER
         ======================================================= -->

    <div class="footer">
      BOLD AFTER DARK • THE NIGHT STARTS HERE
    </div>

  </div>


  <script>

    "use strict";


    /* =========================================================
       SUPABASE
       ========================================================= */

    const SUPABASE_URL =
      "https://yrvnmmascklkuzpjkwxn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_YGi3tPBuF9tW4KKnLJ5dDQ_AcBZ19WH";

    const API_URL =
      SUPABASE_URL +
      "/functions/v1/dynamic-service";


    /* =========================================================
       CENTRAL NAVIGATION FILE
       ========================================================= */

    const NAVIGATION_SCRIPT =
      "/config/navigation.js";


    /* =========================================================
       STATE
       ========================================================= */

    let scanner = null;

    let processing = false;

    let navigationConfig = null;

    let scannerStarted = false;


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const homeButton =
      document.getElementById(
        "homeButton"
      );

    const reader =
      document.getElementById(
        "reader"
      );

    const cameraPlaceholder =
      document.getElementById(
        "cameraPlaceholder"
      );

    const startCameraButton =
      document.getElementById(
        "startCameraButton"
      );

    const scannerStatus =
      document.getElementById(
        "scannerStatus"
      );

    const cameraError =
      document.getElementById(
        "cameraError"
      );

    const manualToken =
      document.getElementById(
        "manualToken"
      );

    const manualButton =
      document.getElementById(
        "manualButton"
      );

    const result =
      document.getElementById(
        "result"
      );

    const resultTitle =
      document.getElementById(
        "resultTitle"
      );

    const resultDetails =
      document.getElementById(
        "resultDetails"
      );

    const resetButton =
      document.getElementById(
        "resetButton"
      );


    /* =========================================================
       STATUS
       ========================================================= */

    function setScannerStatus(
      text
    ) {

      scannerStatus.textContent =
        text || "";

    }


    /* =========================================================
       CAMERA ERROR
       ========================================================= */

    function showCameraError(
      message
    ) {

      cameraError.textContent =
        message || "Kamera tidak dapat digunakan.";

      cameraError.classList.add(
        "visible"
      );

    }


    function hideCameraError() {

      cameraError.textContent =
        "";

      cameraError.classList.remove(
        "visible"
      );

    }


    /* =========================================================
       LOAD NAVIGATION.JS
       ========================================================= */

    function loadNavigationConfig() {

      return new Promise(
        function(resolve) {

          /*
           * Jika navigation.js sudah berhasil
           * dimuat melalui <script defer>,
           * langsung gunakan konfigurasinya.
           */

          if (
            window.BOLD_AFTER_DARK_NAVIGATION
          ) {

            try {

              validateNavigation(
                window.BOLD_AFTER_DARK_NAVIGATION
              );

              navigationConfig =
                window.BOLD_AFTER_DARK_NAVIGATION;

              resolve(
                navigationConfig
              );

              return;

            } catch (error) {

              console.error(
                "Navigation validation error:",
                error
              );

            }

          }


          /*
           * Kalau belum tersedia,
           * load ulang navigation.js secara
           * dinamis.
           */

          const script =
            document.createElement(
              "script"
            );

          script.src =
            NAVIGATION_SCRIPT +
            "?t=" +
            Date.now();

          script.async =
            false;

          script.onload =
            function() {

              try {

                const config =
                  window.BOLD_AFTER_DARK_NAVIGATION;

                validateNavigation(
                  config
                );

                navigationConfig =
                  config;

                resolve(
                  config
                );

              } catch (error) {

                console.error(
                  "Navigation config invalid:",
                  error
                );

                navigationConfig =
                  null;

                resolve(
                  null
                );

              }

            };


          script.onerror =
            function() {

              console.error(
                "navigation.js tidak dapat dimuat."
              );

              navigationConfig =
                null;

              resolve(
                null
              );

            };


          document.head.appendChild(
            script
          );

        }
      );

    }


    /* =========================================================
       VALIDATE NAVIGATION
       ========================================================= */

    function validateNavigation(
      config
    ) {

      if (
        !config ||
        typeof config !== "object"
      ) {

        throw new Error(
          "Konfigurasi navigation tidak ditemukan."
        );

      }


      const requiredPages = [
        "home",
        "admin",
        "report",
        "scanner",
        "registration"
      ];


      requiredPages.forEach(
        function(page) {

          if (
            typeof config[page] !== "string" ||
            !config[page].trim()
          ) {

            throw new Error(
              "Navigation '" +
              page +
              "' tidak tersedia."
            );

          }


          const url =
            new URL(
              config[page],
              window.location.origin
            );


          if (
            url.protocol !== "http:" &&
            url.protocol !== "https:"
          ) {

            throw new Error(
              "URL navigation '" +
              page +
              "' tidak valid."
            );

          }

        }
      );


      return true;

    }


    /* =========================================================
       NAVIGATE
       ========================================================= */

    async function navigateTo(
      page
    ) {

      /*
       * Baca ulang navigation.js sebelum
       * melakukan redirect.
       */

      const config =
        await loadNavigationConfig();


      if (!config) {

        alert(
          "Konfigurasi navigasi tidak dapat dimuat."
        );

        return;

      }


      const target =
        config[page];


      if (
        typeof target !== "string" ||
        !target.trim()
      ) {

        alert(
          "Alamat halaman '" +
          page +
          "' tidak tersedia."
        );

        return;

      }


      window.location.href =
        target;

    }


    /* =========================================================
       HOME BUTTON
       ========================================================= */

    homeButton.addEventListener(
      "click",
      async function(event) {

        event.preventDefault();

        await navigateTo(
          "home"
        );

      }
    );


    /* =========================================================
       START CAMERA
       ========================================================= */

    async function startCamera() {

      if (scannerStarted) {

        return;

      }


      hideCameraError();


      /*
       * Pastikan library tersedia.
       */

      if (
        typeof Html5Qrcode === "undefined"
      ) {

        showCameraError(
          "Library QR scanner belum berhasil dimuat. Periksa koneksi internet atau CDN html5-qrcode."
        );

        setScannerStatus(
          "Library scanner tidak tersedia."
        );

        return;

      }


      scannerStarted =
        true;


      setScannerStatus(
        "Meminta akses kamera..."
      );


      try {

        /*
         * Bersihkan area sebelumnya.
         */

        reader.innerHTML =
          "";


        scanner =
          new Html5Qrcode(
            "reader"
          );


        /*
         * Konfigurasi kamera.
         */

        const config = {

          fps: 10,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const minDimension =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              );

            const size =
              Math.floor(
                minDimension * 0.70
              );

            return {
              width: size,
              height: size
            };

          },

          aspectRatio: 1.0,

          disableFlip: false

        };


        /*
         * Kamera belakang menjadi
         * prioritas.
         */

        let cameraConfig = {
          facingMode: "environment"
        };


        try {

          await scanner.start(
            cameraConfig,
            config,
            onScanSuccess,
            onScanFailure
          );

        } catch (firstCameraError) {

          console.warn(
            "Environment camera failed:",
            firstCameraError
          );


          /*
           * Fallback:
           * cari kamera yang tersedia.
           */

          const cameras =
            await Html5Qrcode.getCameras();


          if (
            !cameras ||
            cameras.length === 0
          ) {

            throw new Error(
              "Tidak ada kamera yang terdeteksi pada perangkat ini."
            );

          }


          const selectedCamera =
            cameras[
              cameras.length - 1
            ];


          await scanner.start(
            selectedCamera.id,
            config,
            onScanSuccess,
            onScanFailure
          );

        }


        cameraPlaceholder.classList.add(
          "hidden"
        );


        setScannerStatus(
          "Kamera aktif. Arahkan kamera ke QR code."
        );


      } catch (error) {

        console.error(
          "CAMERA START ERROR:",
          error
        );


        scannerStarted =
          false;


        scanner =
          null;


        let message =
          "Kamera tidak dapat dimulai.";


        if (
          error &&
          error.message
        ) {

          message +=
            " " +
            error.message;

        }


        message +=
          " Pastikan izin kamera diberikan kepada browser dan halaman dibuka melalui HTTPS.";


        showCameraError(
          message
        );


        setScannerStatus(
          "Kamera gagal dimulai."
        );


        cameraPlaceholder.classList.remove(
          "hidden"
        );

      }

    }


    /* =========================================================
       SCAN SUCCESS
       ========================================================= */

    function onScanSuccess(
      decodedText
    ) {

      if (processing) {

        return;

      }


      const token =
        String(
          decodedText || ""
        ).trim();


      if (!token) {

        return;

      }


      processing =
        true;


      setScannerStatus(
        "QR terbaca. Memverifikasi..."
      );


      stopCamera();


      processToken(
        token
      );

    }


    /* =========================================================
       SCAN FAILURE
       ========================================================= */

    function onScanFailure(
      errorMessage
    ) {

      /*
       * Jangan tampilkan error scanning
       * biasa karena callback ini dipanggil
       * berkali-kali selama kamera aktif.
       */

    }


    /* =========================================================
       STOP CAMERA
       ========================================================= */

    async function stopCamera() {

      if (!scanner) {

        return;

      }


      try {

        await scanner.stop();

      } catch (error) {

        console.warn(
          "Camera stop warning:",
          error
        );

      }


      try {

        await scanner.clear();

      } catch (error) {

        console.warn(
          "Camera clear warning:",
          error
        );

      }


      scanner =
        null;

      scannerStarted =
        false;

    }


    /* =========================================================
       PROCESS TOKEN
       ========================================================= */

    async function processToken(
      token
    ) {

      showLoading();


      const cleanToken =
        String(
          token || ""
        ).trim();


      if (!cleanToken) {

        showServerError({
          message:
            "QR token kosong."
        });

        processing =
          false;

        return;

      }


      setScannerStatus(
        "Menghubungi server Supabase..."
      );


      const requestUrl =
        API_URL +
        "?action=checkIn&token=" +
        encodeURIComponent(
          cleanToken
        );


      try {

        const response =
          await fetch(
            requestUrl,
            {
              method: "GET",

              cache: "no-store",

              headers: {
                "Accept":
                  "application/json",

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_PUBLISHABLE_KEY
              }
            }
          );


        const rawResponse =
          await response.text();


        console.log(
          "CHECK-IN HTTP:",
          response.status
        );


        console.log(
          "CHECK-IN RESPONSE:",
          rawResponse
        );


        let data =
          null;


        try {

          data =
            rawResponse
              ? JSON.parse(
                  rawResponse
                )
              : null;

        } catch (error) {

          showServerError({
            message:
              "Server mengembalikan response JSON yang tidak valid."
          });

          return;

        }


        if (!response.ok) {

          showServerError({
            message:
              data &&
              data.message
                ? data.message
                : (
                    "Server check-in error. HTTP " +
                    response.status
                  )
          });

          return;

        }


        showResult(
          data
        );


      } catch (error) {

        console.error(
          "CHECK-IN ERROR:",
          error
        );


        showServerError({
          message:
            error &&
            error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
        });

      }

    }


    /* =========================================================
       MANUAL CHECK-IN
       ========================================================= */

    async function manualCheckIn() {

      if (processing) {

        return;

      }


      const token =
        manualToken.value.trim();


      if (!token) {

        showTemporaryError(
          "QR TOKEN KOSONG"
        );

        manualToken.focus();

        return;

      }


      processing =
        true;


      await stopCamera();


      processToken(
        token
      );

    }


    /* =========================================================
       SHOW RESULT
       ========================================================= */

    function showResult(
      data
    ) {

      result.className =
        "result";


      result.style.display =
        "block";


      /* =======================================================
         VALID
         ======================================================= */

      if (
        data &&
        data.status === "VALID"
      ) {

        result.classList.add(
          "valid"
        );


        resultTitle.textContent =
          "✓ ENTRY APPROVED";


        resultDetails.innerHTML =

          '<div class="detail">' +
            '<strong>NAMA</strong><br>' +
            escapeHtml(
              data.name
            ) +
          '</div>' +

          '<div class="detail">' +
            '<strong>PASS ID</strong><br>' +
            escapeHtml(
              data.passId
            ) +
          '</div>' +

          '<div class="detail">' +
            '<strong>ACCESS</strong><br>' +
            escapeHtml(
              data.accessType
            ) +
          '</div>' +

          (
            data.tablePackage
              ? (
                '<div class="detail">' +
                  '<strong>TABLE</strong><br>' +
                  escapeHtml(
                    data.tablePackage
                  ) +
                '</div>'
              )
              : ""
          ) +

          '<div class="detail">' +
            '<strong>CHECK-IN</strong><br>' +
            escapeHtml(
              data.checkInTime
            ) +
          '</div>';


        setScannerStatus(
          "Check-in berhasil."
        );


        return;

      }


      /* =======================================================
         ALREADY USED
         ======================================================= */

      if (
        data &&
        data.status === "ALREADY_USED"
      ) {

        result.classList.add(
          "used"
        );


        resultTitle.textContent =
          "⚠ ALREADY USED";


        resultDetails.innerHTML =

          '<div class="detail">' +
            '<strong>QR INI SUDAH DIGUNAKAN</strong>' +
          '</div>' +

          '<div class="detail">' +
            '<strong>NAMA</strong><br>' +
            escapeHtml(
              data.name
            ) +
          '</div>' +

          '<div class="detail">' +
            '<strong>PASS ID</strong><br>' +
            escapeHtml(
              data.passId
            ) +
          '</div>' +

          '<div class="detail">' +
            '<strong>ACCESS</strong><br>' +
            escapeHtml(
              data.accessType
            ) +
          '</div>' +

          (
            data.tablePackage
              ? (
                '<div class="detail">' +
                  '<strong>TABLE</strong><br>' +
                  escapeHtml(
                    data.tablePackage
                  ) +
                '</div>'
              )
              : ""
          ) +

          '<div class="detail">' +
            '<strong>CHECK-IN</strong><br>' +
            escapeHtml(
              data.checkInTime
            ) +
          '</div>';


        setScannerStatus(
          "QR sudah pernah digunakan."
        );


        return;

      }


      /* =======================================================
         INVALID
         ======================================================= */

      if (
        data &&
        (
          data.status === "INVALID" ||
          data.status === "NOT_FOUND"
        )
      ) {

        result.classList.add(
          "invalid"
        );


        resultTitle.textContent =
          "✕ INVALID QR";


        resultDetails.innerHTML =

          '<div class="detail">' +
            escapeHtml(
              data.message ||
              "QR tidak terdaftar."
            ) +
          '</div>';


        setScannerStatus(
          "QR tidak valid."
        );


        return;

      }


      /* =======================================================
         SYSTEM ERROR
         ======================================================= */

      result.classList.add(
        "error"
      );


      resultTitle.textContent =
        "SYSTEM ERROR";


      resultDetails.innerHTML =

        '<div class="detail">' +
          escapeHtml(
            data &&
            data.message
              ? data.message
              : "Terjadi kesalahan pada server check-in."
          ) +
        '</div>';


      setScannerStatus(
        "Terjadi kesalahan."
      );

    }


    /* =========================================================
       LOADING
       ========================================================= */

    function showLoading() {

      result.className =
        "result error";


      result.style.display =
        "block";


      resultTitle.textContent =
        "CHECKING...";


      resultDetails.innerHTML =

        '<div class="detail">' +
          'Memverifikasi QR ke Supabase...' +
        '</div>';

    }


    /* =========================================================
       SERVER ERROR
       ========================================================= */

    function showServerError(
      error
    ) {

      result.className =
        "result error";


      result.style.display =
        "block";


      resultTitle.textContent =
        "SYSTEM ERROR";


      resultDetails.innerHTML =

        '<div class="detail">' +
          escapeHtml(
            error &&
            error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
          ) +
        '</div>';


      setScannerStatus(
        "Server check-in tidak dapat dihubungi."
      );

    }


    /* =========================================================
       TEMPORARY ERROR
       ========================================================= */

    function showTemporaryError(
      message
    ) {

      result.className =
        "result invalid";


      result.style.display =
        "block";


      resultTitle.textContent =
        "✕ INVALID";


      resultDetails.innerHTML =

        '<div class="detail">' +
          escapeHtml(
            message
          ) +
        '</div>';


      setScannerStatus(
        "Input tidak valid."
      );

    }


    /* =========================================================
       RESET
       ========================================================= */

    async function resetScanner() {

      result.style.display =
        "none";


      result.className =
        "result";


      resultTitle.textContent =
        "";


      resultDetails.innerHTML =
        "";


      manualToken.value =
        "";


      processing =
        false;


      hideCameraError();


      cameraPlaceholder.classList.remove(
        "hidden"
      );


      setScannerStatus(
        "Siap mengaktifkan kamera."
      );


      /*
       * Jangan otomatis membuka kamera.
       * User tekan AKTIFKAN KAMERA.
       */

    }


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ""
          : value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================================================
       EVENT LISTENERS
       ========================================================= */

    startCameraButton.addEventListener(
      "click",
      async function() {

        startCameraButton.disabled =
          true;

        startCameraButton.textContent =
          "MEMULAI...";


        await startCamera();


        startCameraButton.disabled =
          false;

        startCameraButton.textContent =
          "AKTIFKAN KAMERA";

      }
    );


    manualButton.addEventListener(
      "click",
      manualCheckIn
    );


    resetButton.addEventListener(
      "click",
      resetScanner
    );


    manualToken.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          manualCheckIn();

        }

      }
    );


    /* =========================================================
       PAGE LOAD
       ========================================================= */

    window.addEventListener(
      "DOMContentLoaded",
      async function() {

        setScannerStatus(
          "Memuat konfigurasi navigasi..."
        );


        /*
         * Navigation tidak boleh menghalangi
         * scanner.
         */

        await loadNavigationConfig();


        /*
         * Scanner TIDAK langsung meminta kamera.
         *
         * User akan melihat tombol:
         *
         * AKTIFKAN KAMERA
         *
         * lalu browser meminta permission.
         */

        if (
          typeof Html5Qrcode === "undefined"
        ) {

          showCameraError(
            "Library scanner belum tersedia. Periksa koneksi internet."
          );

          setScannerStatus(
            "Library scanner tidak tersedia."
          );

          return;

        }


        setScannerStatus(
          "Scanner siap. Tekan AKTIFKAN KAMERA."
        );

      }
    );


    /* =========================================================
       PAGE UNLOAD
       ========================================================= */

    window.addEventListener(
      "beforeunload",
      function() {

        if (scanner) {

          scanner.stop()
            .catch(
              function() {}
            );

        }

      }
    );

  </script>

</body>

</html>
