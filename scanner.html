  <script>
    "use strict";

    /* =========================================================

    const SUPABASE_URL =

    const API_URL =

    /* =========================================================

       =========================================================

       Sumber:
       /config/navigation.js

       Isi navigation.js:

       const NAVIGATION = Object.freeze({
         home: "https://boldafterdark.my.id/index.html",
         admin: "https://boldafterdark.my.id/admin.html",
         report: "https://boldafterdark.my.id/report.html",
         scanner: "https://boldafterdark.my.id/scanner.html",
         registration: "https://boldafterdark.my.id/registration/index.html"
       });

       ========================================================= */

    let navigationConfig = null;


    /* =========================================================
       SCANNER STATE
       ========================================================= */

    let html5QrCode = null;

    let processing = false;

    let requestTimeout = null;

    const homeButton =

      );

      );

      );


    /* =========================================================
       LOAD NAVIGATION
       ========================================================= */

    function loadNavigationConfig() {

      try {

        if (
          typeof NAVIGATION === "undefined"
        ) {

          throw new Error(
            "NAVIGATION tidak ditemukan."
          );

        }

        if (
          !NAVIGATION ||
          typeof NAVIGATION !== "object"
        ) {

          throw new Error(
            "Format NAVIGATION tidak valid."
          );

        }

        const requiredPages = [
          "home",
          "admin",
          "report",
          "scanner"
        ];

        requiredPages.forEach(
          function(page) {

            if (
              typeof NAVIGATION[page] !== "string" ||
              !NAVIGATION[page].trim()
            ) {

              throw new Error(
                "URL " +
                page +
                " tidak tersedia."
              );

            }

            const url =
              new URL(
                NAVIGATION[page]
              );

            if (
              url.protocol !== "https:" &&
              url.protocol !== "http:"
            ) {

              throw new Error(
                "Protocol URL " +
                page +
                " tidak valid."
              );

            }

          }
        );

        navigationConfig =
          NAVIGATION;

        navigationError.style.display =
          "none";

        return true;

      } catch (error) {

        console.error(
          "NAVIGATION ERROR:",
          error
        );

        navigationConfig =
          null;

        navigationError.textContent =
          "Konfigurasi navigasi tidak dapat dimuat. " +
          "Pastikan /config/navigation.js tersedia " +
          "dan konfigurasi NAVIGATION valid.";

        navigationError.style.display =
          "block";

        return false;

      }

    }


    /* =========================================================
       NAVIGATION
       ========================================================= */

    function navigateTo(
      pageName
    ) {

      if (
        !navigationConfig
      ) {

        if (
          !loadNavigationConfig()
        ) {

          alert(
            "Konfigurasi navigasi tidak dapat dimuat."
          );

          return;

        }

      }

      const target =
        navigationConfig[pageName];

      if (
        typeof target !== "string" ||
        !target.trim()
      ) {

        alert(
          "Alamat halaman '" +
          pageName +
          "' tidak tersedia."
        );

        return;

      }

      window.location.href =
        target;

    }


    /* =========================================================
       HOME BUTTON
       ========================================================= */

    homeButton.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        navigateTo(
          "home"
        );

      }
    );


    /* =========================================================
       STATUS
       ========================================================= */

    function setScannerStatus(
      text
    ) {

      scannerStatus.textContent =
        text || "";

    }


    /* =========================================================
       START CAMERA
       ========================================================= */

    async function startScanner() {

      processing = false;

      setScannerStatus(
        "Memulai kamera..."
      );

      /*
       * Pastikan library tersedia.
       */

      if (
        typeof Html5Qrcode === "undefined"
      ) {

        showServerError({
          message:
            "Library kamera QR tidak berhasil dimuat."
        });

        return;

      }

      /*
       * Bersihkan scanner lama.
       */

      if (html5QrCode) {

        try {

          const state =
            html5QrCode.getState();

          if (
            state ===
            Html5QrcodeScannerState.SCANNING
          ) {

            await html5QrCode.stop();

          }

        } catch (error) {

          console.warn(
            "Stop previous scanner:",
            error
          );

        }

        try {

          await html5QrCode.clear();

        } catch (error) {

          console.warn(
            "Clear previous scanner:",
            error
          );

        }

        html5QrCode =
          null;

      }

      /*
       * Bersihkan reader.
       */

      reader.innerHTML =
        "";

      /*
       * Buat instance kamera.
       */

      html5QrCode =
        new Html5Qrcode(
          "reader"
        );

      try {

        /*
         * Ambil daftar kamera.
         */

        const cameras =
          await Html5Qrcode.getCameras();

        if (
          !cameras ||
          cameras.length === 0
        ) {

          throw new Error(
            "Kamera tidak ditemukan."
          );

        }

        /*
         * Prioritaskan kamera belakang.
         */

        let selectedCamera =
          cameras[0];

        for (
          const camera of cameras
        ) {

          const label =
            String(
              camera.label || ""
            ).toLowerCase();

          if (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment")
          ) {

            selectedCamera =
              camera;

            break;

          }

        }

        /*
         * Mulai kamera.
         */

        await html5QrCode.start(

          selectedCamera.id,

          {
            fps: 10,

            qrbox: function(
              viewfinderWidth,
              viewfinderHeight
            ) {

              const minEdge =
                Math.min(
                  viewfinderWidth,
                  viewfinderHeight
                );

              const size =
                Math.min(
                  280,
                  Math.floor(
                    minEdge * 0.72
                  )
                );

              return {
                width: size,
                height: size
              };

            },

            aspectRatio:
              1.0,

            disableFlip:
              false

          },

          onScanSuccess,

          onScanError

        );

        setScannerStatus(
          "Kamera aktif. Arahkan kamera ke QR code."
        );

      } catch (error) {

        console.error(
          "CAMERA START ERROR:",
          error
        );

        let message =
          "Kamera tidak dapat diaktifkan.";

        if (
          error &&
          error.message
        ) {

          message =
            error.message;

        }

        showServerError({
          message:
            message +
            " Pastikan izin kamera diberikan dan halaman dibuka melalui HTTPS."
        });

        setScannerStatus(
          "Kamera tidak aktif."
        );

      }

    }


    /* =========================================================
       QR SCAN SUCCESS
       ========================================================= */

    async function onScanSuccess(
      decodedText
    ) {

      if (processing) {
        return;
      }

      const token =
        String(
          decodedText || ""
        ).trim();

      if (!token) {

        return;

      }

      processing =
        true;

      await stopScanner();

      await processToken(
        token
      );

    }


    /* =========================================================
       QR SCAN ERROR
       ========================================================= */

    function onScanError(
      errorMessage
    ) {

      /*
       * Error scan biasa tidak ditampilkan
       * karena callback ini dipanggil terus-menerus
       * ketika kamera belum menemukan QR.
       */

    }


    /* =========================================================
       STOP SCANNER
       ========================================================= */

    async function stopScanner() {

      if (!html5QrCode) {
        return;
      }

      try {

        const state =
          html5QrCode.getState();

        if (
          state ===
          Html5QrcodeScannerState.SCANNING
        ) {

          await html5QrCode.stop();

        }

      } catch (error) {

        console.warn(
          "SCANNER STOP ERROR:",
          error
        );

      }

      try {

        await html5QrCode.clear();

      } catch (error) {

        console.warn(
          "SCANNER CLEAR ERROR:",
          error
        );

      }

      html5QrCode =
        null;

    }


    /* =========================================================
       PROCESS TOKEN
       ========================================================= */

    async function processToken(
      token
    ) {

      showLoading();

      setScannerStatus(
        "Menghubungi server Supabase..."
      );

      const cleanToken =
        String(
          token || ""
        ).trim();

      if (!cleanToken) {

        showServerError({
          message:
            "QR token kosong."
        });

        processing =
          false;

        return;

      }

      const requestUrl =
        API_URL +
        "?action=checkIn&token=" +
        encodeURIComponent(
          cleanToken
        );

      if (requestTimeout) {

        clearTimeout(
          requestTimeout
        );

        requestTimeout =
          null;

      }

      let finished =
        false;

      requestTimeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }

            finished =
              true;

            requestTimeout =
              null;

            showServerError({
              message:
                "Server check-in tidak memberikan respons dalam 15 detik."
            });

          },
          15000
        );

      try {

        const response =
          await fetch(
            requestUrl,
            {
              method: "GET",

              cache: "no-store",

              headers: {
                "Accept":
                  "application/json",

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_PUBLISHABLE_KEY
              }
            }
          );

        if (finished) {
          return;
        }

        finished =
          true;

        if (requestTimeout) {

          clearTimeout(
            requestTimeout
          );

          requestTimeout =
            null;

        }

        const rawResponse =
          await response.text();

        let data =
          null;

        try {

          data =
            rawResponse
              ? JSON.parse(
                  rawResponse
                )
              : null;

        } catch (error) {

          console.error(
            "JSON PARSE ERROR:",
            error
          );

          showServerError({
            message:
              "Server mengembalikan response yang tidak valid."
          });

          return;

        }

        if (
          !response.ok
        ) {

          showServerError({
            message:
              data &&
              data.message
                ? data.message
                : (
                    "Check-in gagal. HTTP " +
                    response.status
                  )
          });

          return;

        }

        showResult(
          data
        );

      } catch (error) {

        if (finished) {
          return;
        }

        finished =
          true;

        if (requestTimeout) {

          clearTimeout(
            requestTimeout
          );

          requestTimeout =
            null;

        }

        console.error(
          "CHECK-IN REQUEST ERROR:",
          error
        );

        showServerError({
          message:
            error &&
            error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
        });

      }

    }


    /* =========================================================
       MANUAL CHECK-IN
       ========================================================= */

    async function manualCheckIn() {

      if (processing) {

      }

      const token =
        manualToken.value.trim();

      if (!token) {

        showTemporaryError(
          "QR TOKEN KOSONG"
        );

        manualToken.focus();

        return;

      }

      processing =
        true;

      await stopScanner();

      await processToken(

    /* =========================================================
       SHOW RESULT
       ========================================================= */

    function showResult(
      data
    ) {

      result.className =
        "result";

      result.style.display =
        "block";


      /* =======================================================
         VALID
         ======================================================= */

      if (
        data &&
        data.status === "VALID"
      ) {

        result.classList.add(
          "valid"
        );

        resultTitle.textContent =
          "✓ ENTRY APPROVED";

        resultDetails.innerHTML =
          '<div class="detail">' +
          '<strong>NAMA</strong><br>' +
          escapeHtml(
            data.name
          ) +
          '</div>' +

          '<div class="detail">' +
          '<strong>PASS ID</strong><br>' +
          escapeHtml(
            data.passId
          ) +
          '</div>' +

          '<div class="detail">' +
          '<strong>ACCESS</strong><br>' +
          escapeHtml(
            data.accessType
          ) +
          '</div>' +

          (
            data.tablePackage
              ? (
                  '<div class="detail">' +
                  '<strong>TABLE</strong><br>' +
                  escapeHtml(
                    data.tablePackage
                  ) +
                  '</div>'
                )
              : ""
          ) +

          '<div class="detail">' +
          '<strong>CHECK-IN</strong><br>' +
          escapeHtml(
            data.checkInTime
          ) +
          '</div>';

        setScannerStatus(
          "Check-in berhasil."
        );

        return;

      }


      /* =======================================================
         ALREADY USED
         ======================================================= */

      if (
        data &&
        (
          data.status === "ALREADY_USED" ||
          data.status === "ALREADY-USED"
        )
      ) {

        result.classList.add(
          "used"
        );

        resultTitle.textContent =
          "⚠ ALREADY USED";

        resultDetails.innerHTML =
          '<div class="detail">' +
          '<strong>QR INI SUDAH DIGUNAKAN</strong>' +
          '</div>' +

          '<div class="detail">' +
          '<strong>NAMA</strong><br>' +
          escapeHtml(
            data.name
          ) +
          '</div>' +

          '<div class="detail">' +
          '<strong>PASS ID</strong><br>' +
          escapeHtml(
            data.passId
          ) +
          '</div>' +

          '<div class="detail">' +
          '<strong>ACCESS</strong><br>' +
          escapeHtml(
            data.accessType
          ) +
          '</div>' +

          (
            data.tablePackage
              ? (
                  '<div class="detail">' +
                  '<strong>TABLE</strong><br>' +
                  escapeHtml(
                    data.tablePackage
                  ) +
                  '</div>'
                )
              : ""
          ) +

          '<div class="detail">' +
          '<strong>CHECK-IN</strong><br>' +
          escapeHtml(
            data.checkInTime
          ) +
          '</div>';

        setScannerStatus(
          "QR sudah pernah digunakan."
        );

        return;

      }


      /* =======================================================
         INVALID
         ======================================================= */

      if (
        data &&
        (
          data.status === "INVALID" ||
          data.status === "NOT_FOUND"
        )
      ) {

        result.classList.add(
          "invalid"
        );

        resultTitle.textContent =
          "✕ INVALID QR";

        resultDetails.innerHTML =
          '<div class="detail">' +
          escapeHtml(
            data.message ||
            "QR tidak terdaftar."
          ) +
          '</div>';

        setScannerStatus(
          "QR tidak valid."
        );

        return;

      }


      /* =======================================================
         SYSTEM ERROR
         ======================================================= */

      result.classList.add(
        "error"
      );

      resultTitle.textContent =
        "SYSTEM ERROR";

      resultDetails.innerHTML =
        '<div class="detail">' +
        escapeHtml(
          data &&
          data.message
            ? data.message
            : "Terjadi kesalahan pada server check-in."
        ) +
        '</div>';

      setScannerStatus(
        "Terjadi kesalahan."
      );

    }


    /* =========================================================
       SHOW LOADING
       ========================================================= */

    function showLoading() {

      result.className =
        "result error";

      result.style.display =
        "block";

      resultTitle.textContent =
        "CHECKING...";

      resultDetails.innerHTML =
        '<div class="detail">' +
        'Memverifikasi QR ke Supabase...' +
        '</div>';

    }


    /* =========================================================
       SERVER ERROR
       ========================================================= */

    function showServerError(
      error
    ) {

      result.className =
        "result error";

      result.style.display =
        "block";

      resultTitle.textContent =
        "SYSTEM ERROR";

      resultDetails.innerHTML =
        '<div class="detail">' +
        escapeHtml(
          error &&
          error.message
            ? error.message
            : "Tidak dapat menghubungi server check-in."
        ) +
        '</div>';

      setScannerStatus(
        "Server check-in tidak dapat dihubungi."
      );

    }


    /* =========================================================
       TEMPORARY ERROR
       ========================================================= */

    function showTemporaryError(
      message
    ) {

      result.className =
        "result invalid";

      result.style.display =
        "block";

      resultTitle.textContent =
        "✕ INVALID";

      resultDetails.innerHTML =
        '<div class="detail">' +
        escapeHtml(
          message
        ) +
        '</div>';

      setScannerStatus(
        "Input tidak valid."
      );

    }


    /* =========================================================
       RESET SCANNER
       ========================================================= */

    async function resetScanner() {

      if (requestTimeout) {

        clearTimeout(
          requestTimeout
        );

        requestTimeout =
          null;

      }

      await stopScanner();

      result.style.display =
        "none";

      result.className =
        "result";

      resultTitle.textContent =
        "";

      resultDetails.innerHTML =
        "";

      manualToken.value =
        "";

      processing =
        false;

      await startScanner();

    }


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ""
          : value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================================================
       EVENT LISTENERS
       ========================================================= */

    manualButton.addEventListener(
      "click",
      manualCheckIn
    );

    resetButton.addEventListener(
      "click",
      resetScanner
    );

    manualToken.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          manualCheckIn();

        }

      }
    );


    /* =========================================================
       PAGE LOAD
       ========================================================= */

    window.addEventListener(
      "load",
      async function() {

        /*
         * Load navigation.
         *
         * Kegagalan navigation TIDAK menghentikan kamera.
         */

        loadNavigationConfig();

        /*
         * Kamera dijalankan secara terpisah.
         */

        await startScanner();

      }
    );

  </script>

</body>
</html>
