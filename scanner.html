<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOLD AFTER DARK — CHECK IN</title>

  <!-- =========================================================
       NAVIGATION CONFIG
       ========================================================= -->

  <script src="/config/navigation.js"></script>

  <!-- =========================================================
       QR SCANNER LIBRARY
       ========================================================= -->

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #2a0000 0%,
          #080808 45%,
          #000000 100%
        );

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* =========================================================
       TOP NAV
       ========================================================= */

    .top-nav {
      width: 100%;
      margin-bottom: 18px;
      text-align: left;
    }

    .home-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 11px 16px;

      background: #111111;

      color: #ffffff;

      border: 1px solid #444444;

      border-radius: 8px;

      text-decoration: none;

      font-size: 13px;
      font-weight: 800;

      letter-spacing: 0.5px;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .home-button:hover {
      background: #1d1d1d;
      border-color: #e00000;
    }

    .home-button:active {
      transform: scale(0.98);
    }

    /* =========================================================
       BRAND
       ========================================================= */

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .brand .after {
      color: #e00000;
    }

    .brand .dark {
      color: #ffffff;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 3px;
      color: #aaaaaa;
      margin-bottom: 24px;
    }

    /* =========================================================
       SCANNER CARD
       ========================================================= */

    .scanner-card {
      background: #111111;

      border: 1px solid #333333;

      border-radius: 18px;

      padding: 16px;

      box-shadow:
        0 0 30px rgba(255, 0, 0, 0.12);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    #reader video {
      width: 100% !important;
      border-radius: 10px;
    }

    #reader__dashboard_section_swaplink {
      display: none !important;
    }

    #reader__status_span {
      display: none !important;
    }

    #reader__dashboard_section_csr {
      display: none !important;
    }

    #reader__scan_region {
      min-height: 180px;
    }

    /* =========================================================
       MANUAL TOKEN
       ========================================================= */

    .manual {
      margin-top: 18px;

      display: flex;

      gap: 8px;
    }

    .manual input {
      flex: 1;

      min-width: 0;

      padding: 14px;

      background: #1c1c1c;

      color: #ffffff;

      border: 1px solid #444444;

      border-radius: 8px;

      font-size: 15px;

      outline: none;
    }

    .manual input::placeholder {
      color: #777777;
    }

    .manual input:focus {
      border-color: #e00000;

      box-shadow:
        0 0 0 2px rgba(224, 0, 0, 0.12);
    }

    .manual button {
      padding: 14px 18px;

      background: #e00000;

      color: #ffffff;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;
    }

    .manual button:hover {
      background: #ff0000;
    }

    .manual button:active {
      transform: scale(0.98);
    }

    .manual button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =========================================================
       RESULT
       ========================================================= */

    .result {
      margin-top: 18px;

      padding: 20px;

      border-radius: 14px;

      display: none;
    }

    .result.valid {
      display: block;

      background: #062d16;

      border: 2px solid #16c75a;
    }

    .result.used {
      display: block;

      background: #2d2100;

      border: 2px solid #e2b400;
    }

    .result.invalid {
      display: block;

      background: #300000;

      border: 2px solid #e00000;
    }

    .result.error {
      display: block;

      background: #222222;

      border: 2px solid #777777;
    }

    .result-title {
      font-size: 28px;

      font-weight: 900;

      margin-bottom: 12px;
    }

    .valid .result-title {
      color: #16c75a;
    }

    .used .result-title {
      color: #e2b400;
    }

    .invalid .result-title {
      color: #ff3333;
    }

    .error .result-title {
      color: #ffffff;
    }

    .detail {
      margin-top: 8px;

      font-size: 15px;

      color: #dddddd;

      line-height: 1.5;
    }

    .detail strong {
      color: #ffffff;
    }

    /* =========================================================
       RESET
       ========================================================= */

    .reset {
      margin-top: 18px;

      width: 100%;

      padding: 14px;

      background: #e00000;

      color: #ffffff;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

      font-size: 15px;
    }

    .reset:hover {
      background: #ff0000;
    }

    .reset:active {
      transform: scale(0.98);
    }

    /* =========================================================
       STATUS
       ========================================================= */

    .status-text {
      margin-top: 12px;

      font-size: 12px;

      color: #888888;

      min-height: 18px;

      line-height: 1.5;
    }

    /* =========================================================
       NAVIGATION ERROR
       ========================================================= */

    .navigation-error {
      display: none;

      margin-top: 12px;

      padding: 10px 12px;

      background: rgba(224, 0, 0, 0.1);

      border: 1px solid rgba(224, 0, 0, 0.4);

      border-radius: 8px;

      color: #ff8b8b;

      font-size: 11px;

      line-height: 1.5;

      text-align: left;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {
      margin-top: 20px;

      font-size: 11px;

      color: #666666;

      letter-spacing: 2px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      .top-nav {
        margin-bottom: 14px;
      }

      .home-button {
        width: 100%;
      }

      .brand {
        font-size: 23px;
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 11px;
        letter-spacing: 2px;
      }

      .scanner-card {
        padding: 12px;
        border-radius: 15px;
      }

      #reader {
        min-height: 250px;
      }

      .manual {
        flex-direction: column;
      }

      .manual button {
        width: 100%;
      }

      .result {
        padding: 18px 14px;
      }

      .result-title {
        font-size: 22px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- =======================================================
         HOME BUTTON
         ======================================================= -->

    <div class="top-nav">

      <a
        href="#"
        id="homeButton"
        class="home-button"
      >
        ← HOME
      </a>

    </div>

    <!-- =======================================================
         BRAND
         ======================================================= -->

    <div class="brand">
      BOLD <span class="after">AFTER</span> <span class="dark">DARK</span>
    </div>

    <div class="subtitle">
      EVENT CHECK-IN
    </div>

    <!-- =======================================================
         SCANNER
         ======================================================= -->

    <div class="scanner-card">

      <div id="reader"></div>

      <div
        id="scannerStatus"
        class="status-text"
      >
        Menyiapkan kamera...
      </div>

      <!-- =====================================================
           NAVIGATION ERROR
           ===================================================== -->

      <div
        id="navigationError"
        class="navigation-error"
      ></div>

      <!-- =====================================================
           MANUAL TOKEN
           ===================================================== -->

      <div class="manual">

        <input
          id="manualToken"
          type="text"
          placeholder="Masukkan QR token"
          autocomplete="off"
          spellcheck="false"
        >

        <button
          type="button"
          id="manualButton"
        >
          CHECK
        </button>

      </div>

      <!-- =====================================================
           RESULT
           ===================================================== -->

      <div
        id="result"
        class="result"
      >

        <div
          id="resultTitle"
          class="result-title"
        ></div>

        <div id="resultDetails"></div>

        <button
          type="button"
          id="resetButton"
          class="reset"
        >
          SCAN BERIKUTNYA
        </button>

      </div>

    </div>

    <!-- =======================================================
         FOOTER
         ======================================================= -->

    <div class="footer">
      BOLD AFTER DARK • THE NIGHT STARTS HERE
    </div>

  </div>

  <script>

    "use strict";

    /* =========================================================
       SUPABASE
       ========================================================= */

    const SUPABASE_URL =
      "https://yrvnmmascklkuzpjkwxn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_YGi3tPBuF9tW4KKnLJ5dDQ_AcBZ19WH";

    const API_URL =
      SUPABASE_URL +
      "/functions/v1/dynamic-service";


    /* =========================================================
       STATE
       ========================================================= */

    let scanner = null;

    let processing = false;

    let requestTimeout = null;


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const homeButton =
      document.getElementById(
        "homeButton"
      );

    const reader =
      document.getElementById(
        "reader"
      );

    const scannerStatus =
      document.getElementById(
        "scannerStatus"
      );

    const navigationError =
      document.getElementById(
        "navigationError"
      );

    const manualToken =
      document.getElementById(
        "manualToken"
      );

    const manualButton =
      document.getElementById(
        "manualButton"
      );

    const result =
      document.getElementById(
        "result"
      );

    const resultTitle =
      document.getElementById(
        "resultTitle"
      );

    const resultDetails =
      document.getElementById(
        "resultDetails"
      );

    const resetButton =
      document.getElementById(
        "resetButton"
      );


    /* =========================================================
       NAVIGATION CONFIGURATION
       =========================================================

       navigation.js harus berisi:

       const NAVIGATION = Object.freeze({
         home: "...",
         admin: "...",
         report: "...",
         scanner: "...",
         registration: "..."
       });

       Kita menerima dua bentuk:

       1. window.BOLD_AFTER_DARK_NAVIGATION

       atau

       2. NAVIGATION

       ========================================================= */

    function getNavigationConfig() {

      try {

        if (
          window.BOLD_AFTER_DARK_NAVIGATION &&
          typeof window.BOLD_AFTER_DARK_NAVIGATION === "object"
        ) {

          return window.BOLD_AFTER_DARK_NAVIGATION;

        }

        if (
          typeof NAVIGATION !== "undefined" &&
          NAVIGATION &&
          typeof NAVIGATION === "object"
        ) {

          return NAVIGATION;

        }

      } catch (error) {

        console.error(
          "Navigation config error:",
          error
        );

      }

      return null;

    }


    /* =========================================================
       VALIDATE NAVIGATION
       ========================================================= */

    function validateNavigationConfig(
      config
    ) {

      if (
        !config ||
        typeof config !== "object"
      ) {

        throw new Error(
          "Konfigurasi NAVIGATION tidak ditemukan."
        );

      }

      const requiredPages = [
        "home",
        "admin",
        "report",
        "scanner"
      ];

      requiredPages.forEach(
        function(page) {

          if (
            typeof config[page] !== "string" ||
            !config[page].trim()
          ) {

            throw new Error(
              "URL '" +
              page +
              "' tidak tersedia."
            );

          }

          const url =
            new URL(
              config[page]
            );

          if (
            url.protocol !== "https:" &&
            url.protocol !== "http:"
          ) {

            throw new Error(
              "URL '" +
              page +
              "' tidak valid."
            );

          }

        }
      );

      return true;

    }


    /* =========================================================
       INITIALIZE NAVIGATION
       ========================================================= */

    function initializeNavigation() {

      try {

        const config =
          getNavigationConfig();

        validateNavigationConfig(
          config
        );

        navigationError.style.display =
          "none";

        homeButton.href =
          config.home;

        /*
         * Ini penting:
         *
         * Hover HOME sekarang akan menampilkan
         * https://boldafterdark.my.id/index.html
         *
         * bukan scanner.html.
         */

        console.log(
          "NAVIGATION HOME:",
          config.home
        );

        console.log(
          "NAVIGATION ADMIN:",
          config.admin
        );

        console.log(
          "NAVIGATION REPORT:",
          config.report
        );

        console.log(
          "NAVIGATION SCANNER:",
          config.scanner
        );

        return true;

      } catch (error) {

        console.error(
          "NAVIGATION CONFIGURATION ERROR:",
          error
        );

        /*
         * Jangan menghentikan scanner.
         *
         * Kalau navigation.js gagal,
         * kamera TETAP harus bisa aktif.
         */

        navigationError.textContent =
          "Konfigurasi navigasi tidak dapat dimuat. " +
          "Kamera tetap dapat digunakan.";

        navigationError.style.display =
          "block";

        /*
         * Fallback absolut untuk HOME.
         */

        homeButton.href =
          "https://boldafterdark.my.id/index.html";

        return false;

      }

    }


    /* =========================================================
       HOME CLICK
       ========================================================= */

    homeButton.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        const config =
          getNavigationConfig();

        let target =
          "https://boldafterdark.my.id/index.html";

        try {

          if (config) {

            validateNavigationConfig(
              config
            );

            target =
              config.home;

          }

        } catch (error) {

          console.warn(
            "Menggunakan fallback HOME:",
            error
          );

        }

        window.location.href =
          target;

      }
    );


    /* =========================================================
       STATUS
       ========================================================= */

    function setScannerStatus(
      text
    ) {

      scannerStatus.textContent =
        text || "";

    }


    /* =========================================================
       START CAMERA
       ========================================================= */

    async function startScanner() {

      processing = false;

      setScannerStatus(
        "Memulai kamera..."
      );

      /*
       * Hapus scanner lama jika ada.
       */

      if (scanner) {

        try {

          await scanner.clear();

        } catch (error) {

          console.warn(
            "Scanner clear error:",
            error
          );

        }

        scanner = null;

      }

      reader.innerHTML =
        "";


      /*
       * Pastikan library tersedia.
       */

      if (
        typeof Html5QrcodeScanner ===
        "undefined"
      ) {

        showServerError({
          message:
            "Library QR scanner belum termuat."
        });

        return;

      }


      try {

        scanner =
          new Html5QrcodeScanner(
            "reader",
            {
              fps: 10,

              qrbox: {
                width: 250,
                height: 250
              },

              aspectRatio: 1.0,

              rememberLastUsedCamera:
                true,

              supportedScanTypes: [
                Html5QrcodeScanType.SCAN_TYPE_CAMERA,
                Html5QrcodeScanType.SCAN_TYPE_FILE
              ]
            },
            false
          );


        scanner.render(
          onScanSuccess,
          onScanError
        );


        setScannerStatus(
          "Arahkan kamera ke QR code."
        );


      } catch (error) {

        console.error(
          "SCANNER INITIALIZATION ERROR:",
          error
        );

        showServerError({
          message:
            "Kamera scanner tidak dapat dimulai: " +
            (
              error.message ||
              "unknown error"
            )
        });

      }

    }


    /* =========================================================
       QR SUCCESS
       ========================================================= */

    function onScanSuccess(
      decodedText
    ) {

      if (processing) {
        return;
      }

      const token =
        String(
          decodedText || ""
        ).trim();

      if (!token) {

        showServerError({
          message:
            "QR terbaca tetapi token kosong."
        });

        return;

      }

      processing =
        true;

      stopScanner();

      processToken(
        token
      );

    }


    /* =========================================================
       QR ERROR
       ========================================================= */

    function onScanError() {

      /*
       * Error scanning biasa
       * sengaja tidak ditampilkan.
       */

    }


    /* =========================================================
       STOP SCANNER
       ========================================================= */

    async function stopScanner() {

      if (!scanner) {
        return;
      }

      try {

        await scanner.clear();

      } catch (error) {

        console.warn(
          "Scanner stop error:",
          error
        );

      }

      scanner = null;

    }


    /* =========================================================
       PROCESS TOKEN
       ========================================================= */

    async function processToken(
      token
    ) {

      showLoading();

      setScannerStatus(
        "Menghubungi server Supabase..."
      );

      const cleanToken =
        String(
          token || ""
        ).trim();

      if (!cleanToken) {

        showServerError({
          message:
            "QR token kosong."
        });

        processing =
          false;

        return;

      }


      const requestUrl =
        API_URL +
        "?action=checkIn&token=" +
        encodeURIComponent(
          cleanToken
        );


      if (requestTimeout) {

        clearTimeout(
          requestTimeout
        );

        requestTimeout =
          null;

      }


      let finished =
        false;


      requestTimeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }

            finished =
              true;

            requestTimeout =
              null;

            showServerError({
              message:
                "Server check-in tidak memberikan respons dalam 15 detik."
            });

          },
          15000
        );


      try {

        const response =
          await fetch(
            requestUrl,
            {
              method: "GET",

              cache: "no-store",

              headers: {
                "Accept":
                  "application/json"
              }
            }
          );


        if (finished) {
          return;
        }


        finished =
          true;


        if (requestTimeout) {

          clearTimeout(
            requestTimeout
          );

          requestTimeout =
            null;

        }


        const rawResponse =
          await response.text();


        let data =
          null;


        try {

          data =
            JSON.parse(
              rawResponse
            );

        } catch (error) {

          console.error(
            "JSON PARSE ERROR:",
            error,
            rawResponse
          );

          showServerError({
            message:
              "Server mengembalikan response yang tidak valid."
          });

          return;

        }


        showResult(
          data
        );


      } catch (error) {

        if (finished) {
          return;
        }

        finished =
          true;


        if (requestTimeout) {

          clearTimeout(
            requestTimeout
          );

          requestTimeout =
            null;

        }


        console.error(
          "CHECK-IN REQUEST ERROR:",
          error
        );


        showServerError({
          message:
            error &&
            error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
        });

      }

    }


    /* =========================================================
       MANUAL CHECK-IN
       ========================================================= */

    function manualCheckIn() {

      if (processing) {
        return;
      }

      const token =
        manualToken.value.trim();

      if (!token) {

        showTemporaryError(
          "QR TOKEN KOSONG"
        );

        manualToken.focus();

        return;

      }

      processing =
        true;

      stopScanner();

      processToken(
        token
      );

    }


    /* =========================================================
       RESULT
       ========================================================= */

    function showResult(
      data
    ) {

      result.className =
        "result";

      result.style.display =
        "block";


      /* =======================================================
         VALID
         ======================================================= */

      if (
        data &&
        data.status === "VALID"
      ) {

        result.classList.add(
          "valid"
        );

        resultTitle.textContent =
          "✓ ENTRY APPROVED";


        resultDetails.innerHTML =
          '<div class="detail">' +
          '<strong>NAMA</strong><br>' +
          escapeHtml(
            data.name
          ) +
          '</div>' +

          '<div class="detail">' +
          '<strong>PASS ID</strong><br>' +
          escapeHtml(
            data.passId
          ) +
          '</div>' +

          '<div class="detail">' +
          '<strong>ACCESS</strong><br>' +
          escapeHtml(
            data.accessType
          ) +
          '</div>' +

          (
            data.tablePackage
              ? (
                  '<div class="detail">' +
                  '<strong>TABLE</strong><br>' +
                  escapeHtml(
                    data.tablePackage
                  ) +
                  '</div>'
                )
              : ""
          ) +

          '<div class="detail">' +
          '<strong>CHECK-IN</strong><br>' +
          escapeHtml(
            data.checkInTime
          ) +
          '</div>';


        setScannerStatus(
          "Check-in berhasil."
        );

        return;

      }


      /* =======================================================
         ALREADY USED
         ======================================================= */

      if (
        data &&
        data.status === "ALREADY_USED"
      ) {

        result.classList.add(
          "used"
        );

        resultTitle.textContent =
          "⚠ ALREADY USED";


        resultDetails.innerHTML =
          '<div class="detail">' +
          '<strong>QR INI SUDAH DIGUNAKAN</strong>' +
          '</div>' +

          '<div class="detail">' +
          '<strong>NAMA</strong><br>' +
          escapeHtml(
            data.name
          ) +
          '</div>' +

          '<div class="detail">' +
          '<strong>PASS ID</strong><br>' +
          escapeHtml(
            data.passId
          ) +
          '</div>' +

          '<div class="detail">' +
          '<strong>ACCESS</strong><br>' +
          escapeHtml(
            data.accessType
          ) +
          '</div>' +

          (
            data.tablePackage
              ? (
                  '<div class="detail">' +
                  '<strong>TABLE</strong><br>' +
                  escapeHtml(
                    data.tablePackage
                  ) +
                  '</div>'
                )
              : ""
          ) +

          '<div class="detail">' +
          '<strong>CHECK-IN</strong><br>' +
          escapeHtml(
            data.checkInTime
          ) +
          '</div>';


        setScannerStatus(
          "QR sudah pernah digunakan."
        );

        return;

      }


      /* =======================================================
         INVALID
         ======================================================= */

      if (
        data &&
        (
          data.status === "INVALID" ||
          data.status === "NOT_FOUND"
        )
      ) {

        result.classList.add(
          "invalid"
        );

        resultTitle.textContent =
          "✕ INVALID QR";


        resultDetails.innerHTML =
          '<div class="detail">' +
          escapeHtml(
            data.message ||
            "QR tidak terdaftar."
          ) +
          '</div>';


        setScannerStatus(
          "QR tidak valid."
        );

        return;

      }


      /* =======================================================
         ERROR
         ======================================================= */

      result.classList.add(
        "error"
      );

      resultTitle.textContent =
        "SYSTEM ERROR";


      resultDetails.innerHTML =
        '<div class="detail">' +
        escapeHtml(
          data &&
          data.message
            ? data.message
            : "Terjadi kesalahan pada server check-in."
        ) +
        '</div>';


      setScannerStatus(
        "Terjadi kesalahan."
      );

    }


    /* =========================================================
       LOADING
       ========================================================= */

    function showLoading() {

      result.className =
        "result error";

      result.style.display =
        "block";

      resultTitle.textContent =
        "CHECKING...";

      resultDetails.innerHTML =
        '<div class="detail">' +
        'Memverifikasi QR ke Supabase...' +
        '</div>';

    }


    /* =========================================================
       SERVER ERROR
       ========================================================= */

    function showServerError(
      error
    ) {

      result.className =
        "result error";

      result.style.display =
        "block";

      resultTitle.textContent =
        "SYSTEM ERROR";


      resultDetails.innerHTML =
        '<div class="detail">' +
        escapeHtml(
          error &&
          error.message
            ? error.message
            : "Tidak dapat menghubungi server check-in."
        ) +
        '</div>';


      setScannerStatus(
        "Server check-in tidak dapat dihubungi."
      );

    }


    /* =========================================================
       TEMPORARY ERROR
       ========================================================= */

    function showTemporaryError(
      message
    ) {

      result.className =
        "result invalid";

      result.style.display =
        "block";

      resultTitle.textContent =
        "✕ INVALID";


      resultDetails.innerHTML =
        '<div class="detail">' +
        escapeHtml(
          message
        ) +
        '</div>';


      setScannerStatus(
        "Input tidak valid."
      );

    }


    /* =========================================================
       RESET
       ========================================================= */

    async function resetScanner() {

      if (requestTimeout) {

        clearTimeout(
          requestTimeout
        );

        requestTimeout =
          null;

      }

      result.style.display =
        "none";

      result.className =
        "result";

      resultTitle.textContent =
        "";

      resultDetails.innerHTML =
        "";

      manualToken.value =
        "";

      processing =
        false;

      await startScanner();

    }


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ""
          : value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================================================
       EVENTS
       ========================================================= */

    manualButton.addEventListener(
      "click",
      manualCheckIn
    );


    resetButton.addEventListener(
      "click",
      resetScanner
    );


    manualToken.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          manualCheckIn();

        }

      }
    );


    /* =========================================================
       PAGE LOAD
       ========================================================= */

    window.addEventListener(
      "DOMContentLoaded",
      async function() {

        /*
         * LANGKAH 1
         *
         * Coba konfigurasi navigasi.
         *
         * Gagal = tidak boleh menghentikan kamera.
         */

        initializeNavigation();


        /*
         * LANGKAH 2
         *
         * Selalu mulai scanner.
         */

        await startScanner();

      }
    );

  </script>

</body>
</html>
