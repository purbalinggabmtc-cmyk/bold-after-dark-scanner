<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOLD AFTER DARK — CHECK IN</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #2a0000 0%,
          #080808 45%,
          #000000 100%
        );
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* =========================================================
       TOP NAV
       ========================================================= */

    .top-nav {
      width: 100%;
      margin-bottom: 18px;
      text-align: left;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 16px;
      background: #111111;
      color: #ffffff;
      border: 1px solid #444444;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .home-button:hover {
      background: #1d1d1d;
      border-color: #e00000;
    }

    /* =========================================================
       BRAND
       ========================================================= */

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .brand .after {
      color: #e00000;
    }

    .brand .dark {
      color: #ffffff;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 3px;
      color: #aaaaaa;
      margin-bottom: 24px;
    }

    /* =========================================================
       SCANNER CARD
       ========================================================= */

    .scanner-card {
      background: #111111;
      border: 1px solid #333333;
      border-radius: 18px;
      padding: 16px;
      box-shadow:
        0 0 30px rgba(255, 0, 0, 0.12);
    }

    #reader {
      width: 100%;
      min-height: 280px;
      overflow: hidden;
      border-radius: 12px;
      background: #080808;
    }

    #reader video {
      width: 100% !important;
      max-width: 100% !important;
      border-radius: 10px;
    }

    #reader img {
      max-width: 100%;
    }

    #reader__dashboard_section_swaplink,
    #reader__status_span,
    #reader__dashboard_section_csr {
      display: none !important;
    }

    #reader__scan_region {
      min-height: 250px;
    }

    #reader__scan_region video {
      object-fit: cover;
    }

    /* =========================================================
       MANUAL TOKEN
       ========================================================= */

    .manual {
      margin-top: 18px;
      display: flex;
      gap: 8px;
    }

    .manual input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      background: #1c1c1c;
      color: #ffffff;
      border: 1px solid #444444;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .manual input::placeholder {
      color: #777777;
    }

    .manual input:focus {
      border-color: #e00000;
      box-shadow:
        0 0 0 2px rgba(224, 0, 0, 0.12);
    }

    .manual button {
      padding: 14px 18px;
      background: #e00000;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .manual button:hover {
      background: #ff0000;
    }

    .manual button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =========================================================
       RESULT
       ========================================================= */

    .result {
      margin-top: 18px;
      padding: 20px;
      border-radius: 14px;
      display: none;
    }

    .result.valid {
      display: block;
      background: #062d16;
      border: 2px solid #16c75a;
    }

    .result.used {
      display: block;
      background: #2d2100;
      border: 2px solid #e2b400;
    }

    .result.invalid {
      display: block;
      background: #300000;
      border: 2px solid #e00000;
    }

    .result.error {
      display: block;
      background: #222222;
      border: 2px solid #777777;
    }

    .result-title {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .valid .result-title {
      color: #16c75a;
    }

    .used .result-title {
      color: #e2b400;
    }

    .invalid .result-title {
      color: #ff3333;
    }

    .error .result-title {
      color: #ffffff;
    }

    .detail {
      margin-top: 8px;
      font-size: 15px;
      color: #dddddd;
      line-height: 1.5;
    }

    .detail strong {
      color: #ffffff;
    }

    /* =========================================================
       RESET
       ========================================================= */

    .reset {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      background: #e00000;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .reset:hover {
      background: #ff0000;
    }

    /* =========================================================
       STATUS
       ========================================================= */

    .status-text {
      margin-top: 12px;
      font-size: 12px;
      color: #888888;
      min-height: 18px;
      line-height: 1.5;
    }

    /* =========================================================
       NAVIGATION ERROR
       ========================================================= */

    .navigation-error {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      background: rgba(224, 0, 0, 0.1);
      border: 1px solid rgba(224, 0, 0, 0.4);
      border-radius: 8px;
      color: #ff8b8b;
      font-size: 11px;
      line-height: 1.5;
      text-align: left;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #666666;
      letter-spacing: 2px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .top-nav {
        margin-bottom: 14px;
      }

      .home-button {
        width: 100%;
      }

      .brand {
        font-size: 23px;
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 11px;
        letter-spacing: 2px;
      }

      .scanner-card {
        padding: 12px;
        border-radius: 15px;
      }

      #reader {
        min-height: 250px;
      }

      .manual {
        flex-direction: column;
      }

      .manual button {
        width: 100%;
      }

      .result {
        padding: 18px 14px;
      }

      .result-title {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- =======================================================
         HOME
         URL TIDAK DISIMPAN DI SINI.
         NAVIGATION DIBACA DARI /config/navigation.js
         ======================================================= -->

    <div class="top-nav">
      <a
        href="#"
        id="homeButton"
        class="home-button"
      >
        ← HOME
      </a>
    </div>

    <!-- =======================================================
         BRAND
         ======================================================= -->

    <div class="brand">
      BOLD <span class="after">AFTER</span> <span class="dark">DARK</span>
    </div>

    <div class="subtitle">
      EVENT CHECK-IN
    </div>

    <!-- =======================================================
         SCANNER
         ======================================================= -->

    <div class="scanner-card">

      <div id="reader"></div>

      <div
        id="scannerStatus"
        class="status-text"
      >
        Menyiapkan kamera...
      </div>

      <div
        id="navigationError"
        class="navigation-error"
      ></div>

      <!-- =====================================================
           MANUAL TOKEN
           ===================================================== -->

      <div class="manual">

        <input
          id="manualToken"
          type="text"
          placeholder="Masukkan QR token"
          autocomplete="off"
          spellcheck="false"
        >

        <button
          type="button"
          id="manualButton"
        >
          CHECK
        </button>

      </div>

      <!-- =====================================================
           RESULT
           ===================================================== -->

      <div
        id="result"
        class="result"
      >

        <div
          id="resultTitle"
          class="result-title"
        ></div>

        <div id="resultDetails"></div>

        <button
          type="button"
          id="resetButton"
          class="reset"
        >
          SCAN BERIKUTNYA
        </button>

      </div>

    </div>

    <div class="footer">
      BOLD AFTER DARK • THE NIGHT STARTS HERE
    </div>

  </div>

  <script>
    "use strict";

    /* =========================================================
       SUPABASE
       ========================================================= */

    const SUPABASE_URL =
      "https://yrvnmmascklkuzpjkwxn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_YGi3tPBuF9tW4KKnLJ5dDQ_AcBZ19WH";

    const API_URL =
      SUPABASE_URL +
      "/functions/v1/dynamic-service";


    /* =========================================================
       NAVIGATION FILE
       ========================================================= */

    const NAVIGATION_SCRIPT_URL =
      "/config/navigation.js";


    /* =========================================================
       STATE
       ========================================================= */

    let scanner = null;
    let processing = false;
    let requestTimeout = null;
    let navigationConfig = null;


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const homeButton =
      document.getElementById("homeButton");

    const reader =
      document.getElementById("reader");

    const scannerStatus =
      document.getElementById("scannerStatus");

    const navigationError =
      document.getElementById("navigationError");

    const manualToken =
      document.getElementById("manualToken");

    const manualButton =
      document.getElementById("manualButton");

    const result =
      document.getElementById("result");

    const resultTitle =
      document.getElementById("resultTitle");

    const resultDetails =
      document.getElementById("resultDetails");

    const resetButton =
      document.getElementById("resetButton");


    /* =========================================================
       STATUS
       ========================================================= */

    function setScannerStatus(text) {
      scannerStatus.textContent = text || "";
    }


    /* =========================================================
       NAVIGATION
       
       PENTING:
       Fungsi ini TIDAK dipanggil sebelum kamera.
       Kamera boleh hidup sendiri.
       ========================================================= */

    async function loadNavigationConfig() {

      try {

        const response = await fetch(
          NAVIGATION_SCRIPT_URL +
          "?t=" +
          Date.now(),
          {
            method: "GET",
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status
          );
        }

        const source =
          await response.text();

        /*
         * navigation.js harus berisi:
         *
         * const NAVIGATION = Object.freeze({
         *   home: "...",
         *   admin: "...",
         *   report: "...",
         *   scanner: "...",
         *   registration: "..."
         * });
         *
         * Karena file diambil sebagai text,
         * kita baca object NAVIGATION secara aman
         * tanpa menjalankan script remote.
         */

        const match =
          source.match(
            /const\s+NAVIGATION\s*=\s*Object\.freeze\s*\(\s*(\{[\s\S]*?\})\s*\)\s*;?/
          );

        if (!match) {
          throw new Error(
            "Deklarasi NAVIGATION tidak ditemukan."
          );
        }

        let objectText =
          match[1];

        /*
         * navigation.js menggunakan JavaScript object
         * sederhana dengan string URL.
         *
         * Ubah menjadi JSON dengan mengambil
         * property yang dibutuhkan.
         */

        const config = {};

        const pages = [
          "home",
          "admin",
          "report",
          "scanner",
          "registration"
        ];

        for (const page of pages) {

          const regex =
            new RegExp(
              page +
              "\\s*:\\s*[\"']([^\"']+)[\"']"
            );

          const found =
            objectText.match(regex);

          if (found) {
            config[page] =
              found[1];
          }

        }

        validateNavigationConfig(
          config
        );

        navigationConfig =
          config;

        navigationError.style.display =
          "none";

        console.log(
          "Navigation loaded:",
          navigationConfig
        );

        return navigationConfig;

      } catch (error) {

        console.error(
          "NAVIGATION ERROR:",
          error
        );

        navigationConfig =
          null;

        navigationError.textContent =
          "Konfigurasi navigasi tidak dapat dimuat. " +
          "Pastikan /config/navigation.js tersedia " +
          "dan konfigurasi NAVIGATION valid.";

        navigationError.style.display =
          "block";

        return null;
      }
    }


    /* =========================================================
       VALIDATE NAVIGATION
       ========================================================= */

    function validateNavigationConfig(config) {

      const required =
        [
          "home",
          "admin",
          "report",
          "scanner"
        ];

      for (const page of required) {

        if (
          !config[page] ||
          typeof config[page] !== "string"
        ) {

          throw new Error(
            "URL " +
            page +
            " tidak tersedia."
          );

        }

        let url;

        try {

          url =
            new URL(
              config[page]
            );

        } catch (error) {

          throw new Error(
            "URL " +
            page +
            " tidak valid."
          );

        }

        if (
          url.protocol !== "https:" &&
          url.protocol !== "http:"
        ) {

          throw new Error(
            "Protocol URL " +
            page +
            " tidak valid."
          );

        }
      }
    }


    /* =========================================================
       NAVIGATE
       ========================================================= */

    async function navigateTo(
      pageName
    ) {

      /*
       * Saat tombol diklik:
       * baca ulang navigation.js.
       *
       * Jadi perubahan URL cukup dilakukan
       * di satu tempat.
       */

      const config =
        await loadNavigationConfig();

      if (!config) {

        alert(
          "Alamat halaman tidak dapat dibaca dari /config/navigation.js."
        );

        return;
      }

      const target =
        config[pageName];

      if (!target) {

        alert(
          "Alamat halaman '" +
          pageName +
          "' tidak tersedia."
        );

        return;
      }

      window.location.href =
        target;
    }


    /* =========================================================
       HOME BUTTON
       ========================================================= */

    homeButton.addEventListener(
      "click",
      async function(event) {

        event.preventDefault();

        if (
          homeButton.dataset.loading === "1"
        ) {
          return;
        }

        homeButton.dataset.loading =
          "1";

        homeButton.style.opacity =
          "0.6";

        try {

          await navigateTo("home");

        } finally {

          homeButton.dataset.loading =
            "0";

          homeButton.style.opacity =
            "";
        }
      }
    );


    /* =========================================================
       START CAMERA
       
       INI TIDAK MENUNGGU NAVIGATION.JS
       ========================================================= */

    async function startScanner() {

      if (
        typeof Html5QrcodeScanner ===
        "undefined"
      ) {

        showServerError({
          message:
            "Library scanner QR tidak berhasil dimuat."
        });

        setScannerStatus(
          "Library kamera tidak tersedia."
        );

        return;
      }

      processing = false;

      setScannerStatus(
        "Memulai kamera..."
      );

      /*
       * Bersihkan scanner lama jika ada.
       */

      if (scanner) {

        try {
          await scanner.clear();
        } catch (error) {
          console.warn(
            "Scanner clear:",
            error
          );
        }

        scanner = null;
      }

      reader.innerHTML = "";

      try {

        scanner =
          new Html5QrcodeScanner(
            "reader",
            {
              fps: 10,

              qrbox: {
                width: 250,
                height: 250
              },

              aspectRatio: 1.0,

              rememberLastUsedCamera: true,

              showTorchButtonIfSupported: true,

              supportedScanTypes: [
                Html5QrcodeScanType.SCAN_TYPE_CAMERA,
                Html5QrcodeScanType.SCAN_TYPE_FILE
              ]
            },
            false
          );

        scanner.render(
          onScanSuccess,
          onScanError
        );

        setScannerStatus(
          "Pilih kamera jika diminta, lalu arahkan ke QR code."
        );

      } catch (error) {

        console.error(
          "SCANNER START ERROR:",
          error
        );

        showServerError({
          message:
            "Kamera scanner tidak dapat dimulai: " +
            (
              error &&
              error.message
                ? error.message
                : "Unknown error"
            )
        });

        setScannerStatus(
          "Kamera gagal dimulai."
        );
      }
    }


    /* =========================================================
       SCAN SUCCESS
       ========================================================= */

    function onScanSuccess(
      decodedText
    ) {

      if (processing) {
        return;
      }

      const token =
        String(
          decodedText || ""
        ).trim();

      if (!token) {
        return;
      }

      processing =
        true;

      stopScanner();

      processToken(
        token
      );
    }


    /* =========================================================
       SCAN ERROR
       ========================================================= */

    function onScanError() {
      /*
       * Error scanning biasa tidak ditampilkan.
       */
    }


    /* =========================================================
       STOP SCANNER
       ========================================================= */

    async function stopScanner() {

      if (!scanner) {
        return;
      }

      try {
        await scanner.clear();
      } catch (error) {
        console.warn(
          "Scanner stop:",
          error
        );
      }

      scanner = null;
    }


    /* =========================================================
       PROCESS TOKEN
       ========================================================= */

    async function processToken(
      token
    ) {

      showLoading();

      setScannerStatus(
        "Menghubungi server Supabase..."
      );

      const cleanToken =
        String(
          token || ""
        ).trim();

      if (!cleanToken) {

        showServerError({
          message:
            "QR token kosong."
        });

        processing =
          false;

        return;
      }

      const requestUrl =
        API_URL +
        "?action=checkIn&token=" +
        encodeURIComponent(
          cleanToken
        );

      if (requestTimeout) {

        clearTimeout(
          requestTimeout
        );

        requestTimeout =
          null;
      }

      let finished = false;

      requestTimeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }

            finished =
              true;

            requestTimeout =
              null;

            showServerError({
              message:
                "Server check-in tidak memberikan respons dalam 15 detik."
            });

          },
          15000
        );

      try {

        const response =
          await fetch(
            requestUrl,
            {
              method: "GET",
              cache: "no-store",
              headers: {
                "Accept":
                  "application/json",

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_PUBLISHABLE_KEY
              }
            }
          );

        if (finished) {
          return;
        }

        finished =
          true;

        if (requestTimeout) {

          clearTimeout(
            requestTimeout
          );

          requestTimeout =
            null;
        }

        const rawResponse =
          await response.text();

        let data = null;

        try {

          data =
            JSON.parse(
              rawResponse
            );

        } catch (error) {

          console.error(
            "JSON PARSE ERROR:",
            error
          );

          showServerError({
            message:
              "Server mengembalikan response yang tidak valid."
          });

          return;
        }

        if (!response.ok) {

          showServerError({
            message:
              data &&
              data.message
                ? data.message
                : "Check-in gagal. HTTP " +
                  response.status
          });

          return;
        }

        showResult(
          data
        );

      } catch (error) {

        if (finished) {
          return;
        }

        finished =
          true;

        if (requestTimeout) {

          clearTimeout(
            requestTimeout
          );

          requestTimeout =
            null;
        }

        console.error(
          "CHECK-IN ERROR:",
          error
        );

        showServerError({
          message:
            error &&
            error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
        });
      }
    }


    /* =========================================================
       MANUAL CHECK-IN
       ========================================================= */

    function manualCheckIn() {

      if (processing) {
        return;
      }

      const token =
        manualToken.value.trim();

      if (!token) {

        showTemporaryError(
          "QR TOKEN KOSONG"
        );

        manualToken.focus();

        return;
      }

      processing =
        true;

      stopScanner();

      processToken(
        token
      );
    }


    /* =========================================================
       SHOW RESULT
       ========================================================= */

    function showResult(
      data
    ) {

      result.className =
        "result";

      result.style.display =
        "block";


      /* VALID */

      if (
        data &&
        data.status === "VALID"
      ) {

        result.classList.add(
          "valid"
        );

        resultTitle.textContent =
          "✓ ENTRY APPROVED";

        resultDetails.innerHTML =
          '<div class="detail">' +
            '<strong>NAMA</strong><br>' +
            escapeHtml(data.name) +
          '</div>' +

          '<div class="detail">' +
            '<strong>PASS ID</strong><br>' +
            escapeHtml(data.passId) +
          '</div>' +

          '<div class="detail">' +
            '<strong>ACCESS</strong><br>' +
            escapeHtml(data.accessType) +
          '</div>' +

          (
            data.tablePackage
              ? (
                '<div class="detail">' +
                  '<strong>TABLE</strong><br>' +
                  escapeHtml(data.tablePackage) +
                '</div>'
              )
              : ""
          ) +

          '<div class="detail">' +
            '<strong>CHECK-IN</strong><br>' +
            escapeHtml(data.checkInTime) +
          '</div>';

        setScannerStatus(
          "Check-in berhasil."
        );

        return;
      }


      /* ALREADY USED */

      if (
        data &&
        (
          data.status === "ALREADY_USED" ||
          data.status === "USED"
        )
      ) {

        result.classList.add(
          "used"
        );

        resultTitle.textContent =
          "⚠ ALREADY USED";

        resultDetails.innerHTML =
          '<div class="detail">' +
            '<strong>QR INI SUDAH DIGUNAKAN</strong>' +
          '</div>' +

          '<div class="detail">' +
            '<strong>NAMA</strong><br>' +
            escapeHtml(data.name) +
          '</div>' +

          '<div class="detail">' +
            '<strong>PASS ID</strong><br>' +
            escapeHtml(data.passId) +
          '</div>' +

          '<div class="detail">' +
            '<strong>ACCESS</strong><br>' +
            escapeHtml(data.accessType) +
          '</div>' +

          (
            data.tablePackage
              ? (
                '<div class="detail">' +
                  '<strong>TABLE</strong><br>' +
                  escapeHtml(data.tablePackage) +
                '</div>'
              )
              : ""
          ) +

          '<div class="detail">' +
            '<strong>CHECK-IN</strong><br>' +
            escapeHtml(data.checkInTime) +
          '</div>';

        setScannerStatus(
          "QR sudah pernah digunakan."
        );

        return;
      }


      /* INVALID */

      if (
        data &&
        (
          data.status === "INVALID" ||
          data.status === "NOT_FOUND"
        )
      ) {

        result.classList.add(
          "invalid"
        );

        resultTitle.textContent =
          "✕ INVALID QR";

        resultDetails.innerHTML =
          '<div class="detail">' +
            escapeHtml(
              data.message ||
              "QR tidak terdaftar."
            ) +
          '</div>';

        setScannerStatus(
          "QR tidak valid."
        );

        return;
      }


      /* ERROR */

      result.classList.add(
        "error"
      );

      resultTitle.textContent =
        "SYSTEM ERROR";

      resultDetails.innerHTML =
        '<div class="detail">' +
          escapeHtml(
            data &&
            data.message
              ? data.message
              : "Terjadi kesalahan pada server check-in."
          ) +
        '</div>';

      setScannerStatus(
        "Terjadi kesalahan."
      );
    }


    /* =========================================================
       LOADING
       ========================================================= */

    function showLoading() {

      result.className =
        "result error";

      result.style.display =
        "block";

      resultTitle.textContent =
        "CHECKING...";

      resultDetails.innerHTML =
        '<div class="detail">' +
          'Memverifikasi QR ke Supabase...' +
        '</div>';
    }


    /* =========================================================
       SERVER ERROR
       ========================================================= */

    function showServerError(
      error
    ) {

      result.className =
        "result error";

      result.style.display =
        "block";

      resultTitle.textContent =
        "SYSTEM ERROR";

      resultDetails.innerHTML =
        '<div class="detail">' +
          escapeHtml(
            error &&
            error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
          ) +
        '</div>';

      setScannerStatus(
        "Terjadi kesalahan."
      );
    }


    /* =========================================================
       TEMP ERROR
       ========================================================= */

    function showTemporaryError(
      message
    ) {

      result.className =
        "result invalid";

      result.style.display =
        "block";

      resultTitle.textContent =
        "✕ INVALID";

      resultDetails.innerHTML =
        '<div class="detail">' +
          escapeHtml(message) +
        '</div>';

      setScannerStatus(
        "Input tidak valid."
      );
    }


    /* =========================================================
       RESET
       ========================================================= */

    async function resetScanner() {

      if (requestTimeout) {

        clearTimeout(
          requestTimeout
        );

        requestTimeout =
          null;
      }

      result.style.display =
        "none";

      result.className =
        "result";

      resultTitle.textContent =
        "";

      resultDetails.innerHTML =
        "";

      manualToken.value =
        "";

      processing =
        false;

      await startScanner();
    }


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ""
          : value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    /* =========================================================
       EVENTS
       ========================================================= */

    manualButton.addEventListener(
      "click",
      manualCheckIn
    );

    resetButton.addEventListener(
      "click",
      resetScanner
    );

    manualToken.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          manualCheckIn();
        }
      }
    );


    /* =========================================================
       PAGE LOAD
       
       URUTAN PENTING:
       
       1. LANGSUNG START CAMERA
       2. NAVIGATION DIBACA DI BACKGROUND
       
       Jadi navigation.js error tidak akan
       memblokir kamera.
       ========================================================= */

    window.addEventListener(
      "load",
      function() {

        /*
         * Kamera dijalankan langsung.
         */
        startScanner();

        /*
         * Navigation dijalankan terpisah.
         * Error di sini tidak menghentikan kamera.
         */
        loadNavigationConfig();

      }
    );

  </script>

</body>
</html>
