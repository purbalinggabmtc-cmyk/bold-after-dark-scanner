<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOLD AFTER DARK — Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #2a0000 0%,
          #0b0b0b 42%,
          #000000 100%
        );
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================
       LOGIN
       ===================================================== */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #111111;
      border: 1px solid #333333;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }

    .brand {
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .brand span {
      color: #e00000;
    }

    .login-subtitle {
      text-align: center;
      color: #888888;
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dddddd;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 9px;
      border: 1px solid #3b3b3b;
      background: #1b1b1b;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #e00000;
      box-shadow: 0 0 0 2px rgba(224, 0, 0, 0.12);
    }

    .primary-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #e00000;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .login-message.error {
      display: block;
      background: rgba(224, 0, 0, 0.12);
      border: 1px solid rgba(224, 0, 0, 0.4);
      color: #ff8f8f;
    }

    /* =====================================================
       DASHBOARD
       ===================================================== */

    #dashboardScreen {
      min-height: 100vh;
      padding: 25px;
    }

    .dashboard {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .topbar-brand {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .topbar-brand span {
      color: #e00000;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-email {
      color: #888888;
      font-size: 12px;
    }

    .logout-button,
    .refresh-button,
    .delete-button {
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .logout-button {
      background: #222222;
      color: white;
      border: 1px solid #444444;
    }

    .refresh-button {
      background: #e00000;
      color: white;
      border: none;
    }

    .refresh-button:disabled,
    .delete-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* =====================================================
       STATS
       ===================================================== */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: #111111;
      border: 1px solid #2d2d2d;
      border-radius: 13px;
      padding: 18px;
    }

    .stat-label {
      color: #888888;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 30px;
      font-weight: 900;
    }

    /* =====================================================
       CONTROLS
       ===================================================== */

    .controls {
      background: #111111;
      border: 1px solid #2d2d2d;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 18px;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
    }

    .filter-select {
      width: auto;
      min-width: 145px;
    }

    select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3b3b3b;
      background: #1b1b1b;
      color: white;
      outline: none;
    }

    .delete-button {
      background: #8b0000;
      color: white;
      border: 1px solid #b00000;
      min-width: 170px;
    }

    .delete-button:not(:disabled):hover {
      background: #b00000;
    }

    .selected-info {
      color: #888888;
      font-size: 12px;
      margin-left: auto;
      white-space: nowrap;
    }

    /* =====================================================
       TABLE
       ===================================================== */

    .table-card {
      background: #111111;
      border: 1px solid #2d2d2d;
      border-radius: 14px;
      overflow: hidden;
    }

    .table-header {
      padding: 17px 18px;
      border-bottom: 1px solid #2d2d2d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .table-title {
      font-size: 16px;
      font-weight: 800;
    }

    .table-count {
      color: #888888;
      font-size: 12px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1150px;
    }

    th {
      text-align: left;
      padding: 13px 15px;
      background: #181818;
      color: #999999;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      padding: 14px 15px;
      border-top: 1px solid #242424;
      color: #dddddd;
      font-size: 13px;
      vertical-align: middle;
    }

    tr:hover td {
      background: #151515;
    }

    .checkbox-cell {
      width: 48px;
      text-align: center;
    }

    .row-checkbox,
    #selectAllCheckbox {
      width: 17px;
      height: 17px;
      accent-color: #e00000;
      cursor: pointer;
    }

    .pass-id-cell {
      font-weight: 800;
      color: white;
      letter-spacing: 0.5px;
    }

    .name-cell {
      font-weight: 700;
    }

    .muted {
      color: #777777;
    }

    .bold-riders-text {
      color: #ff8b8b;
      font-weight: 800;
    }

    /* =====================================================
       STATUS BADGES
       ===================================================== */

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.7px;
    }

    .badge-unused {
      background: rgba(22, 199, 90, 0.12);
      color: #55e88b;
      border: 1px solid rgba(22, 199, 90, 0.3);
    }

    .badge-used {
      background: rgba(224, 180, 0, 0.12);
      color: #f0cf45;
      border: 1px solid rgba(224, 180, 0, 0.3);
    }

    .badge-cancelled {
      background: rgba(224, 0, 0, 0.12);
      color: #ff7777;
      border: 1px solid rgba(224, 0, 0, 0.35);
    }

    .badge-free {
      background: rgba(100, 100, 100, 0.18);
      color: #cccccc;
      border: 1px solid #444444;
    }

    .badge-vip {
      background: rgba(224, 0, 0, 0.12);
      color: #ff7777;
      border: 1px solid rgba(224, 0, 0, 0.35);
    }

    .badge-bold {
      background: rgba(255, 94, 0, 0.12);
      color: #ff9b65;
      border: 1px solid rgba(255, 94, 0, 0.35);
    }

    /* =====================================================
       EMPTY / LOADING
       ===================================================== */

    .table-message {
      padding: 40px 20px;
      text-align: center;
      color: #777777;
    }

    .error-banner {
      margin-bottom: 18px;
      padding: 13px 15px;
      border-radius: 9px;
      background: rgba(224, 0, 0, 0.10);
      border: 1px solid rgba(224, 0, 0, 0.35);
      color: #ff8f8f;
      font-size: 13px;
    }

    .success-banner {
      margin-bottom: 18px;
      padding: 13px 15px;
      border-radius: 9px;
      background: rgba(22, 199, 90, 0.10);
      border: 1px solid rgba(22, 199, 90, 0.30);
      color: #65e99a;
      font-size: 13px;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 1100px) {
      .stats-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      #dashboardScreen {
        padding: 15px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .topbar-right {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stat-value {
        font-size: 25px;
      }

      .controls-row {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box,
      .filter-select,
      .delete-button {
        width: 100%;
      }

      .selected-info {
        margin-left: 0;
      }
    }

    @media (max-width: 380px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    // =====================================================
    // SUPABASE CONFIG
    // =====================================================

    const SUPABASE_URL =
      'https://yrvnmmascklkuzpjkwxn.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_YGi3tPBuF9tW4KKnLJ5dDQ_AcBZ19WH';

    const DYNAMIC_SERVICE_URL =
      SUPABASE_URL +
      '/functions/v1/dynamic-service';


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // =====================================================
    // ADMIN LOGIN
    // =====================================================
    //
    // Login Supabase Auth tetap digunakan.
    //
    // Kredensial yang digunakan:
    //
    // EMAIL:
    // admin@admin.com
    //
    // PASSWORD:
    // 22Jun!2002
    //
    // =====================================================

    const ADMIN_EMAIL =
      'admin@admin.com';

    const ADMIN_PASSWORD =
      '22Jun!2002';


    // =====================================================
    // ELEMENTS
    // =====================================================

    const loginScreen =
      document.getElementById(
        'loginScreen'
      );

    const dashboardScreen =
      document.getElementById(
        'dashboardScreen'
      );

    const loginForm =
      document.getElementById(
        'loginForm'
      );

    const loginEmail =
      document.getElementById(
        'loginEmail'
      );

    const loginPassword =
      document.getElementById(
        'loginPassword'
      );

    const loginButton =
      document.getElementById(
        'loginButton'
      );

    const loginMessage =
      document.getElementById(
        'loginMessage'
      );

    const adminEmail =
      document.getElementById(
        'adminEmail'
      );

    const logoutButton =
      document.getElementById(
        'logoutButton'
      );

    const refreshButton =
      document.getElementById(
        'refreshButton'
      );

    const deleteSelectedButton =
      document.getElementById(
        'deleteSelectedButton'
      );

    const selectedInfo =
      document.getElementById(
        'selectedInfo'
      );

    const selectAllCheckbox =
      document.getElementById(
        'selectAllCheckbox'
      );

    const dashboardError =
      document.getElementById(
        'dashboardError'
      );

    const dashboardSuccess =
      document.getElementById(
        'dashboardSuccess'
      );

    const searchInput =
      document.getElementById(
        'searchInput'
      );

    const statusFilter =
      document.getElementById(
        'statusFilter'
      );

    const accessFilter =
      document.getElementById(
        'accessFilter'
      );

    const tableBody =
      document.getElementById(
        'registrationTableBody'
      );

    const tableCount =
      document.getElementById(
        'tableCount'
      );


    // =====================================================
    // DATA
    // =====================================================

    let registrations = [];

    let selectedIds = new Set();


    // =====================================================
    // LOGIN MESSAGE
    // =====================================================

    function showLoginError(message) {

      loginMessage.textContent =
        message;

      loginMessage.className =
        'login-message error';

    }


    function clearLoginError() {

      loginMessage.textContent =
        '';

      loginMessage.className =
        'login-message';

    }


    // =====================================================
    // DASHBOARD MESSAGES
    // =====================================================

    function showDashboardError(text) {

      dashboardSuccess.classList.add(
        'hidden'
      );

      dashboardSuccess.textContent =
        '';

      dashboardError.textContent =
        text;

      dashboardError.classList.remove(
        'hidden'
      );

    }


    function clearDashboardError() {

      dashboardError.textContent =
        '';

      dashboardError.classList.add(
        'hidden'
      );

    }


    function showDashboardSuccess(text) {

      dashboardError.textContent =
        '';

      dashboardError.classList.add(
        'hidden'
      );

      dashboardSuccess.textContent =
        text;

      dashboardSuccess.classList.remove(
        'hidden'
      );

      window.setTimeout(
        function() {

          dashboardSuccess.classList.add(
            'hidden'
          );

        },
        4000
      );

    }


    function clearDashboardMessages() {

      clearDashboardError();

      dashboardSuccess.textContent =
        '';

      dashboardSuccess.classList.add(
        'hidden'
      );

    }


    // =====================================================
    // LOGIN
    // =====================================================

    loginForm.addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();

        clearLoginError();

        loginButton.disabled =
          true;

        loginButton.textContent =
          'LOGGING IN...';


        try {

          const email =
            loginEmail.value
              .trim()
              .toLowerCase();

          const password =
            loginPassword.value;


          if (
            email !==
            ADMIN_EMAIL
          ) {

            throw new Error(
              'Email admin tidak sesuai.'
            );

          }


          if (
            password !==
            ADMIN_PASSWORD
          ) {

            throw new Error(
              'Password admin salah.'
            );

          }


          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword(
              {
                email,
                password
              }
            );


          if (error) {

            throw error;

          }


          if (!data.session) {

            throw new Error(
              'Login berhasil tetapi session tidak tersedia.'
            );

          }


          showDashboard(
            data.user
          );


          await loadRegistrations();

        }

        catch (error) {

          console.error(
            'LOGIN ERROR:',
            error
          );

          showLoginError(
            error &&
            error.message
              ? error.message
              : 'Login gagal.'
          );

        }

        finally {

          loginButton.disabled =
            false;

          loginButton.textContent =
            'LOGIN';

        }

      }
    );


    // =====================================================
    // SHOW DASHBOARD
    // =====================================================

    function showDashboard(user) {

      loginScreen.classList.add(
        'hidden'
      );

      dashboardScreen.classList.remove(
        'hidden'
      );


      adminEmail.textContent =
        user &&
        user.email
          ? user.email
          : ADMIN_EMAIL;

    }


    // =====================================================
    // LOGOUT
    // =====================================================

    logoutButton.addEventListener(
      'click',
      async function() {

        await supabaseClient.auth.signOut();

        registrations = [];

        selectedIds.clear();

        updateSelectionUI();

        dashboardScreen.classList.add(
          'hidden'
        );

        loginScreen.classList.remove(
          'hidden'
        );

        loginPassword.value =
          '';

        clearDashboardMessages();

      }
    );


    // =====================================================
    // DYNAMIC SERVICE REQUEST
    // =====================================================

    async function callDynamicService(
      action,
      options
    ) {

      const {
        data: sessionData,
        error: sessionError
      } =
        await supabaseClient.auth.getSession();


      if (sessionError) {

        throw sessionError;

      }


      const session =
        sessionData &&
        sessionData.session
          ? sessionData.session
          : null;


      if (!session) {

        throw new Error(
          'Session admin tidak tersedia. Silakan login kembali.'
        );

      }


      const requestOptions =
        options || {};


      const response =
        await fetch(
          DYNAMIC_SERVICE_URL +
          '?action=' +
          encodeURIComponent(
            action
          ),
          {
            method:
              requestOptions.method ||
              'POST',

            headers: {
              'Content-Type':
                'application/json',

              'apikey':
                SUPABASE_PUBLISHABLE_KEY,

              'Authorization':
                'Bearer ' +
                session.access_token
            },

            body:
              requestOptions.body
                ? JSON.stringify(
                    requestOptions.body
                  )
                : undefined
          }
        );


      const rawText =
        await response.text();


      let result;

      try {

        result =
          rawText
            ? JSON.parse(rawText)
            : {};

      }

      catch (parseError) {

        console.error(
          'DYNAMIC SERVICE RAW RESPONSE:',
          rawText
        );

        throw new Error(
          'Response dynamic-service bukan JSON yang valid.'
        );

      }


      if (!response.ok) {

        throw new Error(
          result &&
          result.message
            ? result.message
            : 'Dynamic service gagal.'
        );

      }


      if (
        result &&
        result.success === false
      ) {

        throw new Error(
          result.message ||
          'Dynamic service gagal.'
        );

      }


      return result;

    }


    // =====================================================
    // LOAD REGISTRATIONS
    // =====================================================

    async function loadRegistrations() {

      clearDashboardMessages();

      refreshButton.disabled =
        true;

      refreshButton.textContent =
        'LOADING...';


      tableBody.innerHTML =
        `
          <tr>
            <td
              colspan="10"
              class="table-message"
            >
              Loading registrations...
            </td>
          </tr>
        `;


      try {

        const result =
          await callDynamicService(
            'report',
            {
              method: 'GET'
            }
          );


        const rows =
          result &&
          Array.isArray(
            result.registrations
          )
            ? result.registrations
            : [];


        registrations =
          rows;


        selectedIds.clear();

        updateStatistics();

        renderTable();

        updateSelectionUI();

      }

      catch (error) {

        console.error(
          'LOAD REGISTRATIONS ERROR:',
          error
        );


        registrations = [];

        selectedIds.clear();

        updateStatistics();

        updateSelectionUI();


        tableBody.innerHTML =
          `
            <tr>
              <td
                colspan="10"
                class="table-message"
              >
                Tidak dapat membaca data registrations.
              </td>
            </tr>
          `;


        showDashboardError(
          error &&
          error.message
            ? error.message
            : 'Gagal memuat data registrasi.'
        );

      }

      finally {

        refreshButton.disabled =
          false;

        refreshButton.textContent =
          'REFRESH';

      }

    }


    // =====================================================
    // STATISTICS
    // =====================================================

    function updateStatistics() {

      const total =
        registrations.length;


      const checkedIn =
        registrations.filter(
          function(row) {

            return (
              String(
                row.pass_status || ''
              )
                .toUpperCase() ===
              'USED'
            );

          }
        ).length;


      const remaining =
        registrations.filter(
          function(row) {

            return (
              String(
                row.pass_status || ''
              )
                .toUpperCase() !==
              'USED'
            );

          }
        ).length;


      const free =
        registrations.filter(
          function(row) {

            return (
              String(
                row.access_type || ''
              )
                .toUpperCase() ===
              'FREE'
            );

          }
        ).length;


      const vip =
        registrations.filter(
          function(row) {

            return (
              String(
                row.access_type || ''
              )
                .toUpperCase() ===
              'VIP'
            );

          }
        ).length;


      const boldRiders =
        registrations.filter(
          function(row) {

            return (
              String(
                row.access_type || ''
              )
                .toUpperCase() ===
              'BOLD RIDERS'
            );

          }
        ).length;


      document.getElementById(
        'totalCount'
      ).textContent =
        total;


      document.getElementById(
        'checkedInCount'
      ).textContent =
        checkedIn;


      document.getElementById(
        'remainingCount'
      ).textContent =
        remaining;


      document.getElementById(
        'freeCount'
      ).textContent =
        free;


      document.getElementById(
        'vipCount'
      ).textContent =
        vip;


      document.getElementById(
        'boldRidersCount'
      ).textContent =
        boldRiders;

    }


    // =====================================================
    // FILTER
    // =====================================================

    function getFilteredRegistrations() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();


      const status =
        statusFilter.value;


      const access =
        accessFilter.value;


      return registrations.filter(
        function(row) {

          const name =
            String(
              row.name || ''
            )
              .toLowerCase();


          const whatsapp =
            String(
              row.whatsapp || ''
            )
              .toLowerCase();


          const passId =
            String(
              row.pass_id || ''
            )
              .toLowerCase();


          const boldRidersId =
            String(
              row.bold_riders_id || ''
            )
              .toLowerCase();


          const boldRidersName =
            String(
              row.bold_riders_name || ''
            )
              .toLowerCase();


          const community =
            String(
              row.community || ''
            )
              .toLowerCase();


          const rowStatus =
            String(
              row.pass_status || ''
            )
              .toUpperCase();


          const rowAccess =
            String(
              row.access_type || ''
            )
              .toUpperCase();


          const matchesSearch =
            !search ||
            name.includes(search) ||
            whatsapp.includes(search) ||
            passId.includes(search) ||
            boldRidersId.includes(search) ||
            boldRidersName.includes(search) ||
            community.includes(search);


          const matchesStatus =
            status === 'ALL' ||
            rowStatus === status;


          const matchesAccess =
            access === 'ALL' ||
            rowAccess === access;


          return (
            matchesSearch &&
            matchesStatus &&
            matchesAccess
          );

        }
      );

    }


    // =====================================================
    // RENDER TABLE
    // =====================================================

    function renderTable() {

      const rows =
        getFilteredRegistrations();


      tableCount.textContent =
        rows.length +
        (
          rows.length === 1
            ? ' record'
            : ' records'
        );


      if (rows.length === 0) {

        tableBody.innerHTML =
          `
            <tr>
              <td
                colspan="10"
                class="table-message"
              >
                Tidak ada data yang cocok.
              </td>
            </tr>
          `;


        updateSelectAllState();

        return;

      }


      tableBody.innerHTML =
        rows
          .map(
            function(row) {

              const rowId =
                String(
                  row.id || ''
                );


              const isSelected =
                selectedIds.has(
                  rowId
                );


              const boldRidersDisplay =
                row.bold_riders_name ||
                row.bold_riders_id
                  ? `
                    <div class="bold-riders-text">
                      ${escapeHtml(
                        row.bold_riders_name ||
                        row.bold_riders_id
                      )}
                    </div>

                    ${
                      row.bold_riders_id
                        ? `
                          <div class="muted">
                            ${escapeHtml(
                              row.bold_riders_id
                            )}
                          </div>
                        `
                        : ''
                    }
                  `
                  : `
                    <span class="muted">
                      —
                    </span>
                  `;


              return `
                <tr>

                  <td class="checkbox-cell">

                    <input
                      type="checkbox"
                      class="row-checkbox"
                      data-id="${escapeHtml(
                        rowId
                      )}"
                      ${
                        isSelected
                          ? 'checked'
                          : ''
                      }
                      aria-label="Pilih registrasi"
                    >

                  </td>


                  <td class="name-cell">
                    ${escapeHtml(
                      row.name
                    )}
                  </td>


                  <td>
                    ${escapeHtml(
                      row.whatsapp
                    )}
                  </td>


                  <td class="pass-id-cell">
                    ${escapeHtml(
                      row.pass_id
                    )}
                  </td>


                  <td>
                    ${accessBadge(
                      row.access_type
                    )}
                  </td>


                  <td>
                    ${boldRidersDisplay}
                  </td>


                  <td>
                    ${
                      row.table_package
                        ? escapeHtml(
                            row.table_package
                          )
                        : '<span class="muted">—</span>'
                    }
                  </td>


                  <td>
                    ${statusBadge(
                      row.pass_status
                    )}
                  </td>


                  <td>
                    ${formatDate(
                      row.created_at
                    )}
                  </td>


                  <td>
                    ${
                      row.checked_in_at
                        ? formatDate(
                            row.checked_in_at
                          )
                        : '<span class="muted">—</span>'
                    }
                  </td>

                </tr>
              `;

            }
          )
          .join('');


      bindRowCheckboxes();

      updateSelectAllState();

    }


    // =====================================================
    // ROW CHECKBOXES
    // =====================================================

    function bindRowCheckboxes() {

      const checkboxes =
        tableBody.querySelectorAll(
          '.row-checkbox'
        );


      checkboxes.forEach(
        function(checkbox) {

          checkbox.addEventListener(
            'change',
            function() {

              const id =
                String(
                  checkbox.dataset.id || ''
                );


              if (!id) {

                return;

              }


              if (checkbox.checked) {

                selectedIds.add(id);

              }

              else {

                selectedIds.delete(id);

              }


              updateSelectionUI();

            }
          );

        }
      );

    }


    // =====================================================
    // SELECT ALL
    // =====================================================

    selectAllCheckbox.addEventListener(
      'change',
      function() {

        const rows =
          getFilteredRegistrations();


        if (
          selectAllCheckbox.checked
        ) {

          rows.forEach(
            function(row) {

              if (row.id != null) {

                selectedIds.add(
                  String(row.id)
                );

              }

            }
          );

        }

        else {

          rows.forEach(
            function(row) {

              if (row.id != null) {

                selectedIds.delete(
                  String(row.id)
                );

              }

            }
          );

        }


        renderTable();

        updateSelectionUI();

      }
    );


    function updateSelectAllState() {

      const rows =
        getFilteredRegistrations();


      if (rows.length === 0) {

        selectAllCheckbox.checked =
          false;

        selectAllCheckbox.indeterminate =
          false;

        return;

      }


      const rowIds =
        rows
          .map(
            function(row) {

              return String(
                row.id || ''
              );

            }
          )
          .filter(Boolean);


      const selectedVisibleCount =
        rowIds.filter(
          function(id) {

            return selectedIds.has(
              id
            );

          }
        ).length;


      selectAllCheckbox.checked =
        selectedVisibleCount ===
        rowIds.length;


      selectAllCheckbox.indeterminate =
        selectedVisibleCount > 0 &&
        selectedVisibleCount <
          rowIds.length;

    }


    function updateSelectionUI() {

      const count =
        selectedIds.size;


      selectedInfo.textContent =
        count +
        (
          count === 1
            ? ' dipilih'
            : ' dipilih'
        );


      deleteSelectedButton.disabled =
        count === 0;


      deleteSelectedButton.textContent =
        count > 0
          ? 'HAPUS ' + count + ' TERPILIH'
          : 'HAPUS TERPILIH';


      updateSelectAllState();

    }


    // =====================================================
    // DELETE SELECTED
    // =====================================================

    deleteSelectedButton.addEventListener(
      'click',
      async function() {

        const ids =
          Array.from(
            selectedIds
          );


        if (ids.length === 0) {

          return;

        }


        const confirmation =
          confirm(
            'Hapus ' +
            ids.length +
            ' registrasi yang dipilih?\n\n' +
            'Data yang dihapus tidak dapat dikembalikan.'
          );


        if (!confirmation) {

          return;

        }


        clearDashboardMessages();


        deleteSelectedButton.disabled =
          true;

        deleteSelectedButton.textContent =
          'MENGHAPUS...';


        try {

          const result =
            await callDynamicService(
              'delete',
              {
                method: 'POST',

                body: {
                  ids
                }
              }
            );


          const deletedCount =
            result &&
            Number.isFinite(
              Number(
                result.deletedCount
              )
            )
              ? Number(
                  result.deletedCount
                )
              : ids.length;


          selectedIds.clear();


          showDashboardSuccess(
            deletedCount +
            ' registrasi berhasil dihapus.'
          );


          await loadRegistrations();

        }

        catch (error) {

          console.error(
            'DELETE REGISTRATIONS ERROR:',
            error
          );


          showDashboardError(
            error &&
            error.message
              ? error.message
              : 'Gagal menghapus registrasi.'
          );

        }

        finally {

          updateSelectionUI();

        }

      }
    );


    // =====================================================
    // STATUS BADGE
    // =====================================================

    function statusBadge(status) {

      const value =
        String(
          status || ''
        )
          .toUpperCase();


      if (value === 'USED') {

        return `
          <span class="badge badge-used">
            USED
          </span>
        `;

      }


      if (
        value ===
        'CANCELLED'
      ) {

        return `
          <span class="badge badge-cancelled">
            CANCELLED
          </span>
        `;

      }


      return `
        <span class="badge badge-unused">
          UNUSED
        </span>
      `;

    }


    // =====================================================
    // ACCESS BADGE
    // =====================================================

    function accessBadge(access) {

      const value =
        String(
          access || ''
        )
          .toUpperCase();


      if (
        value ===
        'BOLD RIDERS'
      ) {

        return `
          <span class="badge badge-bold">
            BOLD RIDERS
          </span>
        `;

      }


      if (
        value ===
        'VIP'
      ) {

        return `
          <span class="badge badge-vip">
            VIP
          </span>
        `;

      }


      return `
        <span class="badge badge-free">
          FREE
        </span>
      `;

    }


    // =====================================================
    // DATE FORMAT
    // =====================================================

    function formatDate(value) {

      if (!value) {

        return '—';

      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return escapeHtml(
          value
        );

      }


      return date.toLocaleString(
        'id-ID',
        {
          dateStyle: 'short',
          timeStyle: 'short'
        }
      );

    }


    // =====================================================
    // HTML ESCAPE
    // =====================================================

    function escapeHtml(value) {

      return String(
        value == null
          ? ''
          : value
      )
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );

    }


    // =====================================================
    // REFRESH
    // =====================================================

    refreshButton.addEventListener(
      'click',
      function() {

        loadRegistrations();

      }
    );


    // =====================================================
    // LIVE SEARCH
    // =====================================================

    searchInput.addEventListener(
      'input',
      function() {

        renderTable();

        updateSelectionUI();

      }
    );


    statusFilter.addEventListener(
      'change',
      function() {

        renderTable();

        updateSelectionUI();

      }
    );


    accessFilter.addEventListener(
      'change',
      function() {

        renderTable();

        updateSelectionUI();

      }
    );


    // =====================================================
    // CHECK EXISTING SESSION
    // =====================================================

    async function checkExistingSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          throw error;

        }


        const session =
          data &&
          data.session
            ? data.session
            : null;


        if (
          session &&
          session.user
        ) {

          if (
            String(
              session.user.email ||
              ''
            )
              .toLowerCase() !==
            ADMIN_EMAIL
          ) {

            await supabaseClient.auth.signOut();

            return;

          }


          showDashboard(
            session.user
          );


          await loadRegistrations();

        }

      }

      catch (error) {

        console.error(
          'SESSION ERROR:',
          error
        );

      }

    }


    // =====================================================
    // AUTH STATE
    // =====================================================

    supabaseClient.auth.onAuthStateChange(
      function(
        event,
        session
      ) {

        if (
          event ===
          'SIGNED_OUT'
        ) {

          registrations = [];

          selectedIds.clear();

          updateSelectionUI();

          dashboardScreen.classList.add(
            'hidden'
          );

          loginScreen.classList.remove(
            'hidden'
          );

        }


        if (
          event ===
          'SIGNED_IN' &&
          session &&
          session.user
        ) {

          if (
            String(
              session.user.email ||
              ''
            )
              .toLowerCase() ===
            ADMIN_EMAIL
          ) {

            showDashboard(
              session.user
            );

          }

        }

      }
    );


    // =====================================================
    // START
    // =====================================================

    checkExistingSession();

  </script>

</body>
