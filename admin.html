<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOLD AFTER DARK — Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #2a0000 0%,
          #0b0b0b 42%,
          #000000 100%
        );

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================
       LOGIN
       ===================================================== */

    #loginScreen {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;

      background: #111111;

      border: 1px solid #333333;

      border-radius: 18px;

      padding: 30px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55);
    }

    .brand {
      text-align: center;

      font-size: 28px;

      font-weight: 900;

      letter-spacing: 3px;

      margin-bottom: 5px;
    }

    .brand span {
      color: #e00000;
    }

    .login-subtitle {
      text-align: center;

      color: #888888;

      font-size: 12px;

      letter-spacing: 3px;

      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #dddddd;

      font-size: 13px;

      font-weight: 700;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border-radius: 9px;

      border: 1px solid #3b3b3b;

      background: #1b1b1b;

      color: white;

      outline: none;
    }

    input:focus {
      border-color: #e00000;

      box-shadow:
        0 0 0 2px rgba(224, 0, 0, 0.12);
    }

    .primary-button {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 9px;

      background: #e00000;

      color: white;

      font-weight: 800;

      cursor: pointer;
    }

    .primary-button:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

    .login-message {
      margin-top: 15px;

      padding: 12px;

      border-radius: 8px;

      font-size: 13px;

      line-height: 1.5;

      display: none;
    }

    .login-message.error {
      display: block;

      background: rgba(224, 0, 0, 0.12);

      border: 1px solid rgba(224, 0, 0, 0.4);

      color: #ff8f8f;
    }

    /* =====================================================
       DASHBOARD
       ===================================================== */

    #dashboardScreen {
      min-height: 100vh;

      padding: 25px;
    }

    .dashboard {
      width: 100%;

      max-width: 1400px;

      margin: 0 auto;
    }

    .topbar {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      margin-bottom: 25px;
    }

    .topbar-brand {
      font-size: 25px;

      font-weight: 900;

      letter-spacing: 2px;
    }

    .topbar-brand span {
      color: #e00000;
    }

    .topbar-right {
      display: flex;

      align-items: center;

      gap: 10px;
    }

    .admin-email {
      color: #888888;

      font-size: 12px;
    }

    .logout-button,
    .refresh-button {
      padding: 10px 14px;

      border-radius: 8px;

      cursor: pointer;

      font-weight: 700;
    }

    .logout-button {
      background: #222222;

      color: white;

      border: 1px solid #444444;
    }

    .refresh-button {
      background: #e00000;

      color: white;

      border: none;
    }

    /* =====================================================
       STATS
       ===================================================== */

    .stats-grid {
      display: grid;

      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      gap: 14px;

      margin-bottom: 22px;
    }

    .stat-card {
      background: #111111;

      border: 1px solid #2d2d2d;

      border-radius: 13px;

      padding: 18px;
    }

    .stat-label {
      color: #888888;

      font-size: 11px;

      letter-spacing: 1px;

      text-transform: uppercase;

      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 30px;

      font-weight: 900;
    }

    /* =====================================================
       CONTROLS
       ===================================================== */

    .controls {
      background: #111111;

      border: 1px solid #2d2d2d;

      border-radius: 14px;

      padding: 15px;

      margin-bottom: 18px;
    }

    .controls-row {
      display: flex;

      gap: 10px;

      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;

      min-width: 220px;
    }

    .filter-select {
      width: auto;

      min-width: 140px;
    }

    select {
      padding: 12px;

      border-radius: 8px;

      border: 1px solid #3b3b3b;

      background: #1b1b1b;

      color: white;

      outline: none;
    }

    /* =====================================================
       TABLE
       ===================================================== */

    .table-card {
      background: #111111;

      border: 1px solid #2d2d2d;

      border-radius: 14px;

      overflow: hidden;
    }

    .table-header {
      padding: 17px 18px;

      border-bottom: 1px solid #2d2d2d;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;
    }

    .table-title {
      font-size: 16px;

      font-weight: 800;
    }

    .table-count {
      color: #888888;

      font-size: 12px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 950px;
    }

    th {
      text-align: left;

      padding: 13px 15px;

      background: #181818;

      color: #999999;

      font-size: 11px;

      letter-spacing: 1px;

      text-transform: uppercase;

      white-space: nowrap;
    }

    td {
      padding: 14px 15px;

      border-top: 1px solid #242424;

      color: #dddddd;

      font-size: 13px;

      vertical-align: middle;
    }

    tr:hover td {
      background: #151515;
    }

    .pass-id-cell {
      font-weight: 800;

      color: white;

      letter-spacing: 0.5px;
    }

    .name-cell {
      font-weight: 700;
    }

    .muted {
      color: #777777;
    }

    /* =====================================================
       STATUS BADGES
       ===================================================== */

    .badge {
      display: inline-block;

      padding: 5px 9px;

      border-radius: 20px;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: 0.7px;
    }

    .badge-unused {
      background: rgba(22, 199, 90, 0.12);

      color: #55e88b;

      border: 1px solid rgba(22, 199, 90, 0.3);
    }

    .badge-used {
      background: rgba(224, 180, 0, 0.12);

      color: #f0cf45;

      border: 1px solid rgba(224, 180, 0, 0.3);
    }

    .badge-free {
      background: rgba(100, 100, 100, 0.18);

      color: #cccccc;

      border: 1px solid #444444;
    }

    .badge-vip {
      background: rgba(224, 0, 0, 0.12);

      color: #ff7777;

      border: 1px solid rgba(224, 0, 0, 0.35);
    }

    /* =====================================================
       EMPTY / LOADING
       ===================================================== */

    .table-message {
      padding: 40px 20px;

      text-align: center;

      color: #777777;
    }

    .error-banner {
      margin-bottom: 18px;

      padding: 13px 15px;

      border-radius: 9px;

      background: rgba(224, 0, 0, 0.10);

      border: 1px solid rgba(224, 0, 0, 0.35);

      color: #ff8f8f;

      font-size: 13px;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 900px) {

      .stats-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

    }

    @media (max-width: 600px) {

      #dashboardScreen {
        padding: 15px;
      }

      .topbar {
        align-items: flex-start;

        flex-direction: column;
      }

      .topbar-right {
        width: 100%;

        justify-content: space-between;
      }

      .stats-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .stat-value {
        font-size: 25px;
      }

      .controls-row {
        flex-direction: column;
      }

      .search-box,
      .filter-select {
        width: 100%;
      }

    }

    @media (max-width: 380px) {

      .stats-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

<body>

  <!-- =====================================================
       LOGIN SCREEN
       ===================================================== -->

  <section id="loginScreen">

    <div class="login-card">

      <div class="brand">
        BOLD <span>AFTER DARK</span>
      </div>

      <div class="login-subtitle">
        ADMIN DASHBOARD
      </div>

      <form id="loginForm">

        <div class="form-group">

          <label for="loginEmail">
            EMAIL
          </label>

          <input
            id="loginEmail"
            type="email"
            placeholder="admin@example.com"
            autocomplete="username"
            required
          >

        </div>

        <div class="form-group">

          <label for="loginPassword">
            PASSWORD
          </label>

          <input
            id="loginPassword"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          >

        </div>

        <button
          id="loginButton"
          class="primary-button"
          type="submit"
        >
          LOGIN
        </button>

      </form>

      <div
        id="loginMessage"
        class="login-message"
      ></div>

    </div>

  </section>


  <!-- =====================================================
       DASHBOARD SCREEN
       ===================================================== -->

  <section
    id="dashboardScreen"
    class="hidden"
  >

    <div class="dashboard">

      <div class="topbar">

        <div class="topbar-brand">
          BOLD <span>AFTER DARK</span>
        </div>

        <div class="topbar-right">

          <div
            id="adminEmail"
            class="admin-email"
          ></div>

          <button
            id="refreshButton"
            class="refresh-button"
            type="button"
          >
            REFRESH
          </button>

          <button
            id="logoutButton"
            class="logout-button"
            type="button"
          >
            LOGOUT
          </button>

        </div>

      </div>


      <div
        id="dashboardError"
        class="error-banner hidden"
      ></div>


      <!-- =================================================
           STATISTICS
           ================================================= -->

      <div class="stats-grid">

        <div class="stat-card">

          <div class="stat-label">
            Total
          </div>

          <div
            id="totalCount"
            class="stat-value"
          >
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-label">
            Check-In
          </div>

          <div
            id="checkedInCount"
            class="stat-value"
          >
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-label">
            Remaining
          </div>

          <div
            id="remainingCount"
            class="stat-value"
          >
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-label">
            FREE
          </div>

          <div
            id="freeCount"
            class="stat-value"
          >
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-label">
            VIP
          </div>

          <div
            id="vipCount"
            class="stat-value"
          >
            0
          </div>

        </div>

      </div>


      <!-- =================================================
           SEARCH / FILTER
           ================================================= -->

      <div class="controls">

        <div class="controls-row">

          <input
            id="searchInput"
            class="search-box"
            type="search"
            placeholder="Search name / WhatsApp / Pass ID..."
            autocomplete="off"
          >

          <select
            id="statusFilter"
            class="filter-select"
          >

            <option value="ALL">
              ALL STATUS
            </option>

            <option value="UNUSED">
              UNUSED
            </option>

            <option value="USED">
              USED
            </option>

          </select>


          <select
            id="accessFilter"
            class="filter-select"
          >

            <option value="ALL">
              ALL ACCESS
            </option>

            <option value="FREE">
              FREE
            </option>

            <option value="VIP">
              VIP
            </option>

          </select>

        </div>

      </div>


      <!-- =================================================
           REGISTRATION TABLE
           ================================================= -->

      <div class="table-card">

        <div class="table-header">

          <div class="table-title">
            REGISTRATIONS
          </div>

          <div
            id="tableCount"
            class="table-count"
          >
            0 records
          </div>

        </div>


        <div class="table-wrapper">

          <table>

            <thead>

              <tr>

                <th>
                  Name
                </th>

                <th>
                  WhatsApp
                </th>

                <th>
                  Pass ID
                </th>

                <th>
                  Access
                </th>

                <th>
                  Table
                </th>

                <th>
                  Status
                </th>

                <th>
                  Registered
                </th>

                <th>
                  Check-In
                </th>

              </tr>

            </thead>

            <tbody
              id="registrationTableBody"
            >

              <tr>

                <td
                  colspan="8"
                  class="table-message"
                >
                  Loading registrations...
                </td>

              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </div>

  </section>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    // =====================================================
    // SUPABASE CONFIG
    // =====================================================
    //
    // IMPORTANT:
    // Gunakan PUBLISHABLE KEY / ANON KEY.
    //
    // JANGAN masukkan:
    // sb_secret_...
    // SUPABASE_SECRET_KEYS
    //
    // =====================================================

    const SUPABASE_URL =
      'https://yrvnmmascklkuzpjkwxn.supabase.co';


    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_YGi3tPBuF9tW4KKnLJ5dDQ_AcBZ19WH';


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // =====================================================
    // ELEMENTS
    // =====================================================

    const loginScreen =
      document.getElementById(
        'loginScreen'
      );

    const dashboardScreen =
      document.getElementById(
        'dashboardScreen'
      );

    const loginForm =
      document.getElementById(
        'loginForm'
      );

    const loginEmail =
      document.getElementById(
        'loginEmail'
      );

    const loginPassword =
      document.getElementById(
        'loginPassword'
      );

    const loginButton =
      document.getElementById(
        'loginButton'
      );

    const loginMessage =
      document.getElementById(
        'loginMessage'
      );

    const adminEmail =
      document.getElementById(
        'adminEmail'
      );

    const logoutButton =
      document.getElementById(
        'logoutButton'
      );

    const refreshButton =
      document.getElementById(
        'refreshButton'
      );

    const dashboardError =
      document.getElementById(
        'dashboardError'
      );

    const searchInput =
      document.getElementById(
        'searchInput'
      );

    const statusFilter =
      document.getElementById(
        'statusFilter'
      );

    const accessFilter =
      document.getElementById(
        'accessFilter'
      );

    const tableBody =
      document.getElementById(
        'registrationTableBody'
      );

    const tableCount =
      document.getElementById(
        'tableCount'
      );


    // =====================================================
    // DATA
    // =====================================================

    let registrations = [];


    // =====================================================
    // LOGIN MESSAGE
    // =====================================================

    function showLoginError(message) {

      loginMessage.textContent =
        message;

      loginMessage.className =
        'login-message error';

    }


    function clearLoginError() {

      loginMessage.textContent =
        '';

      loginMessage.className =
        'login-message';

    }


    // =====================================================
    // DASHBOARD ERROR
    // =====================================================

    function showDashboardError(text) {

      dashboardError.textContent =
        text;

      dashboardError.classList.remove(
        'hidden'
      );

    }


    function clearDashboardError() {

      dashboardError.textContent =
        '';

      dashboardError.classList.add(
        'hidden'
      );

    }


    // =====================================================
    // LOGIN
    // =====================================================

    loginForm.addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();

        clearLoginError();

        loginButton.disabled =
          true;

        loginButton.textContent =
          'LOGGING IN...';

        try {

          const email =
            loginEmail.value.trim();

          const password =
            loginPassword.value;


          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword(
              {
                email,
                password
              }
            );


          if (error) {

            throw error;

          }


          if (!data.session) {

            throw new Error(
              'Login berhasil tetapi session tidak tersedia.'
            );

          }


          showDashboard(
            data.user
          );


          await loadRegistrations();

        }

        catch (error) {

          console.error(
            'LOGIN ERROR:',
            error
          );

          showLoginError(
            error.message ||
            'Login gagal.'
          );

        }

        finally {

          loginButton.disabled =
            false;

          loginButton.textContent =
            'LOGIN';

        }

      }
    );


    // =====================================================
    // SHOW DASHBOARD
    // =====================================================

    function showDashboard(user) {

      loginScreen.classList.add(
        'hidden'
      );

      dashboardScreen.classList.remove(
        'hidden'
      );


      adminEmail.textContent =
        user &&
        user.email
          ? user.email
          : '';

    }


    // =====================================================
    // LOGOUT
    // =====================================================

    logoutButton.addEventListener(
      'click',
      async function() {

        await supabaseClient.auth.signOut();

        registrations = [];

        dashboardScreen.classList.add(
          'hidden'
        );

        loginScreen.classList.remove(
          'hidden'
        );

        loginPassword.value =
          '';

        clearDashboardError();

      }
    );


    // =====================================================
    // LOAD REGISTRATIONS
    // =====================================================

    async function loadRegistrations() {

      clearDashboardError();

      refreshButton.disabled =
        true;

      refreshButton.textContent =
        'LOADING...';


      tableBody.innerHTML =
        `
          <tr>
            <td
              colspan="8"
              class="table-message"
            >
              Loading registrations...
            </td>
          </tr>
        `;


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from('registrations')
            .select(
              `
                id,
                pass_id,
                qr_token,
                name,
                whatsapp,
                access_type,
                table_package,
                stay_connected,
                community,
                pass_status,
                created_at,
                checked_in_at,
                checked_in_by
              `
            )
            .order(
              'created_at',
              {
                ascending: false
              }
            );


        if (error) {

          throw error;

        }


        registrations =
          Array.isArray(data)
            ? data
            : [];


        updateStatistics();

        renderTable();

      }

      catch (error) {

        console.error(
          'LOAD REGISTRATIONS ERROR:',
          error
        );


        registrations = [];

        updateStatistics();

        tableBody.innerHTML =
          `
            <tr>
              <td
                colspan="8"
                class="table-message"
              >
                Tidak dapat membaca data registrations.
              </td>
            </tr>
          `;


        showDashboardError(
          error.message ||
          'Gagal memuat data registrasi.'
        );

      }

      finally {

        refreshButton.disabled =
          false;

        refreshButton.textContent =
          'REFRESH';

      }

    }


    // =====================================================
    // STATISTICS
    // =====================================================

    function updateStatistics() {

      const total =
        registrations.length;


      const checkedIn =
        registrations.filter(
          function(row) {

            return (
              String(
                row.pass_status || ''
              ).toUpperCase()
              === 'USED'
            );

          }
        ).length;


      const remaining =
        total - checkedIn;


      const free =
        registrations.filter(
          function(row) {

            return (
              String(
                row.access_type || ''
              ).toUpperCase()
              === 'FREE'
            );

          }
        ).length;


      const vip =
        registrations.filter(
          function(row) {

            return (
              String(
                row.access_type || ''
              ).toUpperCase()
              === 'VIP'
            );

          }
        ).length;


      document.getElementById(
        'totalCount'
      ).textContent =
        total;


      document.getElementById(
        'checkedInCount'
      ).textContent =
        checkedIn;


      document.getElementById(
        'remainingCount'
      ).textContent =
        remaining;


      document.getElementById(
        'freeCount'
      ).textContent =
        free;


      document.getElementById(
        'vipCount'
      ).textContent =
        vip;

    }


    // =====================================================
    // FILTER
    // =====================================================

    function getFilteredRegistrations() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();


      const status =
        statusFilter.value;


      const access =
        accessFilter.value;


      return registrations.filter(
        function(row) {

          const name =
            String(
              row.name || ''
            ).toLowerCase();

          const whatsapp =
            String(
              row.whatsapp || ''
            ).toLowerCase();

          const passId =
            String(
              row.pass_id || ''
            ).toLowerCase();

          const rowStatus =
            String(
              row.pass_status || ''
            ).toUpperCase();

          const rowAccess =
            String(
              row.access_type || ''
            ).toUpperCase();


          const matchesSearch =
            !search ||
            name.includes(search) ||
            whatsapp.includes(search) ||
            passId.includes(search);


          const matchesStatus =
            status === 'ALL' ||
            rowStatus === status;


          const matchesAccess =
            access === 'ALL' ||
            rowAccess === access;


          return (
            matchesSearch &&
            matchesStatus &&
            matchesAccess
          );

        }
      );

    }


    // =====================================================
    // RENDER TABLE
    // =====================================================

    function renderTable() {

      const rows =
        getFilteredRegistrations();


      tableCount.textContent =
        rows.length +
        (
          rows.length === 1
            ? ' record'
            : ' records'
        );


      if (rows.length === 0) {

        tableBody.innerHTML =
          `
            <tr>
              <td
                colspan="8"
                class="table-message"
              >
                Tidak ada data yang cocok.
              </td>
            </tr>
          `;

        return;

      }


      tableBody.innerHTML =
        rows
          .map(
            function(row) {

              return `
                <tr>

                  <td class="name-cell">
                    ${escapeHtml(
                      row.name
                    )}
                  </td>

                  <td>
                    ${escapeHtml(
                      row.whatsapp
                    )}
                  </td>

                  <td class="pass-id-cell">
                    ${escapeHtml(
                      row.pass_id
                    )}
                  </td>

                  <td>
                    ${accessBadge(
                      row.access_type
                    )}
                  </td>

                  <td>
                    ${
                      row.table_package
                        ? escapeHtml(
                            row.table_package
                          )
                        : '<span class="muted">—</span>'
                    }
                  </td>

                  <td>
                    ${statusBadge(
                      row.pass_status
                    )}
                  </td>

                  <td>
                    ${formatDate(
                      row.created_at
                    )}
                  </td>

                  <td>
                    ${
                      row.checked_in_at
                        ? formatDate(
                            row.checked_in_at
                          )
                        : '<span class="muted">—</span>'
                    }
                  </td>

                </tr>
              `;

            }
          )
          .join('');

    }


    // =====================================================
    // STATUS BADGE
    // =====================================================

    function statusBadge(status) {

      const value =
        String(
          status || ''
        ).toUpperCase();


      if (value === 'USED') {

        return `
          <span class="badge badge-used">
            USED
          </span>
        `;

      }


      return `
        <span class="badge badge-unused">
          UNUSED
        </span>
      `;

    }


    // =====================================================
    // ACCESS BADGE
    // =====================================================

    function accessBadge(access) {

      const value =
        String(
          access || ''
        ).toUpperCase();


      if (value === 'VIP') {

        return `
          <span class="badge badge-vip">
            VIP
          </span>
        `;

      }


      return `
        <span class="badge badge-free">
          FREE
        </span>
      `;

    }


    // =====================================================
    // DATE FORMAT
    // =====================================================

    function formatDate(value) {

      if (!value) {

        return '—';

      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return escapeHtml(
          value
        );

      }


      return date.toLocaleString(
        'id-ID',
        {
          dateStyle: 'short',
          timeStyle: 'short'
        }
      );

    }


    // =====================================================
    // HTML ESCAPE
    // =====================================================

    function escapeHtml(value) {

      return String(
        value == null
          ? ''
          : value
      )

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    // =====================================================
    // REFRESH
    // =====================================================

    refreshButton.addEventListener(
      'click',
      function() {

        loadRegistrations();

      }
    );


    // =====================================================
    // LIVE SEARCH
    // =====================================================

    searchInput.addEventListener(
      'input',
      function() {

        renderTable();

      }
    );


    statusFilter.addEventListener(
      'change',
      function() {

        renderTable();

      }
    );


    accessFilter.addEventListener(
      'change',
      function() {

        renderTable();

      }
    );


    // =====================================================
    // CHECK EXISTING SESSION
    // =====================================================

    async function checkExistingSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          throw error;

        }


        const session =
          data.session;


        if (
          session &&
          session.user
        ) {

          showDashboard(
            session.user
          );

          await loadRegistrations();

        }

      }

      catch (error) {

        console.error(
          'SESSION ERROR:',
          error
        );

      }

    }


    // =====================================================
    // AUTH STATE
    // =====================================================

    supabaseClient.auth.onAuthStateChange(
      function(
        event,
        session
      ) {

        if (
          event === 'SIGNED_OUT'
        ) {

          dashboardScreen.classList.add(
            'hidden'
          );

          loginScreen.classList.remove(
            'hidden'
          );

        }

      }
    );


    // =====================================================
    // START
    // =====================================================

    checkExistingSession();

  </script>

</body>
</html>
