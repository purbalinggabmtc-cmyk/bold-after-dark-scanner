<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOLD AFTER DARK — CHECK IN</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #2a0000 0%,
          #080808 45%,
          #000000 100%
        );
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 4px;
    }

    .brand span {
      color: #e00000;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 3px;
      color: #aaa;
      margin-bottom: 24px;
    }

    .scanner-card {
      background: #111;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 16px;
      box-shadow:
        0 0 30px rgba(255, 0, 0, .12);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    .manual {
      margin-top: 18px;
      display: flex;
      gap: 8px;
    }

    .manual input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      background: #1c1c1c;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .manual button {
      padding: 14px 18px;
      background: #e00000;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 18px;
      padding: 20px;
      border-radius: 14px;
      display: none;
    }

    .result.valid {
      display: block;
      background: #062d16;
      border: 2px solid #16c75a;
    }

    .result.used {
      display: block;
      background: #2d2100;
      border: 2px solid #e2b400;
    }

    .result.invalid {
      display: block;
      background: #300000;
      border: 2px solid #e00000;
    }

    .result.error {
      display: block;
      background: #222;
      border: 2px solid #777;
    }

    .result-title {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .valid .result-title {
      color: #16c75a;
    }

    .used .result-title {
      color: #e2b400;
    }

    .invalid .result-title {
      color: #ff3333;
    }

    .detail {
      margin-top: 8px;
      font-size: 15px;
      color: #ddd;
      line-height: 1.5;
    }

    .detail strong {
      color: white;
    }

    .reset {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      background: #e00000;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .reset:active {
      transform: scale(.98);
    }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #666;
      letter-spacing: 2px;
    }
  </style>

</head>


<body>

  <div class="container">

    <div class="brand">
      BOLD <span>AFTER DARK</span>
    </div>

    <div class="subtitle">
      EVENT CHECK-IN
    </div>

    <div class="scanner-card">

      <div id="reader"></div>

      <div class="manual">

        <input
          id="manualToken"
          type="text"
          placeholder="Masukkan QR token"
          autocomplete="off"
        >

        <button
          type="button"
          onclick="manualCheckIn()"
        >
          CHECK
        </button>

      </div>

      <div
        id="result"
        class="result"
      >

        <div
          id="resultTitle"
          class="result-title"
        ></div>

        <div
          id="resultDetails"
        ></div>

        <button
          type="button"
          class="reset"
          onclick="resetScanner()"
        >
          SCAN BERIKUTNYA
        </button>

      </div>

    </div>

    <div class="footer">
      BOLD AFTER DARK • THE NIGHT STARTS HERE
    </div>

  </div>


  <script>

    // =====================================================
    // SUPABASE DYNAMIC SERVICE
    // =====================================================

    const API_URL =
      "https://yrvnmmascklkuzpjkwxn.supabase.co/functions/v1/dynamic-service";


    // =====================================================
    // SUPABASE PUBLISHABLE KEY
    //
    // Ini adalah KEY yang sama yang sebelumnya berhasil
    // digunakan pada test Console.
    //
    // Jangan masukkan SUPABASE SECRET KEY di sini.
    // =====================================================

    const SUPABASE_PUBLISHABLE_KEY =
      "GANTI_DENGAN_PUBLISHABLE_KEY_ANDA";


    let scanner = null;

    let processing = false;


    // =====================================================
    // START SCANNER
    // =====================================================

    function startScanner() {

      processing = false;

      if (scanner) {

        try {
          scanner.clear();
        } catch (error) {
        }

        scanner = null;
      }

      scanner =
        new Html5QrcodeScanner(
          "reader",
          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            },

            rememberLastUsedCamera: true,

            supportedScanTypes: [
              Html5QrcodeScanType.SCAN_TYPE_CAMERA,
              Html5QrcodeScanType.SCAN_TYPE_FILE
            ]
          },
          false
        );

      scanner.render(
        onScanSuccess,
        onScanError
      );
    }


    // =====================================================
    // QR BERHASIL TERBACA
    // =====================================================

    function onScanSuccess(decodedText) {

      if (processing) {
        return;
      }

      processing = true;

      if (scanner) {

        scanner
          .clear()
          .catch(function () {});

      }

      processToken(decodedText);
    }


    // =====================================================
    // ERROR SCANNER
    // =====================================================

    function onScanError(errorMessage) {

      // Tidak menampilkan error scan secara realtime.

    }


    // =====================================================
    // CHECK-IN KE SUPABASE
    // =====================================================

    async function processToken(token) {

      showLoading();

      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_PUBLISHABLE_KEY
              },

              body:
                JSON.stringify({
                  action: "checkIn",
                  token: token,
                  checkedInBy: "SCANNER"
                })
            }
          );


        const raw =
          await response.text();


        console.log(
          "CHECK-IN HTTP STATUS:",
          response.status
        );

        console.log(
          "CHECK-IN RAW RESPONSE:",
          raw
        );


        let result;

        try {

          result =
            JSON.parse(raw);

        } catch (error) {

          throw new Error(
            "Server mengembalikan response yang bukan JSON."
          );

        }


        if (!response.ok) {

          throw new Error(
            result.message ||
            "Check-in server error."
          );

        }


        showResult(result);

      }

      catch (error) {

        console.error(
          "CHECK-IN ERROR:",
          error
        );

        showServerError({
          message:
            error.message ||
            "Tidak dapat menghubungi server check-in."
        });

      }

    }


    // =====================================================
    // MANUAL TOKEN
    // =====================================================

    function manualCheckIn() {

      if (processing) {
        return;
      }

      const input =
        document.getElementById(
          "manualToken"
        );

      const token =
        input.value.trim();

      if (!token) {

        showTemporaryError(
          "QR TOKEN KOSONG"
        );

        return;
      }

      processing = true;

      if (scanner) {

        scanner
          .clear()
          .catch(function () {});

      }

      processToken(token);
    }


    // =====================================================
    // HASIL SERVER
    // =====================================================

    function showResult(result) {

      const box =
        document.getElementById(
          "result"
        );

      const title =
        document.getElementById(
          "resultTitle"
        );

      const details =
        document.getElementById(
          "resultDetails"
        );


      box.className =
        "result";


      // ===================================================
      // VALID
      // ===================================================

      if (
        result &&
        result.status === "VALID"
      ) {

        box.classList.add(
          "valid"
        );

        title.textContent =
          "✓ ENTRY APPROVED";


        details.innerHTML =

          '<div class="detail">' +

          "<strong>NAMA</strong><br>" +

          escapeHtml(
            result.name
          ) +

          "</div>" +


          '<div class="detail">' +

          "<strong>PASS ID</strong><br>" +

          escapeHtml(
            result.passId
          ) +

          "</div>" +


          '<div class="detail">' +

          "<strong>ACCESS</strong><br>" +

          escapeHtml(
            result.accessType
          ) +

          "</div>" +


          '<div class="detail">' +

          "<strong>CHECK-IN</strong><br>" +

          escapeHtml(
            result.checkInTime
          ) +

          "</div>";

      }


      // ===================================================
      // ALREADY USED
      // ===================================================

      else if (
        result &&
        result.status === "ALREADY_USED"
      ) {

        box.classList.add(
          "used"
        );

        title.textContent =
          "⚠ ALREADY USED";


        details.innerHTML =

          '<div class="detail">' +

          "<strong>QR INI SUDAH DIGUNAKAN</strong>" +

          "</div>" +


          '<div class="detail">' +

          "<strong>NAMA</strong><br>" +

          escapeHtml(
            result.name
          ) +

          "</div>" +


          '<div class="detail">' +

          "<strong>PASS ID</strong><br>" +

          escapeHtml(
            result.passId
          ) +

          "</div>" +


          '<div class="detail">' +

          "<strong>CHECK-IN</strong><br>" +

          escapeHtml(
            result.checkInTime
          ) +

          "</div>";

      }


      // ===================================================
      // INVALID
      // ===================================================

      else if (
        result &&
        result.status === "INVALID"
      ) {

        box.classList.add(
          "invalid"
        );

        title.textContent =
          "✕ INVALID QR";


        details.innerHTML =

          '<div class="detail">' +

          escapeHtml(
            result.message ||
            "QR tidak terdaftar."
          ) +

          "</div>";

      }


      // ===================================================
      // ERROR
      // ===================================================

      else {

        box.classList.add(
          "error"
        );

        title.textContent =
          "SYSTEM ERROR";


        details.innerHTML =

          '<div class="detail">' +

          escapeHtml(
            result &&
            result.message
              ? result.message
              : "Terjadi kesalahan pada server check-in."
          ) +

          "</div>";

      }


      box.style.display =
        "block";
    }


    // =====================================================
    // LOADING
    // =====================================================

    function showLoading() {

      const box =
        document.getElementById(
          "result"
        );

      const title =
        document.getElementById(
          "resultTitle"
        );

      const details =
        document.getElementById(
          "resultDetails"
        );


      box.className =
        "result error";

      box.style.display =
        "block";


      title.textContent =
        "CHECKING...";


      details.innerHTML =

        '<div class="detail">' +

        "Memverifikasi QR ke server..." +

        "</div>";
    }


    // =====================================================
    // SERVER ERROR
    // =====================================================

    function showServerError(error) {

      const box =
        document.getElementById(
          "result"
        );

      const title =
        document.getElementById(
          "resultTitle"
        );

      const details =
        document.getElementById(
          "resultDetails"
        );


      box.className =
        "result error";

      box.style.display =
        "block";


      title.textContent =
        "SYSTEM ERROR";


      details.innerHTML =

        '<div class="detail">' +

        escapeHtml(
          error &&
          error.message
            ? error.message
            : "Tidak dapat menghubungi server check-in."
        ) +

        "</div>";
    }


    // =====================================================
    // TEMPORARY ERROR
    // =====================================================

    function showTemporaryError(message) {

      const box =
        document.getElementById(
          "result"
        );

      const title =
        document.getElementById(
          "resultTitle"
        );

      const details =
        document.getElementById(
          "resultDetails"
        );


      box.className =
        "result invalid";

      box.style.display =
        "block";


      title.textContent =
        "✕ INVALID";


      details.innerHTML =

        '<div class="detail">' +

        escapeHtml(message) +

        "</div>";
    }


    // =====================================================
    // RESET SCANNER
    // =====================================================

    function resetScanner() {

      const box =
        document.getElementById(
          "result"
        );

      box.style.display =
        "none";


      const input =
        document.getElementById(
          "manualToken"
        );

      input.value =
        "";


      processing =
        false;


      startScanner();
    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(value) {

      return String(
        value == null
          ? ""
          : value
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );
    }


    // =====================================================
    // START SAAT HALAMAN DIBUKA
    // =====================================================

    window.addEventListener(
      "load",
      function () {

        startScanner();

      }
    );

  </script>

</body>

</html>
