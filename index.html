<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOLD AFTER DARK — CHECK IN</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #2a0000 0%,
          #080808 45%,
          #000000 100%
        );

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }

    .container {

      width: 100%;

      max-width: 480px;

      text-align: center;

    }

    .brand {

      font-size: 28px;

      font-weight: 900;

      letter-spacing: 4px;

      margin-bottom: 4px;

    }

    .brand span {

      color: #e00000;

    }

    .subtitle {

      font-size: 13px;

      letter-spacing: 3px;

      color: #aaa;

      margin-bottom: 24px;

    }

    .scanner-card {

      background: #111;

      border: 1px solid #333;

      border-radius: 18px;

      padding: 16px;

      box-shadow:
        0 0 30px rgba(255, 0, 0, .12);

    }

    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 12px;

    }

    .manual {

      margin-top: 18px;

      display: flex;

      gap: 8px;

    }

    .manual input {

      flex: 1;

      min-width: 0;

      padding: 14px;

      background: #1c1c1c;

      color: white;

      border: 1px solid #444;

      border-radius: 8px;

      font-size: 15px;

      outline: none;

    }

    .manual input:focus {

      border-color: #e00000;

    }

    .manual button {

      padding: 14px 18px;

      background: #e00000;

      color: white;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

    }

    .manual button:disabled {

      opacity: .5;

      cursor: not-allowed;

    }

    .result {

      margin-top: 18px;

      padding: 20px;

      border-radius: 14px;

      display: none;

    }

    .result.valid {

      display: block;

      background: #062d16;

      border: 2px solid #16c75a;

    }

    .result.used {

      display: block;

      background: #2d2100;

      border: 2px solid #e2b400;

    }

    .result.invalid {

      display: block;

      background: #300000;

      border: 2px solid #e00000;

    }

    .result.error {

      display: block;

      background: #222;

      border: 2px solid #777;

    }

    .result-title {

      font-size: 28px;

      font-weight: 900;

      margin-bottom: 12px;

    }

    .valid .result-title {

      color: #16c75a;

    }

    .used .result-title {

      color: #e2b400;

    }

    .invalid .result-title {

      color: #ff3333;

    }

    .error .result-title {

      color: #ff9999;

    }

    .detail {

      margin-top: 8px;

      font-size: 15px;

      color: #ddd;

      line-height: 1.5;

    }

    .detail strong {

      color: white;

    }

    .reset {

      margin-top: 18px;

      width: 100%;

      padding: 14px;

      background: #e00000;

      color: white;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

      font-size: 15px;

    }

    .reset:active {

      transform: scale(.98);

    }

    .reset:disabled {

      opacity: .5;

      cursor: not-allowed;

    }

    .footer {

      margin-top: 20px;

      font-size: 11px;

      color: #666;

      letter-spacing: 2px;

    }

  </style>

</head>


<body>


  <div class="container">


    <div class="brand">

      BOLD <span>AFTER DARK</span>

    </div>


    <div class="subtitle">

      EVENT CHECK-IN

    </div>


    <div class="scanner-card">


      <div id="reader"></div>


      <div class="manual">

        <input
          id="manualToken"
          type="text"
          placeholder="Masukkan QR token"
          autocomplete="off"
        >

        <button
          type="button"
          id="manualButton"
          onclick="manualCheckIn()"
        >
          CHECK
        </button>

      </div>


      <div
        id="result"
        class="result"
      >

        <div
          id="resultTitle"
          class="result-title"
        ></div>


        <div
          id="resultDetails"
        ></div>


        <button
          type="button"
          id="resetButton"
          class="reset"
          onclick="resetScanner()"
        >
          SCAN BERIKUTNYA
        </button>

      </div>


    </div>


    <div class="footer">

      BOLD AFTER DARK • THE NIGHT STARTS HERE

    </div>


  </div>


  <script>

    // =====================================================
    // SUPABASE CONFIGURATION
    // =====================================================

    const API_URL =
      "https://yrvnmmascklkuzpjkwxn.supabase.co/functions/v1/dynamic-service";


    /*
      GANTI NILAI DI BAWAH INI DENGAN
      SUPABASE PUBLISHABLE KEY KAMU.

      Contoh format:

      sb_publishable_xxxxxxxxxxxxxxxxx

      JANGAN gunakan:

      sb_secret_...
    */

    const SUPABASE_KEY =
      "sb_publishable_YGi3tPBuF9tW4KKnLJ5dDQ_AcBZ19WH";


    // =====================================================
    // STATE
    // =====================================================

    let scanner = null;

    let processing = false;

    let requestController = null;


    // =====================================================
    // START SCANNER
    // =====================================================

    function startScanner() {

      processing = false;


      if (scanner) {

        try {

          scanner.clear();

        }

        catch (error) {

          console.warn(
            "Scanner clear error:",
            error
          );

        }

        scanner = null;

      }


      scanner =
        new Html5QrcodeScanner(

          "reader",

          {

            fps: 10,

            qrbox: {

              width: 250,

              height: 250

            },

            rememberLastUsedCamera: true,

            supportedScanTypes: [

              Html5QrcodeScanType.SCAN_TYPE_CAMERA,

              Html5QrcodeScanType.SCAN_TYPE_FILE

            ]

          },

          false

        );


      scanner.render(

        onScanSuccess,

        onScanError

      );

    }


    // =====================================================
    // QR BERHASIL TERBACA
    // =====================================================

    function onScanSuccess(decodedText) {

      if (processing) {

        return;

      }


      processing = true;


      if (scanner) {

        scanner.clear()

          .catch(
            function () {}
          );

      }


      processToken(decodedText);

    }


    // =====================================================
    // SCAN ERROR
    // =====================================================

    function onScanError(errorMessage) {

      // Sengaja tidak menampilkan
      // error scanner ke user.

    }


    // =====================================================
    // PROCESS TOKEN
    // =====================================================

    async function processToken(token) {

      showLoading();


      token =
        String(
          token || ""
        ).trim();


      if (!token) {

        showTemporaryError(
          "QR TOKEN KOSONG"
        );

        processing = false;

        return;

      }


      if (
        !SUPABASE_KEY ||
        SUPABASE_KEY ===
          "PASTE_PUBLISHABLE_KEY_DI_SINI"
      ) {

        showServerError({

          message:
            "Supabase Publishable Key belum diisi."

        });

        processing = false;

        return;

      }


      try {

        // -------------------------------------------------
        // ABORT CONTROLLER
        // -------------------------------------------------

        requestController =
          new AbortController();


        const timeout =
          setTimeout(

            function () {

              requestController.abort();

            },

            15000

          );


        // -------------------------------------------------
        // SEND TO SUPABASE EDGE FUNCTION
        // -------------------------------------------------

        const response =
          await fetch(

            API_URL,

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY

              },

              body:
                JSON.stringify({

                  action:
                    "checkIn",

                  token:
                    token

                }),

              signal:
                requestController.signal

            }

          );


        clearTimeout(timeout);


        // -------------------------------------------------
        // READ RESPONSE
        // -------------------------------------------------

        const raw =
          await response.text();


        console.log(
          "CHECK-IN HTTP STATUS:",
          response.status
        );


        console.log(
          "CHECK-IN RAW RESPONSE:",
          raw
        );


        let data = null;


        try {

          data =
            JSON.parse(raw);

        }

        catch (parseError) {

          throw new Error(
            "Server mengembalikan response yang bukan JSON."
          );

        }


        console.log(
          "CHECK-IN JSON:",
          data
        );


        // -------------------------------------------------
        // HTTP ERROR
        // -------------------------------------------------

        if (!response.ok) {

          throw new Error(

            data &&
            data.message

              ? data.message

              : "Server check-in error."

          );

        }


        // -------------------------------------------------
        // SHOW RESULT
        // -------------------------------------------------

        showResult(data);

      }


      catch (error) {

        console.error(
          "CHECK-IN ERROR:",
          error
        );


        if (
          error &&
          error.name ===
            "AbortError"
        ) {

          showServerError({

            message:
              "Server check-in tidak memberikan respons dalam 15 detik."

          });

        }

        else {

          showServerError({

            message:

              error &&
              error.message

                ? error.message

                : "Tidak dapat menghubungi server check-in."

          });

        }

      }


      finally {

        requestController =
          null;

      }

    }


    // =====================================================
    // MANUAL TOKEN
    // =====================================================

    function manualCheckIn() {

      if (processing) {

        return;

      }


      const input =
        document.getElementById(
          "manualToken"
        );


      const token =
        input.value.trim();


      if (!token) {

        showTemporaryError(
          "QR TOKEN KOSONG"
        );

        return;

      }


      processing = true;


      if (scanner) {

        scanner.clear()

          .catch(
            function () {}
          );

      }


      processToken(token);

    }


    // =====================================================
    // SHOW RESULT
    // =====================================================

    function showResult(result) {

      const box =
        document.getElementById(
          "result"
        );


      const title =
        document.getElementById(
          "resultTitle"
        );


      const details =
        document.getElementById(
          "resultDetails"
        );


      box.className =
        "result";


      // ===================================================
      // VALID
      // ===================================================

      if (

        result &&

        result.status ===
          "VALID"

      ) {

        box.classList.add(
          "valid"
        );


        title.textContent =
          "✓ ENTRY APPROVED";


        let html = "";


        html +=

          '<div class="detail">' +

          "<strong>NAMA</strong><br>" +

          escapeHtml(
            result.name
          ) +

          "</div>";


        html +=

          '<div class="detail">' +

          "<strong>PASS ID</strong><br>" +

          escapeHtml(
            result.passId
          ) +

          "</div>";


        html +=

          '<div class="detail">' +

          "<strong>ACCESS</strong><br>" +

          escapeHtml(
            result.accessType
          ) +

          "</div>";


        if (
          result.tablePackage
        ) {

          html +=

            '<div class="detail">' +

            "<strong>TABLE</strong><br>" +

            escapeHtml(
              result.tablePackage
            ) +

            "</div>";

        }


        if (
          result.checkInTime
        ) {

          html +=

            '<div class="detail">' +

            "<strong>CHECK-IN</strong><br>" +

            escapeHtml(
              result.checkInTime
            ) +

            "</div>";

        }


        if (
          result.checkedInBy
        ) {

          html +=

            '<div class="detail">' +

            "<strong>CHECKED IN BY</strong><br>" +

            escapeHtml(
              result.checkedInBy
            ) +

            "</div>";

        }


        details.innerHTML =
          html;

      }


      // ===================================================
      // ALREADY USED
      // ===================================================

      else if (

        result &&

        result.status ===
          "ALREADY_USED"

      ) {

        box.classList.add(
          "used"
        );


        title.textContent =
          "⚠ ALREADY USED";


        let html = "";


        html +=

          '<div class="detail">' +

          "<strong>QR INI SUDAH DIGUNAKAN</strong>" +

          "</div>";


        html +=

          '<div class="detail">' +

          "<strong>NAMA</strong><br>" +

          escapeHtml(
            result.name
          ) +

          "</div>";


        html +=

          '<div class="detail">' +

          "<strong>PASS ID</strong><br>" +

          escapeHtml(
            result.passId
          ) +

          "</div>";


        html +=

          '<div class="detail">' +

          "<strong>ACCESS</strong><br>" +

          escapeHtml(
            result.accessType
          ) +

          "</div>";


        if (
          result.checkInTime
        ) {

          html +=

            '<div class="detail">' +

            "<strong>CHECK-IN</strong><br>" +

            escapeHtml(
              result.checkInTime
            ) +

            "</div>";

        }


        if (
          result.checkedInBy
        ) {

          html +=

            '<div class="detail">' +

            "<strong>CHECKED IN BY</strong><br>" +

            escapeHtml(
              result.checkedInBy
            ) +

            "</div>";

        }


        details.innerHTML =
          html;

      }


      // ===================================================
      // INVALID
      // ===================================================

      else if (

        result &&

        result.status ===
          "INVALID"

      ) {

        box.classList.add(
          "invalid"
        );


        title.textContent =
          "✕ INVALID QR";


        details.innerHTML =

          '<div class="detail">' +

          escapeHtml(

            result.message ||

            "QR tidak terdaftar."

          ) +

          "</div>";

      }


      // ===================================================
      // OTHER SERVER RESPONSE
      // ===================================================

      else {

        box.classList.add(
          "error"
        );


        title.textContent =
          "SYSTEM ERROR";


        details.innerHTML =

          '<div class="detail">' +

          escapeHtml(

            result &&
            result.message

              ? result.message

              : "Terjadi kesalahan pada server check-in."

          ) +

          "</div>";

      }


      box.style.display =
        "block";

    }


    // =====================================================
    // LOADING
    // =====================================================

    function showLoading() {

      const box =
        document.getElementById(
          "result"
        );


      const title =
        document.getElementById(
          "resultTitle"
        );


      const details =
        document.getElementById(
          "resultDetails"
        );


      box.className =
        "result error";


      box.style.display =
        "block";


      title.textContent =
        "CHECKING...";


      details.innerHTML =

        '<div class="detail">' +

        "Memverifikasi QR ke Supabase..." +

        "</div>";

    }


    // =====================================================
    // SERVER ERROR
    // =====================================================

    function showServerError(error) {

      const box =
        document.getElementById(
          "result"
        );


      const title =
        document.getElementById(
          "resultTitle"
        );


      const details =
        document.getElementById(
          "resultDetails"
        );


      box.className =
        "result error";


      box.style.display =
        "block";


      title.textContent =
        "SYSTEM ERROR";


      details.innerHTML =

        '<div class="detail">' +

        escapeHtml(

          error &&
          error.message

            ? error.message

            : "Tidak dapat menghubungi server check-in."

        ) +

        "</div>";

    }


    // =====================================================
    // TEMPORARY ERROR
    // =====================================================

    function showTemporaryError(message) {

      const box =
        document.getElementById(
          "result"
        );


      const title =
        document.getElementById(
          "resultTitle"
        );


      const details =
        document.getElementById(
          "resultDetails"
        );


      box.className =
        "result invalid";


      box.style.display =
        "block";


      title.textContent =
        "✕ INVALID";


      details.innerHTML =

        '<div class="detail">' +

        escapeHtml(
          message
        ) +

        "</div>";

    }


    // =====================================================
    // RESET SCANNER
    // =====================================================

    function resetScanner() {

      const box =
        document.getElementById(
          "result"
        );


      box.style.display =
        "none";


      const input =
        document.getElementById(
          "manualToken"
        );


      input.value =
        "";


      processing =
        false;


      startScanner();

    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(value) {

      return String(

        value == null
          ? ""
          : value

      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =====================================================
    // MANUAL INPUT ENTER
    // =====================================================

    document
      .getElementById(
        "manualToken"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter"
          ) {

            event.preventDefault();

            manualCheckIn();

          }

        }
      );


    // =====================================================
    // START WHEN PAGE LOADS
    // =====================================================

    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>


</body>

</html>
