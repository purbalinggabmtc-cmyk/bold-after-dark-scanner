<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>BOLD AFTER DARK — CHECK IN</title>


  <!-- HTML5 QR CODE -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #2a0000 0%,
          #080808 45%,
          #000000 100%
        );

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }


    .container {

      width: 100%;

      max-width: 480px;

      text-align: center;

    }


    .brand {

      font-size: 28px;

      font-weight: 900;

      letter-spacing: 4px;

      margin-bottom: 4px;

    }


    .brand span {

      color: #e00000;

    }


    .subtitle {

      font-size: 13px;

      letter-spacing: 3px;

      color: #aaa;

      margin-bottom: 24px;

    }


    .scanner-card {

      background: #111;

      border: 1px solid #333;

      border-radius: 18px;

      padding: 16px;

      box-shadow:
        0 0 30px rgba(255,0,0,.12);

    }


    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 12px;

    }


    .manual {

      margin-top: 18px;

      display: flex;

      gap: 8px;

    }


    .manual input {

      flex: 1;

      min-width: 0;

      padding: 14px;

      background: #1c1c1c;

      color: white;

      border: 1px solid #444;

      border-radius: 8px;

      font-size: 15px;

      outline: none;

    }


    .manual button {

      padding: 14px 18px;

      background: #e00000;

      color: white;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

    }


    .result {

      margin-top: 18px;

      padding: 20px;

      border-radius: 14px;

      display: none;

    }


    .result.valid {

      display: block;

      background: #062d16;

      border: 2px solid #16c75a;

    }


    .result.used {

      display: block;

      background: #2d2100;

      border: 2px solid #e2b400;

    }


    .result.invalid {

      display: block;

      background: #300000;

      border: 2px solid #e00000;

    }


    .result.error {

      display: block;

      background: #222;

      border: 2px solid #777;

    }


    .result-title {

      font-size: 28px;

      font-weight: 900;

      margin-bottom: 12px;

    }


    .valid .result-title {

      color: #16c75a;

    }


    .used .result-title {

      color: #e2b400;

    }


    .invalid .result-title {

      color: #ff3333;

    }


    .detail {

      margin-top: 8px;

      font-size: 15px;

      color: #ddd;

    }


    .detail strong {

      color: white;

    }


    .reset {

      margin-top: 18px;

      width: 100%;

      padding: 14px;

      background: transparent;

      color: white;

      border: 1px solid #555;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

    }


    .footer {

      margin-top: 20px;

      font-size: 11px;

      color: #666;

      letter-spacing: 2px;

    }

  </style>

</head>


<body>


  <div class="container">


    <div class="brand">
      BOLD <span>AFTER DARK</span>
    </div>


    <div class="subtitle">
      EVENT CHECK-IN
    </div>


    <div class="scanner-card">


      <div id="reader"></div>


      <div class="manual">

        <input
          id="manualToken"
          type="text"
          placeholder="Masukkan QR token"
          autocomplete="off"
        >

        <button onclick="manualCheckIn()">
          CHECK
        </button>

      </div>


      <div
        id="result"
        class="result"
      >

        <div
          id="resultTitle"
          class="result-title">
        </div>


        <div
          id="resultDetails">
        </div>


        <button
          class="reset"
          onclick="resetScanner()">
          SCAN BERIKUTNYA
        </button>

      </div>


    </div>


    <div class="footer">
      BOLD AFTER DARK • THE NIGHT STARTS HERE
    </div>


  </div>


  <script>

    // =====================================================
    // APPS SCRIPT WEB APP URL
    // =====================================================

    const API_URL =
      'https://script.google.com/macros/s/AKfycbyK1Z2di-NVODR-w9f9GEv8zhmPmQBsb9S1kf44DDu53ln3yo9N6XEBBi_2gbzR-VxwtA/exec';


    let scanner;

    let processing = false;


    // =====================================================
    // START SCANNER
    // =====================================================

    function startScanner() {

      scanner =
        new Html5QrcodeScanner(

          "reader",

          {

            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            },

            rememberLastUsedCamera: true,

            supportedScanTypes: [
              Html5QrcodeScanType.SCAN_TYPE_CAMERA,
              Html5QrcodeScanType.SCAN_TYPE_FILE
            ]

          },

          false

        );


      scanner.render(
        onScanSuccess,
        onScanError
      );

    }


    // =====================================================
    // QR BERHASIL TERBACA
    // =====================================================

    function onScanSuccess(decodedText) {

      if (processing) {
        return;
      }


      processing = true;


      // Hentikan scanner sementara
      if (scanner) {

        scanner.clear()
          .catch(function() {});

      }


      processToken(decodedText);

    }


    // =====================================================
    // ERROR SCANNER
    // =====================================================

    function onScanError(errorMessage) {

      // Sengaja dikosongkan.
      // Scanner akan terus mencoba membaca QR.

    }


    // =====================================================
    // PROSES TOKEN
    // =====================================================
    //
    // GitHub Pages tidak memiliki google.script.run.
    //
    // Karena itu token dikirim ke Apps Script Web App
    // menggunakan JSONP.
    // =====================================================

    function processToken(token) {

      showLoading();


      const callbackName =
        'checkInCallback_' + Date.now();


      window[callbackName] =
        function(result) {

          try {

            showResult(result);

          }

          finally {

            delete window[callbackName];

            const oldScript =
              document.getElementById(
                callbackName
              );

            if (oldScript) {
              oldScript.remove();
            }

          }

        };


      const script =
        document.createElement('script');


      script.id =
        callbackName;


      script.src =
        API_URL +
        '?action=checkIn' +
        '&token=' +
        encodeURIComponent(token) +
        '&callback=' +
        encodeURIComponent(callbackName);


      script.onerror =
        function() {

          delete window[callbackName];

          script.remove();


          showServerError({

            message:
              'Tidak dapat menghubungi server check-in.'

          });

        };


      document.body.appendChild(script);

    }


    // =====================================================
    // MANUAL TOKEN
    // =====================================================

    function manualCheckIn() {

      if (processing) {
        return;
      }


      const input =
        document.getElementById(
          "manualToken"
        );


      const token =
        input.value.trim();


      if (!token) {

        showTemporaryError(
          "QR TOKEN KOSONG"
        );

        return;

      }


      processing = true;


      if (scanner) {

        scanner.clear()
          .catch(function() {});

      }


      processToken(token);

    }


    // =====================================================
    // HASIL DARI SERVER
    // =====================================================

    function showResult(result) {

      const box =
        document.getElementById(
          "result"
        );


      const title =
        document.getElementById(
          "resultTitle"
        );


      const details =
        document.getElementById(
          "resultDetails"
        );


      box.className = "result";


      // ===================================================
      // VALID
      // ===================================================

      if (
        result &&
        result.status === "VALID"
      ) {

        box.classList.add("valid");


        title.textContent =
          "✓ ENTRY APPROVED";


        details.innerHTML =

          "<div class='detail'>" +

          "<strong>NAMA</strong><br>" +

          escapeHtml(result.name) +

          "</div>" +


          "<div class='detail'>" +

          "<strong>PASS ID</strong><br>" +

          escapeHtml(result.passId) +

          "</div>" +


          "<div class='detail'>" +

          "<strong>ACCESS</strong><br>" +

          escapeHtml(result.accessType) +

          "</div>" +


          "<div class='detail'>" +

          "<strong>CHECK-IN</strong><br>" +

          escapeHtml(result.checkInTime) +

          "</div>";

      }


      // ===================================================
      // SUDAH DIGUNAKAN
      // ===================================================

      else if (
        result &&
        result.status === "ALREADY_USED"
      ) {

        box.classList.add("used");


        title.textContent =
          "⚠ ALREADY USED";


        details.innerHTML =

          "<div class='detail'>" +

          "QR ini sudah digunakan." +

          "</div>" +


          "<div class='detail'>" +

          "<strong>NAMA</strong><br>" +

          escapeHtml(result.name) +

          "</div>" +


          "<div class='detail'>" +

          "<strong>PASS ID</strong><br>" +

          escapeHtml(result.passId) +

          "</div>" +


          "<div class='detail'>" +

          "<strong>CHECK-IN</strong><br>" +

          escapeHtml(result.checkInTime) +

          "</div>";

      }


      // ===================================================
      // INVALID
      // ===================================================

      else if (
        result &&
        result.status === "INVALID"
      ) {

        box.classList.add("invalid");


        title.textContent =
          "✕ INVALID QR";


        details.innerHTML =

          "<div class='detail'>" +

          escapeHtml(
            result.message ||
            "QR tidak valid."
          ) +

          "</div>";

      }


      // ===================================================
      // ERROR
      // ===================================================

      else {

        box.classList.add("error");


        title.textContent =
          "SYSTEM ERROR";


        details.innerHTML =

          "<div class='detail'>" +

          escapeHtml(

            result &&
            result.message

              ? result.message

              : "Terjadi kesalahan pada server."

          ) +

          "</div>";

      }


      box.style.display = "block";

    }


    // =====================================================
    // LOADING
    // =====================================================

    function showLoading() {

      const box =
        document.getElementById(
          "result"
        );


      const title =
        document.getElementById(
          "resultTitle"
        );


      const details =
        document.getElementById(
          "resultDetails"
        );


      box.className =
        "result error";


      box.style.display =
        "block";


      title.textContent =
        "CHECKING...";


      details.innerHTML =

        "<div class='detail'>" +

        "Memverifikasi QR..." +

        "</div>";

    }


    // =====================================================
    // ERROR SERVER
    // =====================================================

    function showServerError(error) {

      const box =
        document.getElementById(
          "result"
        );


      const title =
        document.getElementById(
          "resultTitle"
        );


      const details =
        document.getElementById(
          "resultDetails"
        );


      box.className =
        "result error";


      box.style.display =
        "block";


      title.textContent =
        "SYSTEM ERROR";


      details.innerHTML =

        "<div class='detail'>" +

        escapeHtml(

          error &&
          error.message

            ? error.message

            : "Tidak dapat menghubungi server."

        ) +

        "</div>";

    }


    // =====================================================
    // ERROR SEMENTARA
    // =====================================================

    function showTemporaryError(message) {

      const box =
        document.getElementById(
          "result"
        );


      const title =
        document.getElementById(
          "resultTitle"
        );


      const details =
        document.getElementById(
          "resultDetails"
        );


      box.className =
        "result invalid";


      box.style.display =
        "block";


      title.textContent =
        "✕ INVALID";


      details.innerHTML =

        "<div class='detail'>" +

        escapeHtml(message) +

        "</div>";

    }


    // =====================================================
    // RESET
    // =====================================================

    function resetScanner() {

      processing = false;


      document.getElementById(
        "result"
      ).style.display = "none";


      document.getElementById(
        "manualToken"
      ).value = "";


      startScanner();

    }


    // =====================================================
    // HTML ESCAPE
    // =====================================================

    function escapeHtml(value) {

      return String(value || "")

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =====================================================
    // START
    // =====================================================

    window.onload =
      function() {

        startScanner();

      };

  </script>


</body>

</html>
