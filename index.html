<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOLD AFTER DARK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --red: #e00000;
      --bg: #050505;
      --card: #111111;
      --border: #292929;
      --text: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;

        radial-gradient(
          circle at top,
          #250000 0%,
          #0a0a0a 38%,
          #000000 100%
        );
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;

      font-size: 30px;

      color: #ffffff;

      color: var(--red);

      color: #ffffff;

      color: #777;

      border-radius: 18px;

      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      min-height: 54px;

      border-radius: 10px;
      font-size: 13px;

      cursor: pointer;
      transition:
        transform 0.15s ease,
        background 0.15s ease,

    }

      transform: scale(0.98);
    }

    .btn-registration {
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
    }

    .btn-registration:hover {

      background: #f00000;

    }

      background: #ffffff;

</head>

<body>

  <div class="container">

    <div class="brand">
      <span class="bold">BOLD</span>
      <span class="after"> AFTER </span>
      <span class="dark">DARK</span>
    </div>

    <div class="subtitle">
      OFFICIAL EVENT ACCESS
    </div>

    <div class="card">

      <div class="button-list">

        <button
          id="copyLinkButton"
          class="btn-registration"
          type="button"
        >
          COPY LINK FORM REGISTRATION
        </button>

        <button
          id="scannerButton"
          class="btn-scanner"
          type="button"
        >
          QR SCANNER
        </button>

        <button
          id="adminButton"
          class="btn-admin"
          type="button"
        >
          ADMIN
        </button>

      </div>

      <div
        id="copyStatus"
        class="copy-status"
      ></div>

    </div>

    <div class="footer">
      BOLD AFTER DARK
    </div>

  </div>

  <script>
    "use strict";

    /*
     * Semua link menggunakan domain aktif.
     *
     * HOME:
     * /
     *
     * REGISTRATION:
     * /registration/
     *
     * SCANNER:
     * /scanner.html
     *
     * ADMIN:
     * /admin.html
     */

    const REGISTRATION_URL =
      "https://boldafterdark.my.id/registration/";

    const SCANNER_URL =
      "https://boldafterdark.my.id/scanner.html";

    const ADMIN_URL =
      "https://boldafterdark.my.id/admin.html";


    const copyLinkButton =
      document.getElementById("copyLinkButton");

    const scannerButton =
      document.getElementById("scannerButton");

    const adminButton =
      document.getElementById("adminButton");

    const copyStatus =
      document.getElementById("copyStatus");


    async function copyRegistrationLink() {

      copyStatus.textContent = "";

      try {

        if (
          navigator.clipboard &&
          window.isSecureContext
        ) {

          await navigator.clipboard.writeText(
            REGISTRATION_URL
          );

        } else {

          const textarea =
            document.createElement("textarea");

          textarea.value =
            REGISTRATION_URL;

          textarea.style.position =
            "fixed";

          textarea.style.left =
            "-9999px";

          document.body.appendChild(
            textarea
          );

          textarea.focus();
          textarea.select();

          const success =
            document.execCommand("copy");

          document.body.removeChild(
            textarea
          );

          if (!success) {
            throw new Error(
              "Copy gagal."
            );
          }
        }

        copyStatus.textContent =
          "Link Form Registration berhasil disalin.";

        setTimeout(
          function() {
            copyStatus.textContent = "";
          },
          2500
        );

      } catch (error) {

        console.error(
          "COPY LINK ERROR:",
          error
        );

        copyStatus.textContent =
          "Tidak dapat menyalin link.";
      }
    }


    function openScanner() {

      window.location.href =
        SCANNER_URL;

    }


    function openAdmin() {

      window.location.href =
        ADMIN_URL;

    }


    copyLinkButton.addEventListener(
      "click",
      copyRegistrationLink
    );


    scannerButton.addEventListener(
      "click",
      openScanner
    );


    adminButton.addEventListener(
      "click",
      openAdmin
    );

  </script>

</body>
</html>
