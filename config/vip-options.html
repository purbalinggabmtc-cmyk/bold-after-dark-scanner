<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VIP OPTIONS — BOLD AFTER DARK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    .vip-options {
      width: 100%;
      margin-top: 16px;
      padding: 18px;

      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
    }

    .vip-title {
      margin-bottom: 6px;

      color: white;

      font-size: 16px;
      font-weight: 900;

      letter-spacing: 1px;
    }

    .vip-title span {
      color: #e00000;
    }

    .vip-description {
      margin-bottom: 16px;

      color: #999;

      font-size: 12px;
      line-height: 1.5;
    }

    .vip-option {
      display: block;

      margin-bottom: 10px;
      padding: 14px;

      background: #181818;

      border: 1px solid #444;
      border-radius: 8px;

      cursor: pointer;

      transition:
        border-color 0.15s ease,
        background 0.15s ease;
    }

    .vip-option:last-child {
      margin-bottom: 0;
    }

    .vip-option:hover {
      background: #202020;
      border-color: #e00000;
    }

    .vip-option input {
      margin-right: 8px;
    }

    .vip-option-label {
      color: white;

      font-size: 14px;
      font-weight: 700;
    }

    .vip-option-detail {
      display: block;

      margin-top: 5px;
      margin-left: 24px;

      color: #888;

      font-size: 11px;
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      .vip-options {
        padding: 14px;
      }

      .vip-title {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="vip-options">

    <div class="vip-title">
      VIP <span>OPTIONS</span>
    </div>

    <div class="vip-description">
      Pilih opsi VIP yang tersedia untuk reservasi Anda.
    </div>

    <label class="vip-option">
      <input
        type="radio"
        name="vipOption"
        value="VIP TABLE"
      >

      <span class="vip-option-label">
        VIP TABLE
      </span>

      <span class="vip-option-detail">
        Akses VIP dengan pilihan meja VIP.
      </span>
    </label>

    <label class="vip-option">
      <input
        type="radio"
        name="vipOption"
        value="VIP STANDING"
      >

      <span class="vip-option-label">
        VIP STANDING
      </span>

      <span class="vip-option-detail">
        Akses area VIP tanpa reservasi meja.
      </span>
    </label>

    <label class="vip-option">
      <input
        type="radio"
        name="vipOption"
        value="VIP PACKAGE"
      >

      <span class="vip-option-label">
        VIP PACKAGE
      </span>

      <span class="vip-option-detail">
        Pilihan paket VIP khusus.
      </span>
    </label>

  </div>

</body>
</html>
