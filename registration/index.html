<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOLD AFTER DARK — Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .registration-label {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #ff0000;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .title {
      text-align: center;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.1;
      margin-bottom: 35px;
    }

    .title .after {
      color: #ff0000;
    }

    .title .bold,
    .title .dark {
      color: #fff;
    }

    form {
      width: 100%;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #fff;
    }

    .required {
      color: #ff0000;
      margin-left: 3px;
    }

    input,
    select {
      width: 100%;
      height: 48px;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 0 14px;
      background: #111;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #ff0000;
    }

    select {
      cursor: pointer;
    }

    select option {
      background: #111;
      color: #fff;
    }

    .optional {
      color: #999;
      font-weight: 400;
      font-size: 12px;
      margin-left: 4px;
    }

    .hidden {
      display: none !important;
    }

    .submit-button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 6px;
      background: #ff0000;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s ease;
    }

    .submit-button:hover {
      opacity: 0.88;
    }

    .submit-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .message.error {
      display: block;
      background: #260000;
      border: 1px solid #ff0000;
      color: #fff;
    }

    .message.success {
      display: block;
      background: #071f0b;
      border: 1px solid #22c55e;
      color: #fff;
    }

    .pass-result {
      margin-top: 20px;
      display: none;
      text-align: center;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 22px 16px;
      background: #0b0b0b;
    }

    .pass-result h2 {
      margin: 0 0 15px;
      color: #ff0000;
      font-size: 22px;
    }

    .pass-info {
      text-align: left;
      margin-top: 15px;
    }

    .pass-info div {
      padding: 8px 0;
      border-bottom: 1px solid #222;
      font-size: 14px;
    }

    .pass-info strong {
      display: inline-block;
      min-width: 115px;
      color: #aaa;
    }

    .qr-wrapper {
      margin-top: 20px;
    }

    .qr-wrapper img {
      width: 250px;
      max-width: 100%;
      height: auto;
      background: #fff;
      padding: 8px;
      border-radius: 6px;
    }

    .note {
      margin-top: 25px;
      color: #777;
      font-size: 11px;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body {
        padding: 28px 14px;
      }

      .registration-label {
        font-size: 19px;
      }

      .title {
        font-size: 31px;
        margin-bottom: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- =====================================================
         REGISTRATION TITLE
         ===================================================== -->

    <div class="registration-label">
      REGISTRATION
    </div>

    <div class="title">
      <span class="bold">BOLD</span>
      <span class="after">AFTER</span>
      <span class="dark">DARK</span>
    </div>


    <!-- =====================================================
         REGISTRATION FORM
         ===================================================== -->

    <form id="registrationForm">

      <!-- ACCESS -->
      <div class="field">

        <label for="accessType">
          CHOOSE YOUR ACCESS
          <span class="required">*</span>
        </label>

        <select
          id="accessType"
          name="accessType"
          required
        >

          <option value="">
            Select Access
          </option>

          <option value="FREE">
            FREE
          </option>

          <option value="VIP">
            VIP
          </option>

        </select>

      </div>


      <!-- VIP TABLE PACKAGE -->
      <div
        class="field hidden"
        id="tablePackageField"
      >

        <label for="tablePackage">
          TABLE PACKAGE
          <span class="required">*</span>
        </label>

        <select
          id="tablePackage"
          name="tablePackage"
        >

          <option value="">
            Select Table Package
          </option>

          <option value="VIP TABLE - 1 PAX">
            VIP TABLE - 1 PAX
          </option>

          <option value="VIP TABLE — 2 PAX">
            VIP TABLE — 2 PAX
          </option>

          <option value="VIP TABLE — 3 PAX">
            VIP TABLE — 3 PAX
          </option>

          <option value="VIP TABLE — 4 PAX">
            VIP TABLE — 4 PAX
          </option>

          <option value="VIP TABLE — 5 PAX">
            VIP TABLE — 5 PAX
          </option>

          <option value="VIP TABLE — 6 PAX">
            VIP TABLE — 6 PAX
          </option>

          <option value="VIP TABLE — 7 PAX">
            VIP TABLE — 7 PAX
          </option>

          <option value="VIP TABLE — 8 PAX">
            VIP TABLE — 8 PAX
          </option>

        </select>

      </div>


      <!-- NAME -->
      <div class="field">

        <label for="name">
          YOUR NAME
          <span class="required">*</span>
        </label>

        <input
          type="text"
          id="name"
          name="name"
          maxlength="100"
          autocomplete="name"
          required
        >

      </div>


      <!-- WHATSAPP -->
      <div class="field">

        <label for="whatsapp">
          WHATSAPP
          <span class="required">*</span>
        </label>

        <input
          type="tel"
          id="whatsapp"
          name="whatsapp"
          maxlength="20"
          autocomplete="tel"
          placeholder="08xxxxxxxxxx"
          required
        >

      </div>


      <!-- STAY CONNECTED -->
      <div class="field">

        <label for="stayConnected">
          STAY CONNECTED
          <span class="optional">
            Optional
          </span>
        </label>

        <input
          type="text"
          id="stayConnected"
          name="stayConnected"
          maxlength="150"
          placeholder="Instagram / Social Media"
        >

      </div>


      <!-- COMMUNITY -->
      <div class="field">

        <label for="community">
          YOUR COMMUNITY
          <span class="optional">
            Optional
          </span>
        </label>

        <input
          type="text"
          id="community"
          name="community"
          maxlength="150"
          placeholder="Community"
        >

      </div>


      <!-- SUBMIT -->
      <button
        type="submit"
        id="submitButton"
        class="submit-button"
      >
        REGISTER
      </button>

    </form>


    <!-- =====================================================
         MESSAGE
         ===================================================== -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- =====================================================
         PASS RESULT
         ===================================================== -->

    <div
      id="passResult"
      class="pass-result"
    >

      <h2>
        REGISTRATION SUCCESSFUL
      </h2>

      <div class="pass-info">

        <div>
          <strong>NAME</strong>
          <span id="resultName"></span>
        </div>

        <div>
          <strong>WHATSAPP</strong>
          <span id="resultWhatsapp"></span>
        </div>

        <div>
          <strong>ACCESS</strong>
          <span id="resultAccess"></span>
        </div>

        <div id="resultTableRow">
          <strong>TABLE</strong>
          <span id="resultTable"></span>
        </div>

        <div>
          <strong>PASS ID</strong>
          <span id="resultPassId"></span>
        </div>

        <div>
          <strong>STATUS</strong>
          <span id="resultStatus"></span>
        </div>

      </div>

      <div class="qr-wrapper">

        <img
          id="resultQr"
          src=""
          alt="QR Code"
        >

      </div>

      <div class="note">
        Please keep your digital pass and QR code.
      </div>

    </div>

  </div>


  <script>

    /* =======================================================
       API CONFIGURATION
       =======================================================

       PENTING:

       URL INI TIDAK MENGGUNAKAN /u/4/

       BENAR:
       /macros/s/DEPLOYMENT_ID/exec

       SALAH:
       /macros/u/4/s/DEPLOYMENT_ID/exec

       ======================================================= */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbwDlByPLDkvNi000w-2A2_XkA8lfQ9BnhU1cVKV6VxuTY2z5YWU_ZqedEEGLn8bouzBNg/exec';


    /* =======================================================
       ELEMENTS
       ======================================================= */

    const registrationForm =
      document.getElementById(
        'registrationForm'
      );

    const accessType =
      document.getElementById(
        'accessType'
      );

    const tablePackageField =
      document.getElementById(
        'tablePackageField'
      );

    const tablePackage =
      document.getElementById(
        'tablePackage'
      );

    const submitButton =
      document.getElementById(
        'submitButton'
      );

    const message =
      document.getElementById(
        'message'
      );

    const passResult =
      document.getElementById(
        'passResult'
      );


    /* =======================================================
       ACCESS TYPE CHANGE
       ======================================================= */

    accessType.addEventListener(
      'change',
      function () {

        if (
          accessType.value === 'VIP'
        ) {

          tablePackageField
            .classList
            .remove('hidden');

          tablePackage.required = true;

        }
        else {

          tablePackageField
            .classList
            .add('hidden');

          tablePackage.required = false;

          tablePackage.value = '';

        }

      }
    );


    /* =======================================================
       MESSAGE HELPERS
       ======================================================= */

    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        'message ' + type;

    }


    function clearMessage() {

      message.textContent = '';

      message.className =
        'message';

    }


    /* =======================================================
       DISPLAY PASS
       ======================================================= */

    function displayPass(
      result
    ) {

      document.getElementById(
        'resultName'
      ).textContent =
        result.name || '';


      document.getElementById(
        'resultWhatsapp'
      ).textContent =
        result.whatsapp || '';


      document.getElementById(
        'resultAccess'
      ).textContent =
        result.accessType || '';


      document.getElementById(
        'resultTable'
      ).textContent =
        result.tablePackage || '';


      document.getElementById(
        'resultPassId'
      ).textContent =
        result.passId || '';


      document.getElementById(
        'resultStatus'
      ).textContent =
        result.passStatus || '';


      const resultTableRow =
        document.getElementById(
          'resultTableRow'
        );


      if (
        result.accessType === 'VIP'
      ) {

        resultTableRow.style.display =
          'block';

      }
      else {

        resultTableRow.style.display =
          'none';

      }


      const qr =
        document.getElementById(
          'resultQr'
        );


      if (
        result.qrCodeUrl
      ) {

        qr.src =
          result.qrCodeUrl;

      }


      passResult.style.display =
        'block';


      passResult.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });

    }


    /* =======================================================
       SUBMIT REGISTRATION
       ======================================================= */

    registrationForm.addEventListener(
      'submit',
      async function (event) {

        event.preventDefault();

        clearMessage();

        passResult.style.display =
          'none';


        /* ---------------------------------------------------
           BASIC VALIDATION
           --------------------------------------------------- */

        if (
          !accessType.value
        ) {

          showMessage(
            'Please choose your access.',
            'error'
          );

          return;

        }


        if (
          !document
            .getElementById('name')
            .value
            .trim()
        ) {

          showMessage(
            'Please enter your name.',
            'error'
          );

          return;

        }


        if (
          !document
            .getElementById('whatsapp')
            .value
            .trim()
        ) {

          showMessage(
            'Please enter your WhatsApp number.',
            'error'
          );

          return;

        }


        if (
          accessType.value === 'VIP' &&
          !tablePackage.value
        ) {

          showMessage(
            'Please choose your VIP table package.',
            'error'
          );

          return;

        }


        /* ---------------------------------------------------
           BUTTON STATE
           --------------------------------------------------- */

        submitButton.disabled =
          true;

        submitButton.textContent =
          'REGISTERING...';


        /* ---------------------------------------------------
           FORM DATA
           --------------------------------------------------- */

        const formData =
          new URLSearchParams();


        formData.append(
          'action',
          'register'
        );


        formData.append(
          'accessType',
          accessType.value
        );


        formData.append(
          'name',
          document
            .getElementById('name')
            .value
            .trim()
        );


        formData.append(
          'whatsapp',
          document
            .getElementById('whatsapp')
            .value
            .trim()
        );


        formData.append(
          'stayConnected',
          document
            .getElementById('stayConnected')
            .value
            .trim()
        );


        formData.append(
          'community',
          document
            .getElementById('community')
            .value
            .trim()
        );


        formData.append(
          'tablePackage',
          accessType.value === 'VIP'
            ? tablePackage.value
            : ''
        );


        /* ---------------------------------------------------
           SEND TO GOOGLE APPS SCRIPT
           --------------------------------------------------- */

        try {

          const response =
            await fetch(
              API_URL,
              {
                method: 'POST',

                headers: {
                  'Content-Type':
                    'application/x-www-form-urlencoded;charset=UTF-8'
                },

                body:
                  formData.toString(),

                redirect: 'follow'
              }
            );


          /* -------------------------------------------------
             HTTP CHECK
             ------------------------------------------------- */

          if (
            !response.ok
          ) {

            throw new Error(
              'Registration server returned HTTP ' +
              response.status +
              '.'
            );

          }


          /* -------------------------------------------------
             READ RESPONSE
             ------------------------------------------------- */

          const text =
            await response.text();


          if (
            !text
          ) {

            throw new Error(
              'Registration server returned an empty response.'
            );

          }


          let result;


          try {

            result =
              JSON.parse(text);

          }
          catch (
            jsonError
          ) {

            console.error(
              'Invalid server response:',
              text
            );

            throw new Error(
              'Registration server returned an invalid response.'
            );

          }


          /* -------------------------------------------------
             SERVER VALIDATION
             ------------------------------------------------- */

          if (
            !result.success
          ) {

            throw new Error(
              result.message ||
              'Registration failed.'
            );

          }


          /* -------------------------------------------------
             SUCCESS
             ------------------------------------------------- */

          showMessage(
            result.message ||
            'Registration berhasil.',
            'success'
          );


          displayPass(
            result
          );


          /* -------------------------------------------------
             RESET FORM
             ------------------------------------------------- */

          registrationForm.reset();

          tablePackageField
            .classList
            .add('hidden');

          tablePackage.required =
            false;

        }

        catch (
          error
        ) {

          console.error(
            'Registration failed:',
            error
          );


          showMessage(
            error &&
            error.message
              ? error.message
              : 'Registration failed. Please try again.',
            'error'
          );

        }

        finally {

          submitButton.disabled =
            false;

          submitButton.textContent =
            'REGISTER';

        }

      }
    );

  </script>

</body>
</html>
