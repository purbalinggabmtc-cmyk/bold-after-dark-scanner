</head>

<body>

  <div class="registration-container">

    <div class="registration-label">
      REGISTRATION
    </div>

    <div class="title">
      <span class="title-bold">BOLD</span>
      <span class="title-after">AFTER</span>
      <span class="title-dark">DARK</span>
    </div>

    <form
      id="registrationForm"
      novalidate
    >

      <!-- ACCESS -->

      <div class="form-group">

        <label for="accessType">
          ACCESS <span class="required">*</span>
        </label>

        <select
          id="accessType"
          required
        >
          <option value="">
            Choose Access
          </option>

          <option value="FREE">
            FREE
          </option>

          <option value="VIP">
            VIP
          </option>

          <option value="BOLD_RIDERS">
            BOLD RIDERS
          </option>
        </select>

      </div>


      <!-- VIP TABLE -->

      <div
        id="tablePackageGroup"
        class="form-group hidden"
      >

        <label for="tablePackage">
          VIP TABLE PACKAGE
          <span class="required">*</span>
        </label>

        <select
          id="tablePackage"
        >
          <option value="">
            Choose Table Package
          </option>

          <option value="VIP TABLE - 3 PAX">
            VIP TABLE - 3 PAX
          </option>

          <option value="VIP TABLE - 5 PAX">
            VIP TABLE - 5 PAX
          </option>

          <option value="VIP TABLE - 8 PAX">
            VIP TABLE - 8 PAX
          </option>
        </select>

      </div>


      <!-- BOLD RIDERS -->

      <div
        id="boldRidersGroup"
        class="form-group hidden"
      >

        <label for="boldRidersId">
          BOLD RIDERS ID
          <span class="required">*</span>
        </label>

        <input
          id="boldRidersId"
          type="text"
          inputmode="text"
          autocomplete="off"
          maxlength="8"
          minlength="8"
          spellcheck="false"
          autocapitalize="characters"
        >

        <div
          id="boldRiderStatus"
          class="bold-rider-status"
        ></div>

        <div class="help-box">
          Jika Anda tidak mengetahui ID BOLD Riders Anda, silakan hubungi bantuan.
          <br>

          <a
            class="help-link"
            href="https://wa.me/6282324854187"
            target="_blank"
            rel="noopener noreferrer"
          >
            BANTUAN WHATSAPP
          </a>
        </div>

      </div>


      <!-- NAME -->

      <div class="form-group">

        <label for="name">
          NAME <span class="required">*</span>
        </label>

        <input
          id="name"
          type="text"
          autocomplete="name"
          required
        >

      </div>


      <!-- WHATSAPP -->

      <div class="form-group">

        <label for="whatsapp">
          WHATSAPP <span class="required">*</span>
        </label>

        <input
          id="whatsapp"
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          required
        >

      </div>


      <!-- STAY CONNECTED -->

      <div class="form-group">

        <label for="stayConnected">
          STAY CONNECTED
          <span class="optional">
            optional
          </span>
        </label>

        <input
          id="stayConnected"
          type="text"
          autocomplete="off"
        >

      </div>


      <!-- COMMUNITY -->

      <div class="form-group">

        <label for="community">
          COMMUNITY
          <span class="optional">
            optional
          </span>
        </label>

        <input
          id="community"
          type="text"
          autocomplete="off"
        >

      </div>


      <button
        id="submitButton"
        class="submit-button"
        type="submit"
      >
        REGISTER
      </button>

    </form>


    <div
      id="message"
      class="message"
    ></div>


    <!-- PASS RESULT -->

    <div
      id="passResult"
      class="pass-result"
    >

      <div class="pass-result-title">
        REGISTRATION BERHASIL
      </div>

      <div
        id="passId"
        class="pass-id"
      ></div>

      <div
        id="passInfo"
        class="pass-info"
      ></div>

      <img
        id="qrImage"
        class="qr-image"
        alt="QR Code"
      >

    </div>


    <div class="footer">
      BOLD AFTER DARK • THE NIGHT STARTS HERE
    </div>

  </div>


  <script>

    // =====================================================
    // CONFIGURATION
    // =====================================================

    const API_URL =
      "https://yrvnmmascklkuzpjkwxn.supabase.co/functions/v1/dynamic-service";


    // =====================================================
    // ELEMENTS
    // =====================================================

    const form =
      document.getElementById(
        "registrationForm"
      );

    const accessType =
      document.getElementById(
        "accessType"
      );

    const tablePackageGroup =
      document.getElementById(
        "tablePackageGroup"
      );

    const tablePackage =
      document.getElementById(
        "tablePackage"
      );

    const boldRidersGroup =
      document.getElementById(
        "boldRidersGroup"
      );

    const boldRidersId =
      document.getElementById(
        "boldRidersId"
      );

    const boldRiderStatus =
      document.getElementById(
        "boldRiderStatus"
      );

    const submitButton =
      document.getElementById(
        "submitButton"
      );

    const message =
      document.getElementById(
        "message"
      );

    const passResult =
      document.getElementById(
        "passResult"
      );

    const passId =
      document.getElementById(
        "passId"
      );

    const passInfo =
      document.getElementById(
        "passInfo"
      );

    const qrImage =
      document.getElementById(
        "qrImage"
      );


    // =====================================================
    // STATE
    // =====================================================

    let boldRiderValid = false;

    let validationRequestId = 0;


    // =====================================================
    // MESSAGE
    // =====================================================

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text || "";

      message.className =
        "message " +
        (type || "");

    }


    function clearMessage() {

      message.textContent =
        "";

      message.className =
        "message";

    }


    // =====================================================
    // BOLD RIDER STATUS
    // =====================================================

    function setBoldRiderStatus(
      text,
      type
    ) {

      boldRiderStatus.textContent =
        text || "";

      boldRiderStatus.className =
        "bold-rider-status " +
        (type || "");

    }


    // =====================================================
    // ACCESS CHANGE
    // =====================================================

    accessType.addEventListener(
      "change",
      function () {

        const value =
          this.value.trim();


        // -------------------------------------------------
        // VIP
        // -------------------------------------------------

        if (
          value === "VIP"
        ) {

          tablePackageGroup
            .classList
            .remove("hidden");

          tablePackage.required =
            true;

        } else {

          tablePackageGroup
            .classList
            .add("hidden");

          tablePackage.required =
            false;

          tablePackage.value =
            "";

        }


        // -------------------------------------------------
        // BOLD RIDERS
        // -------------------------------------------------

        if (
          value ===
          "BOLD_RIDERS"
        ) {

          boldRidersGroup
            .classList
            .remove("hidden");

          boldRidersId.required =
            true;

          boldRiderValid =
            false;

          setBoldRiderStatus(
            "",
            ""
          );

          boldRidersId.focus();

        } else {

          boldRidersGroup
            .classList
            .add("hidden");

          boldRidersId.required =
            false;

          boldRidersId.value =
            "";

          boldRiderValid =
            false;

          setBoldRiderStatus(
            "",
            ""
          );

        }

      }
    );


    // =====================================================
    // JSONP HELPER
    // =====================================================

    function requestJsonp(
      action,
      params,
      timeoutMs
    ) {

      return new Promise(
        function (
          resolve,
          reject
        ) {

          const callbackName =
            "BAD_" +
            action +
            "_" +
            Date.now() +
            "_" +
            Math.floor(
              Math.random() *
              1000000
            );


          const script =
            document.createElement(
              "script"
            );


          let finished =
            false;


          const timeout =
            setTimeout(
              function () {

                if (
                  finished
                ) {
                  return;
                }

                finished =
                  true;

                cleanup();

                reject(
                  new Error(
                    "Server tidak merespons."
                  )
                );

              },
              timeoutMs ||
              15000
            );


          function cleanup() {

            clearTimeout(
              timeout
            );

            if (
              script.parentNode
            ) {

              script.parentNode
                .removeChild(
                  script
                );

            }

            try {

              delete window[
                callbackName
              ];

            } catch {

              window[
                callbackName
              ] = undefined;

            }

          }


          window[
            callbackName
          ] =
            function (
              response
            ) {

              if (
                finished
              ) {
                return;
              }

              finished =
                true;

              cleanup();

              resolve(
                response
              );

            };


          const query =
            new URLSearchParams();


          query.set(
            "action",
            action
          );


          query.set(
            "callback",
            callbackName
          );


          if (
            params
          ) {

            Object.keys(
              params
            ).forEach(
              function (
                key
              ) {

                const value =
                  params[key];

                if (
                  value !==
                  undefined &&
                  value !==
                  null
                ) {

                  query.set(
                    key,
                    String(
                      value
                    )
                  );

                }

              }
            );

          }


          script.src =
            API_URL +
            "?" +
            query.toString();

          script.async =
            true;


          script.onerror =
            function () {

              if (
                finished
              ) {
                return;
              }

              finished =
                true;

              cleanup();

              reject(
                new Error(
                  "Tidak dapat terhubung ke server."
                )
              );

            };


          document.body.appendChild(
            script
          );

        }
      );

    }


    // =====================================================
    // VALIDATE BOLD RIDER
    // =====================================================

    async function validateBoldRider(
      value
    ) {

      const currentRequest =
        ++validationRequestId;


      boldRiderValid =
        false;


      if (
        value.length !==
        8
      ) {

        setBoldRiderStatus(
          "",
          ""
        );

        return;

      }


      setBoldRiderStatus(
        "Memeriksa ID...",
        "checking"
      );


      try {

        const response =
          await requestJsonp(
            "validateBoldRider",
            {
              boldRidersId:
                value
            },
            10000
          );


        if (
          currentRequest !==
          validationRequestId
        ) {
          return;
        }


        if (
          response &&
          response.success === true &&
          response.status ===
            "VALID"
        ) {

          boldRiderValid =
            true;


          setBoldRiderStatus(
            "ID valid — " +
            (
              response.name ||
              "BOLD Riders"
            ),
            "valid"
          );


          return;

        }


        boldRiderValid =
          false;


        setBoldRiderStatus(
          response &&
          response.message
            ? response.message
            : "ID BOLD Riders tidak terdaftar.",
          "invalid"
        );


      } catch (
        error
      ) {

        console.error(
          "BOLD RIDERS VALIDATION ERROR:",
          error
        );


        boldRiderValid =
          false;


        setBoldRiderStatus(
          "Data BOLD Riders tidak dapat diperiksa.",
          "invalid"
        );

      }

    }


    // =====================================================
    // BOLD RIDER INPUT
    // =====================================================

    boldRidersId.addEventListener(
      "input",
      function () {

        const normalized =
          this.value
            .toUpperCase()
            .replace(
              /[^A-Z0-9]/g,
              ""
            )
            .slice(
              0,
              8
            );


        if (
          this.value !==
          normalized
        ) {

          this.value =
            normalized;

        }


        boldRiderValid =
          false;


        setBoldRiderStatus(
          "",
          ""
        );


        if (
          normalized.length ===
          8
        ) {

          validateBoldRider(
            normalized
          );

        }

      }
    );


    // =====================================================
    // FORM SUBMIT
    // =====================================================

    form.addEventListener(
      "submit",
      async function (
        event
      ) {

        event.preventDefault();

        clearMessage();

        passResult.style.display =
          "none";


        const access =
          accessType.value.trim();

        const selectedTable =
          tablePackage.value.trim();

        const name =
          document
            .getElementById(
              "name"
            )
            .value
            .trim();

        const whatsapp =
          document
            .getElementById(
              "whatsapp"
            )
            .value
            .trim();

        const stayConnected =
          document
            .getElementById(
              "stayConnected"
            )
            .value
            .trim();

        const community =
          document
            .getElementById(
              "community"
            )
            .value
            .trim();

        const riderId =
          boldRidersId.value.trim();


        // -------------------------------------------------
        // BASIC VALIDATION
        // -------------------------------------------------

        if (!access) {

          showMessage(
            "Please choose your access.",
            "error"
          );

          return;

        }


        if (!name) {

          showMessage(
            "Please enter your name.",
            "error"
          );

          return;

        }


        if (!whatsapp) {

          showMessage(
            "Please enter your WhatsApp number.",
            "error"
          );

          return;

        }


        if (
          access === "VIP" &&
          !selectedTable
        ) {

          showMessage(
            "Please select your VIP Table Package.",
            "error"
          );

          return;

        }


        // -------------------------------------------------
        // BOLD RIDER VALIDATION
        // -------------------------------------------------

        if (
          access ===
          "BOLD_RIDERS"
        ) {

          if (
            riderId.length !==
            8
          ) {

            showMessage(
              "ID BOLD Riders harus 8 karakter.",
              "error"
            );

            boldRidersId.focus();

            return;

          }


          if (
            !boldRiderValid
          ) {

            showMessage(
              "ID BOLD Riders belum tervalidasi.",
              "error"
            );

            boldRidersId.focus();

            return;

          }

        }


        // -------------------------------------------------
        // DISABLE
        // -------------------------------------------------

        submitButton.disabled =
          true;

        submitButton.textContent =
          "PROCESSING...";


        try {

          const response =
            await requestJsonp(
              "register",
              {
                accessType:
                  access,

                tablePackage:
                  selectedTable,

                name:
                  name,

                whatsapp:
                  whatsapp,

                stayConnected:
                  stayConnected,

                community:
                  community,

                boldRidersId:
                  access ===
                  "BOLD_RIDERS"
                    ? riderId
                    : ""
              },
              15000
            );


          if (
            !response ||
            response.success !==
              true
          ) {

            throw new Error(
              response &&
              response.message
                ? response.message
                : "Registration failed."
            );

          }


          // ------------------------------------------------
          // SUCCESS
          // ------------------------------------------------

          showMessage(
            "Registration berhasil.",
            "success"
          );


          passId.textContent =
            response.passId ||
            "";


          let infoText =
            "Access: " +
            (
              response.accessType ||
              ""
            );


          if (
            response.tablePackage
          ) {

            infoText +=
              "<br>Table: " +
              response.tablePackage;

          }


          if (
            response.boldRidersId
          ) {

            infoText +=
              "<br>BOLD Riders ID: " +
              response.boldRidersId;

          }


          if (
            response.boldRidersName
          ) {

            infoText +=
              "<br>BOLD Riders: " +
              response.boldRidersName;

          }


          infoText +=
            "<br>Name: " +
            (
              response.name ||
              ""
            );


          infoText +=
            "<br>WhatsApp: " +
            (
              response.whatsapp ||
              ""
            );


          passInfo.innerHTML =
            infoText;


          if (
            response.qrCodeUrl
          ) {

            qrImage.src =
              response.qrCodeUrl;

            qrImage.style.display =
              "inline-block";

          } else {

            qrImage.style.display =
              "none";

          }


          passResult.style.display =
            "block";


          // ------------------------------------------------
          // RESET
          // ------------------------------------------------

          form.reset();


          tablePackageGroup
            .classList
            .add("hidden");

          tablePackage.required =
            false;


          boldRidersGroup
            .classList
            .add("hidden");

          boldRidersId.required =
            false;

          boldRiderValid =
            false;

          setBoldRiderStatus(
            "",
            ""
          );

        } catch (
          error
        ) {

          console.error(
            "Registration failed:",
            error
          );


          showMessage(
            error &&
            error.message
              ? error.message
              : "Registration failed.",
            "error"
          );

        } finally {

          submitButton.disabled =
            false;

          submitButton.textContent =
            "REGISTER";

        }

      }
    );

  </script>

</body>
