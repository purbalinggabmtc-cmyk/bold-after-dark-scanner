<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta

  <title>BOLD AFTER DARK — Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #242424 0%,
          #111111 45%,
          #050505 100%
        );

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .registration-container {
      width: 100%;
      max-width: 520px;

      background: #111111;

      border: 1px solid #2c2c2c;

      border-radius: 18px;

      padding: 30px 25px 35px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55);
    }

    .registration-label {
      text-align: center;

      font-size: 18px;

      font-weight: 700;

      color: #ff1e1e;

      letter-spacing: 2px;

      margin-bottom: 8px;

      text-transform: uppercase;
    }

    .title {
      text-align: center;

      font-size: 34px;

      line-height: 1.1;

      font-weight: 900;

      letter-spacing: 1px;

      margin-bottom: 28px;
    }

    .title-bold {
      color: #ffffff;
    }

    .title-after {
      color: #ff1e1e;
    }

    .title-dark {
      color: #ffffff;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 700;

      color: #eeeeee;
    }

    .required {
      color: #ff1e1e;
    }

    .optional {
      color: #888888;

      font-size: 12px;

      font-weight: 400;

      margin-left: 5px;
    }

    input,
    select {
      width: 100%;

      padding: 13px 14px;

      border-radius: 9px;

      border: 1px solid #383838;

      background: #1b1b1b;

      color: #ffffff;

      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      border-color: #ff1e1e;

      box-shadow:
        0 0 0 2px rgba(255, 30, 30, 0.12);
    }

    select {
      cursor: pointer;
    }

    select option {
      background: #171717;

      color: #ffffff;
    }

    .hidden {
      display: none;
    }

    .submit-button {
      width: 100%;

      margin-top: 10px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background: #ff1e1e;

      color: #ffffff;

      font-size: 16px;

      font-weight: 800;

      letter-spacing: 1px;

      cursor: pointer;

      transition:
        transform 0.15s,
        opacity 0.15s;
    }

    .submit-button:hover {
      transform: translateY(-1px);
    }

    .submit-button:disabled {
      opacity: 0.5;

      cursor: not-allowed;

      transform: none;
    }

    .message {
      margin-top: 18px;

      padding: 14px;

      border-radius: 9px;

      font-size: 14px;

      line-height: 1.5;

      display: none;
    }

    .message.success {
      display: block;

      background: rgba(0, 180, 80, 0.12);

      border: 1px solid rgba(0, 180, 80, 0.35);

      color: #8cffb5;
    }

    .message.error {
      display: block;

      background: rgba(255, 30, 30, 0.10);

      border: 1px solid rgba(255, 30, 30, 0.35);

      color: #ff8f8f;
    }

    .pass-result {
      display: none;

      margin-top: 22px;

      padding: 20px;

      border-radius: 12px;

      background: #191919;

      border: 1px solid #333333;

      text-align: center;
    }

    .pass-result h3 {
      margin-top: 0;

      margin-bottom: 15px;

      color: #ff1e1e;
    }

    .pass-id {
      font-size: 20px;

      font-weight: 800;

      letter-spacing: 1px;

      margin-bottom: 12px;
    }

    .pass-info {
      font-size: 13px;

      color: #bbbbbb;

      line-height: 1.7;
    }

    .qr-image {
      width: 220px;

      max-width: 100%;

      margin-top: 18px;

      border-radius: 8px;

      background: #ffffff;

      padding: 5px;
    }

    .new-registration-button {
      width: 100%;

      margin-top: 18px;

      padding: 12px;

      border-radius: 9px;

      border: 1px solid #444444;

      background: #222222;

      color: #ffffff;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;
    }

    .new-registration-button:hover {
      background: #2b2b2b;
    }

    .loading-text {
      text-align: center;

      margin-top: 12px;

      color: #888888;

      font-size: 12px;

      display: none;
    }

    @media (max-width: 480px) {
      .registration-container {
        padding: 25px 18px 30px;
      }

      .title {
        font-size: 28px;
      }

      .registration-label {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="registration-container">

    <div class="registration-label">
      REGISTRATION
    </div>

    <div class="title">
      <span class="title-bold">BOLD</span>
      <span class="title-after">AFTER</span>
      <span class="title-dark">DARK</span>
    </div>

    <form id="registrationForm">

      <div class="form-group">

        <label for="accessType">
          Choose your access below.
          <span class="required">*</span>
        </label>

        <select
          id="accessType"
          name="accessType"
          required
        >
          <option value="">
            Select Access
          </option>

          <option value="FREE">
            FREE
          </option>

          <option value="VIP">
            VIP
          </option>
        </select>

      </div>

      <div
        class="form-group hidden"
        id="tablePackageGroup"
      >

        <label for="tablePackage">

          Table Package

          <span class="required">
            *
          </span>

        </label>

        <select
          id="tablePackage"
          name="tablePackage"
        >

          <option value="">
            Select Table Package
          </option>

          <option value="VIP TABLE - 1 PAX">
            VIP TABLE - 1 PAX
          </option>

          <option value="VIP TABLE — 2 PAX">
            VIP TABLE — 2 PAX
          </option>

          <option value="VIP TABLE — 3 PAX">
            VIP TABLE — 3 PAX
          </option>

          <option value="VIP TABLE — 4 PAX">
            VIP TABLE — 4 PAX
          </option>

          <option value="VIP TABLE — 5 PAX">
            VIP TABLE — 5 PAX
          </option>

          <option value="VIP TABLE — 6 PAX">
            VIP TABLE — 6 PAX
          </option>

          <option value="VIP TABLE — 7 PAX">
            VIP TABLE — 7 PAX
          </option>

          <option value="VIP TABLE — 8 PAX">
            VIP TABLE — 8 PAX
          </option>

        </select>

      </div>

      <div class="form-group">

        <label for="name">
          Your Name
          <span class="required">*</span>
        </label>

        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          maxlength="100"
          autocomplete="name"
          required
        >

      </div>

      <div class="form-group">

        <label for="whatsapp">
          WhatsApp
          <span class="required">*</span>
        </label>

        <input
          type="tel"
          id="whatsapp"
          name="whatsapp"
          placeholder="08xxxxxxxxxx"
          maxlength="20"
          autocomplete="tel"
          required
        >

      </div>

      <div class="form-group">

        <label for="stayConnected">
          Stay Connected
          <span class="optional">
            Optional
          </span>
        </label>

        <input
          type="text"
          id="stayConnected"
          name="stayConnected"
          placeholder="Instagram / social media"
          maxlength="150"
        >

      </div>

      <div class="form-group">

        <label for="community">
          Your Community
          <span class="optional">
            Optional
          </span>
        </label>

        <input
          type="text"
          id="community"
          name="community"
          placeholder="Your community"
          maxlength="150"
        >

      </div>

      <button
        type="submit"
        id="submitButton"
        class="submit-button"
      >
        REGISTER
      </button>

      <div
        id="loadingText"
        class="loading-text"
      >
        Connecting to registration server...
      </div>

    </form>

    <div
      id="message"
      class="message"
    ></div>

    <div
      id="passResult"
      class="pass-result"
    >

      <h3>
        REGISTRATION SUCCESSFUL
      </h3>

      <div
        id="passId"
        class="pass-id"
      ></div>

      <div
        id="passInfo"
        class="pass-info"
      ></div>

      <img
        id="qrImage"
        class="qr-image"
        alt="QR Code"
      >

      <button
        type="button"
        id="newRegistrationButton"
        class="new-registration-button"
      >
        NEW REGISTRATION
      </button>

    </div>

  </div>

  <script>

    // =====================================================
    // SUPABASE EDGE FUNCTION
    // =====================================================

    const SUPABASE_URL =
      'https://yrvnmmascklkuzpjkwxn.supabase.co';

    const API_URL =
      SUPABASE_URL +
      '/functions/v1/dynamic-service';

    // Publishable key.
    // BUKAN secret/service-role key.
    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_YGi3tPBuF9tW4KKnLJ5dDQ_AcBZ19WH';


    // =====================================================
    // ELEMENTS
    // =====================================================

    const form =
      document.getElementById(
        'registrationForm'
      );

    const accessType =
      document.getElementById(
        'accessType'
      );

    const tablePackageGroup =
      document.getElementById(
        'tablePackageGroup'
      );

    const tablePackage =
      document.getElementById(
        'tablePackage'
      );

    const submitButton =
      document.getElementById(
        'submitButton'
      );

    const loadingText =
      document.getElementById(
        'loadingText'
      );

    const message =
      document.getElementById(
        'message'
      );

    const passResult =
      document.getElementById(
        'passResult'
      );

    const passId =
      document.getElementById(
        'passId'
      );

    const passInfo =
      document.getElementById(
        'passInfo'
      );

    const qrImage =
      document.getElementById(
        'qrImage'
      );

    const newRegistrationButton =
      document.getElementById(
        'newRegistrationButton'
      );


    // =====================================================
    // ACCESS TYPE
    // =====================================================

    accessType.addEventListener(
      'change',
      function () {

        if (
          this.value === 'VIP'
        ) {

          tablePackageGroup
            .classList
            .remove('hidden');

          tablePackage.required =
            true;

        } else {

          tablePackageGroup
            .classList
            .add('hidden');

          tablePackage.required =
            false;

          tablePackage.value =
            '';

        }

      }
    );


    // =====================================================
    // MESSAGE
    // =====================================================

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        'message ' + type;

    }


    function clearMessage() {

      message.textContent =
        '';

      message.className =
        'message';

    }


    // =====================================================
    // RESET RESULT
    // =====================================================

    function hideResult() {

      passResult.style.display =
        'none';

      passId.textContent =
        '';

      passInfo.innerHTML =
        '';

      qrImage.removeAttribute(
        'src'
      );

    }


    // =====================================================
    // REGISTER TO SUPABASE
    // =====================================================

    async function registerWithSupabase(
      params
    ) {

      /*
       * PENTING:
       *
       * action=register dikirim secara eksplisit
       * melalui query string.
       *
       * URL akhirnya:
       *
       * /functions/v1/dynamic-service?action=register
       */

      const url =
        API_URL +
        '?action=register';


      console.log(
        'Registration API:',
        url
      );


      const response =
        await fetch(
          url,
          {
            method: 'POST',

            headers: {

              'Content-Type':
                'application/json',

              'apikey':
                SUPABASE_PUBLISHABLE_KEY,

              'Authorization':
                'Bearer ' +
                SUPABASE_PUBLISHABLE_KEY

            },

            body:
              JSON.stringify(
                params
              )
          }
        );


      let data = null;

      const rawText =
        await response.text();


      console.log(
        'Registration HTTP:',
        response.status
      );

      console.log(
        'Registration RAW:',
        rawText
      );


      try {

        data =
          JSON.parse(
            rawText
          );

      } catch (error) {

        throw new Error(
          'Registration server returned an invalid response.'
        );

      }


      if (!response.ok) {

        throw new Error(

          data &&
          data.message

            ? data.message

            : 'Registration server error.'

        );

      }


      if (
        !data ||
        data.success !== true
      ) {

        throw new Error(

          data &&
          data.message

            ? data.message

            : 'Registration failed.'

        );

      }


      return data;

    }


    // =====================================================
    // FORM SUBMIT
    // =====================================================

    form.addEventListener(
      'submit',
      async function (event) {

        event.preventDefault();


        clearMessage();

        hideResult();


        const access =
          accessType.value.trim();

        const selectedTable =
          tablePackage.value.trim();

        const name =
          document
            .getElementById(
              'name'
            )
            .value
            .trim();

        const whatsapp =
          document
            .getElementById(
              'whatsapp'
            )
            .value
            .trim();

        const stayConnected =
          document
            .getElementById(
              'stayConnected'
            )
            .value
            .trim();

        const community =
          document
            .getElementById(
              'community'
            )
            .value
            .trim();


        // =================================================
        // VALIDATION
        // =================================================

        if (!access) {

          showMessage(
            'Please choose your access.',
            'error'
          );

          accessType.focus();

          return;

        }


        if (!name) {

          showMessage(
            'Please enter your name.',
            'error'
          );

          document
            .getElementById(
              'name'
            )
            .focus();

          return;

        }


        if (!whatsapp) {

          showMessage(
            'Please enter your WhatsApp number.',
            'error'
          );

          document
            .getElementById(
              'whatsapp'
            )
            .focus();

          return;

        }


        if (
          access === 'VIP' &&
          !selectedTable
        ) {

          showMessage(
            'Please select your VIP Table Package.',
            'error'
          );

          tablePackage.focus();

          return;

        }


        // =================================================
        // DISABLE FORM
        // =================================================

        submitButton.disabled =
          true;

        submitButton.textContent =
          'PROCESSING...';

        loadingText.style.display =
          'block';


        try {

          // ===============================================
          // SEND
          // ===============================================

          const response =
            await registerWithSupabase(
              {

                accessType:
                  access,

                tablePackage:
                  selectedTable,

                name:
                  name,

                whatsapp:
                  whatsapp,

                stayConnected:
                  stayConnected,

                community:
                  community

              }
            );


          // ===============================================
          // SUCCESS
          // ===============================================

          showMessage(
            'Registration berhasil.',
            'success'
          );


          // ===============================================
          // PASS ID
          // ===============================================

          passId.textContent =
            response.passId || '';


          // ===============================================
          // PASS INFO
          // ===============================================

          let infoText =
            'Access: ' +
            escapeHtml(
              response.accessType || ''
            );


          if (
            response.tablePackage
          ) {

            infoText +=
              '<br>Table: ' +
              escapeHtml(
                response.tablePackage
              );

          }


          infoText +=
            '<br>Name: ' +
            escapeHtml(
              response.name || ''
            );


          infoText +=
            '<br>WhatsApp: ' +
            escapeHtml(
              response.whatsapp || ''
            );


          if (
            response.community
          ) {

            infoText +=
              '<br>Community: ' +
              escapeHtml(
                response.community
              );

          }


          if (
            response.stayConnected
          ) {

            infoText +=
              '<br>Stay Connected: ' +
              escapeHtml(
                response.stayConnected
              );

          }


          passInfo.innerHTML =
            infoText;


          // ===============================================
          // QR CODE
          // ===============================================

          if (
            response.qrCodeUrl
          ) {

            qrImage.src =
              response.qrCodeUrl;

            qrImage.style.display =
              'inline-block';

          } else {

            qrImage.removeAttribute(
              'src'
            );

            qrImage.style.display =
              'none';

          }


          // ===============================================
          // SHOW RESULT
          // ===============================================

          passResult.style.display =
            'block';


          // ===============================================
          // RESET FORM
          // ===============================================

          form.reset();

          tablePackageGroup
            .classList
            .add('hidden');

          tablePackage.required =
            false;


          // ===============================================
          // SCROLL
          // ===============================================

          setTimeout(
            function () {

              passResult.scrollIntoView(
                {
                  behavior:
                    'smooth',

                  block:
                    'start'
                }
              );

            },
            100
          );


        } catch (error) {

          console.error(
            'Registration failed:',
            error
          );


          let errorMessage =
            'Registration failed.';


          if (
            error &&
            error.message
          ) {

            errorMessage =
              error.message;

          }


          showMessage(
            errorMessage,
            'error'
          );


        } finally {

          submitButton.disabled =
            false;

          submitButton.textContent =
            'REGISTER';

          loadingText.style.display =
            'none';

        }

      }
    );


    // =====================================================
    // NEW REGISTRATION
    // =====================================================

    newRegistrationButton.addEventListener(
      'click',
      function () {

        hideResult();

        clearMessage();

        window.scrollTo(
          {
            top: 0,
            behavior: 'smooth'
          }
        );

      }
    );


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(
      value
    ) {

      return String(
        value
      )
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );

    }


    // =====================================================
    // INITIAL STATE
    // =====================================================

    tablePackageGroup
      .classList
      .add('hidden');

    tablePackage.required =
      false;

    hideResult();

  </script>

</body>
</html>
