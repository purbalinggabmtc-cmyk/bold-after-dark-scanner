    function normalizeBoldRiderId(

        value || ''

        .trim()
        .toUpperCase()
        .replace(
          /\s+/g,
          ''
        );

    // =====================================================
    // LOOKUP BOLD RIDERS
    // =====================================================

    async function lookupBoldRider(
      value
    ) {

      const riderId =
        normalizeBoldRiderId(
          value
        );


      boldRiderValid =
        false;

      boldRiderOwnerName =
        '';


      if (!riderId) {

        clearRiderStatus();

        return;

      }


      setRiderStatus(
        'checking',
        'Memeriksa BOLD RIDERS ID...'
      );


      const requestId =
        ++boldRiderLookupRequest;


      try {

        const url =
          SUPABASE_URL +
          '/rest/v1/' +
          BOLD_RIDERS_TABLE +
          '?id=eq.' +
          encodeURIComponent(
            riderId
          ) +
          '&select=id,name&limit=1';


        const response =
          await fetch(
            url,
            {
              method: 'GET',

              headers: {
                'apikey':
                  SUPABASE_PUBLISHABLE_KEY,

                'Accept':
                  'application/json'
              }
            }
          );


        if (
          requestId !==
          boldRiderLookupRequest
        ) {
          return;
        }


        const raw =
          await response.text();


        let data = [];

        try {

          data =
            JSON.parse(raw);

        }

        catch (error) {

          throw new Error(
            'Response server tidak valid.'
          );

        }


        if (!response.ok) {

          console.error(
            'BOLD RIDERS LOOKUP ERROR:',
            response.status,
            raw
          );

          throw new Error(
            'Data BOLD RIDERS tidak dapat diperiksa.'
          );

        }


        if (
          !Array.isArray(data) ||
          data.length === 0
        ) {

          boldRiderValid =
            false;

          boldRiderOwnerName =
            '';

          setRiderStatus(
            'invalid',
            'ID BOLD RIDERS tidak terdaftar.'
          );

          boldRiderOwner.textContent =
            '';

          return;

        }


        const rider =
          data[0];


        const returnedId =
          normalizeBoldRiderId(
            rider.id
          );


        const ownerName =
          String(
            rider.name || ''
          ).trim();


        if (
          returnedId !==
          riderId ||
          !ownerName
        ) {

          boldRiderValid =
            false;

          boldRiderOwnerName =
            '';

          setRiderStatus(
            'invalid',
            'ID BOLD RIDERS tidak valid.'
          );

          boldRiderOwner.textContent =
            '';

          return;

        }


        boldRiderValid =
          true;

        boldRiderOwnerName =
          ownerName;


        setRiderStatus(
          'valid',
          'ID BOLD RIDERS valid.'
        );


        boldRiderOwner.textContent =
          'Nama: ' +
          ownerName;

      }

      catch (error) {

        console.error(
          'BOLD RIDERS LOOKUP FAILED:',
          error
        );


        boldRiderValid =
          false;

        boldRiderOwnerName =
          '';


        setRiderStatus(
          'invalid',
          error &&
          error.message
            ? error.message
            : 'Gagal memeriksa BOLD RIDERS ID.'
        );


        boldRiderOwner.textContent =
          '';

      }

    }

    // =====================================================
    // JSONP REGISTRATION
    // =====================================================

    function registerViaJsonp(
      params
    ) {

      return new Promise(
        function (
          resolve,
          reject
        ) {

          const callbackName =
            'BAD_REGISTER_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() * 1000000
            );


          const script =
            document.createElement(
              'script'
            );


          let finished =
            false;


          const timeout =
            setTimeout(
              function () {

                if (finished) {
                  return;
                }


                finished =
                  true;


                cleanup();


                reject(
                  new Error(
                    'The registration server did not respond within the allowed time.'
                  )
                );

              },
              15000
            );


          function cleanup() {

            clearTimeout(
              timeout
            );


            if (
              script.parentNode
            ) {

              script.parentNode
                .removeChild(
                  script
                );

            }


            try {

              delete window[
                callbackName
              ];

            }

            catch (error) {

              window[
                callbackName
              ] = undefined;

            }

          }


          window[
            callbackName
          ] =
            function (
              response
            ) {

              if (finished) {
                return;
              }


              finished =
                true;


              cleanup();


              resolve(
                response
              );

            };


          const query =
            new URLSearchParams();


          query.set(
            'action',
            'register'
          );


          query.set(
            'accessType',
            params.accessType
          );


          query.set(
            'name',
            params.name
          );


          query.set(
            'whatsapp',
            params.whatsapp
          );


          query.set(
            'stayConnected',
            params.stayConnected
          );


          query.set(
            'community',
            params.community
          );


          query.set(
            'tablePackage',
            params.tablePackage
          );


          // ---------------------------------------------
          // BOLD RIDERS DATA
          // ---------------------------------------------

          query.set(
            'boldRiderId',
            params.boldRiderId
          );


          query.set(
            'boldRiderName',
            params.boldRiderName
          );


          query.set(
            'callback',
            callbackName
          );


          script.src =
            API_URL +
            '?' +
            query.toString();


          script.async =
            true;


          script.onerror =
            function () {

              if (finished) {
                return;
              }


              finished =
                true;


              cleanup();


              reject(
                new Error(
                  'Unable to connect to the registration server.'
                )
              );

            };


          document.body.appendChild(
            script
          );

        }
      );

    }

            .value
            .trim();


        const community =
          document
            .getElementById(
              'community'
            )
            .value
            .trim();


        // -----------------------------------------------
        // ACCESS VALIDATION
        // -----------------------------------------------

        if (!access) {

          showMessage(
            'Please choose your access.',
            'error'
          );

          return;

        }


        // -----------------------------------------------
        // BOLD RIDERS VALIDATION
        // -----------------------------------------------

        if (
          access ===
          'BOLD RIDERS'
        ) {

          if (!riderId) {

            showMessage(
              'Please enter your BOLD RIDERS ID.',
              'error'
            );

            boldRiderId.focus();

            return;

          }


          if (
            !boldRiderValid ||
            !riderName
          ) {

            showMessage(
              'BOLD RIDERS ID tidak terdaftar. Registrasi ditolak.',
              'error'
            );

            boldRiderId.focus();

            return;

          }

        }


        // -----------------------------------------------
        // NAME VALIDATION
        // -----------------------------------------------

        if (!name) {

          showMessage(
            'Please enter your name.',
            'error'
          );

          return;

        }


        // -----------------------------------------------
        // WHATSAPP VALIDATION
        // -----------------------------------------------

        if (!whatsapp) {

          showMessage(
            'Please enter your WhatsApp number.',
            'error'
          );

          return;

        }


        // -----------------------------------------------
        // VIP VALIDATION
        // -----------------------------------------------

        if (
          access === 'VIP' &&
          !selectedTable
        ) {

          showMessage(
            'Please select your VIP Table Package.',
            'error'
          );

          return;

        }


        // -----------------------------------------------
        // DISABLE BUTTON
        // -----------------------------------------------

        submitButton.disabled =
          true;


        submitButton.textContent =
          'PROCESSING...';


        try {

          const response =
            await registerViaJsonp({

              accessType:
                access,

              tablePackage:
                selectedTable,

              name:
                name,

              whatsapp:
                whatsapp,

              stayConnected:
                stayConnected,

              community:
                community,

              boldRiderId:
                access ===
                'BOLD RIDERS'
                  ? riderId
                  : '',

              boldRiderName:
                access ===
                'BOLD RIDERS'
                  ? riderName
                  : ''

            });


          // ---------------------------------------------
          // API FAILURE
          // ---------------------------------------------

          if (
            !response ||
            response.success !== true
          ) {

            throw new Error(
              response &&
              response.message
                ? response.message
                : 'Registration failed.'
            );

          }


          // ---------------------------------------------
          // SUCCESS
          // ---------------------------------------------

          showMessage(
            'Registration berhasil.',
            'success'
          );


          passId.textContent =
            response.passId ||
            '';


          let infoText =
            'Access: ' +
            (
              response.accessType ||
              ''
            );


          if (
            response.boldRiderId
          ) {

            infoText +=
              '<br>BOLD RIDERS ID: ' +
              response.boldRiderId;

          }

          else if (
            access ===
            'BOLD RIDERS'
          ) {

            infoText +=
              '<br>BOLD RIDERS ID: ' +
              riderId;

          }


          if (
            response.boldRiderName
          ) {

            infoText +=
              '<br>BOLD RIDERS Name: ' +
              response.boldRiderName;

          }

          else if (
            access ===
            'BOLD RIDERS'
          ) {

            infoText +=
              '<br>BOLD RIDERS Name: ' +
              riderName;

          }


          if (
            response.tablePackage
          ) {

            infoText +=
              '<br>Table: ' +
              response.tablePackage;

          }


          infoText +=
            '<br>Name: ' +
            (
              response.name ||
              ''
            );


          infoText +=
            '<br>WhatsApp: ' +
            (
              response.whatsapp ||
              ''
            );


          passInfo.innerHTML =
            infoText;


          // ---------------------------------------------
          // QR
          // ---------------------------------------------

          if (
            response.qrCodeUrl
          ) {

            qrImage.src =
              response.qrCodeUrl;

            qrImage.style.display =
              'inline-block';

          }

          else {

            qrImage.style.display =
              'none';

          }


          passResult.style.display =
            'block';


          // ---------------------------------------------
          // RESET
          // ---------------------------------------------

          form.reset();


          tablePackageGroup
            .classList
            .add('hidden');


          tablePackage.required =
            false;


          boldRiderGroup
            .classList
            .add('hidden');


          boldRiderId.required =
            false;


          boldRiderValid =
            false;


          boldRiderOwnerName =
            '';


          clearRiderStatus();

        }

        catch (error) {

          console.error(
            'Registration failed:',
            error
          );


          showMessage(
            error &&
            error.message
              ? error.message
              : 'Registration failed.',
            'error'
          );

        }

        finally {

          submitButton.disabled =
            false;


          submitButton.textContent =
            'REGISTER';

        }

      }
    );

  </script>

</body>
</html>
