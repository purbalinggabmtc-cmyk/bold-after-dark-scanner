  <script>

    // =====================================================
    // SUPABASE CONFIGURATION
    // =====================================================

    const API_URL =
      "https://yrvnmmascklkuzpjkwxn.supabase.co/functions/v1/dynamic-service";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_YGi3tPBuF9tW4KKnLJ5dDQ_AcBZ19WH";


    // =====================================================
    // WHATSAPP
    // =====================================================

    const WHATSAPP_HELP =
      "6282324854187";


    // =====================================================
    // ELEMENTS
    // =====================================================

    const form =
      document.getElementById(
        "registrationForm"
      );

    const accessType =
      document.getElementById(
        "accessType"
      );

    const tablePackageGroup =
      document.getElementById(
        "tablePackageGroup"
      );

    const tablePackage =
      document.getElementById(
        "tablePackage"
      );

    const boldRidersGroup =
      document.getElementById(
        "boldRidersGroup"
      );

    const boldRidersId =
      document.getElementById(
        "boldRidersId"
      );

    const boldRidersStatus =
      document.getElementById(
        "boldRidersStatus"
      );

    const boldRidersOwner =
      document.getElementById(
        "boldRidersOwner"
      );

    const submitButton =
      document.getElementById(
        "submitButton"
      );

    const message =
      document.getElementById(
        "message"
      );

    const passResult =
      document.getElementById(
        "passResult"
      );

    const passId =
      document.getElementById(
        "passId"
      );

    const passInfo =
      document.getElementById(
        "passInfo"
      );

    const qrImage =
      document.getElementById(
        "qrImage"
      );


    // =====================================================
    // STATE
    // =====================================================

    let boldRiderValid =
      false;

    let boldRiderChecking =
      false;

    let lastValidatedBoldRiderId =
      "";


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(value) {

      return String(
        value == null
          ? ""
          : value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =====================================================
    // SHOW MESSAGE
    // =====================================================

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "message " + type;

    }


    // =====================================================
    // CLEAR MESSAGE
    // =====================================================

    function clearMessage() {

      message.textContent =
        "";

      message.className =
        "message";

    }


    // =====================================================
    // RESET BOLD RIDERS VALIDATION
    // =====================================================

    function resetBoldRiderValidation() {

      boldRiderValid =
        false;

      boldRiderChecking =
        false;

      lastValidatedBoldRiderId =
        "";

      boldRidersOwner.innerHTML =
        "";

      boldRidersOwner.style.display =
        "none";

      boldRidersStatus.className =
        "bold-riders-status waiting";

      boldRidersStatus.textContent =
        "Masukkan 8 karakter ID BOLD RIDERS.";

    }


    // =====================================================
    // ACCESS CHANGE
    // =====================================================

    accessType.addEventListener(
      "change",
      function () {

        const value =
          this.value.trim();


        // -------------------------------------------------
        // VIP
        // -------------------------------------------------

        if (
          value === "VIP"
        ) {

          tablePackageGroup
            .classList
            .remove("hidden");

          tablePackage.required =
            true;

        }

        else {

          tablePackageGroup
            .classList
            .add("hidden");

          tablePackage.required =
            false;

          tablePackage.value =
            "";

        }


        // -------------------------------------------------
        // BOLD RIDERS
        // -------------------------------------------------

        if (
          value === "BOLD_RIDERS"
        ) {

          boldRidersGroup
            .classList
            .remove("hidden");

          boldRidersId.required =
            true;

          boldRidersId.focus();

        }

        else {

          boldRidersGroup
            .classList
            .add("hidden");

          boldRidersId.required =
            false;

          boldRidersId.value =
            "";

          resetBoldRiderValidation();

        }

      }
    );


    // =====================================================
    // BOLD RIDERS ID INPUT
    // =====================================================

    boldRidersId.addEventListener(
      "input",
      function () {

        // -------------------------------------------------
        // OTOMATIS UPPERCASE
        // -------------------------------------------------

        const normalized =
          this.value
            .toUpperCase()
            .replace(
              /[^A-Z0-9]/g,
              ""
            )
            .slice(
              0,
              8
            );

        this.value =
          normalized;


        // -------------------------------------------------
        // RESET STATUS SAAT BERUBAH
        // -------------------------------------------------

        boldRiderValid =
          false;

        boldRidersOwner.innerHTML =
          "";

        boldRidersOwner.style.display =
          "none";


        // -------------------------------------------------
        // KURANG DARI 8
        // -------------------------------------------------

        if (
          normalized.length <
          8
        ) {

          boldRiderChecking =
            false;

          lastValidatedBoldRiderId =
            "";

          boldRidersStatus.className =
            "bold-riders-status waiting";

          boldRidersStatus.textContent =
            "Masukkan " +
            (
              8 -
              normalized.length
            ) +
            " karakter lagi.";

          return;

        }


        // -------------------------------------------------
        // TEPAT 8 KARAKTER
        // -------------------------------------------------

        if (
          normalized.length ===
          8
        ) {

          validateBoldRider(
            normalized
          );

        }

      }
    );


    // =====================================================
    // VALIDATE BOLD RIDER
    // =====================================================

    async function validateBoldRider(
      riderId
    ) {

      riderId =
        String(
          riderId || ""
        )
          .trim()
          .toUpperCase();


      if (
        riderId.length !==
        8
      ) {
        return;
      }


      if (
        boldRiderChecking &&
        lastValidatedBoldRiderId ===
          riderId
      ) {
        return;
      }


      boldRiderChecking =
        true;

      lastValidatedBoldRiderId =
        riderId;

      boldRiderValid =
        false;


      boldRidersStatus.className =
        "bold-riders-status loading";

      boldRidersStatus.textContent =
        "Memeriksa ID BOLD RIDERS...";


      boldRidersOwner.innerHTML =
        "";

      boldRidersOwner.style.display =
        "none";


      try {

        const response =
          await fetch(
            API_URL +
            "?action=validateBoldRider" +
            "&boldRidersId=" +
            encodeURIComponent(
              riderId
            ),
            {
              method: "GET",

              headers: {
                "Accept":
                  "application/json",

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_PUBLISHABLE_KEY
              }
            }
          );


        const raw =
          await response.text();


        console.log(
          "BOLD RIDERS VALIDATION STATUS:",
          response.status
        );

        console.log(
          "BOLD RIDERS VALIDATION RESPONSE:",
          raw
        );


        let data;

        try {

          data =
            JSON.parse(raw);

        }

        catch (error) {

          throw new Error(
            "Server mengembalikan response yang tidak valid."
          );

        }


        if (
          !response.ok
        ) {

          throw new Error(
            data &&
            data.message
              ? data.message
              : "Gagal memeriksa ID BOLD RIDERS."
          );

        }


        // -------------------------------------------------
        // VALID
        // -------------------------------------------------

        if (
          data &&
          (
            data.success === true ||
            data.status === "VALID"
          )
        ) {

          const ownerName =
            data.ownerName ||
            data.name ||
            data.owner_name ||
            "";


          boldRiderValid =
            true;

          boldRidersStatus.className =
            "bold-riders-status valid";

          boldRidersStatus.textContent =
            "✓ ID BOLD RIDERS terdaftar.";


          boldRidersOwner.innerHTML =
            "Nama pemilik: " +
            "<strong>" +
            escapeHtml(
              ownerName ||
              "Nama tidak tersedia"
            ) +
            "</strong>";


          boldRidersOwner.style.display =
            "block";


          return;

        }


        // -------------------------------------------------
        // INVALID
        // -------------------------------------------------

        boldRiderValid =
          false;

        boldRidersStatus.className =
          "bold-riders-status invalid";

        boldRidersStatus.textContent =
          data &&
          data.message
            ? data.message
            : "ID BOLD RIDERS tidak terdaftar.";

      }

      catch (error) {

        console.error(
          "BOLD RIDERS VALIDATION ERROR:",
          error
        );


        boldRiderValid =
          false;


        boldRidersStatus.className =
          "bold-riders-status invalid";

        boldRidersStatus.textContent =
          error &&
          error.message
            ? error.message
            : "Data BOLD RIDERS tidak dapat diperiksa.";

      }

      finally {

        boldRiderChecking =
          false;

      }

    }


    // =====================================================
    // FORM SUBMIT
    // =====================================================

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        clearMessage();

        passResult.style.display =
          "none";


        // -------------------------------------------------
        // READ VALUES
        // -------------------------------------------------

        const access =
          accessType.value.trim();

        const selectedTable =
          tablePackage.value.trim();

        const name =
          document
            .getElementById("name")
            .value
            .trim();

        const whatsapp =
          document
            .getElementById("whatsapp")
            .value
            .trim();

        const stayConnected =
          document
            .getElementById("stayConnected")
            .value
            .trim();

        const community =
          document
            .getElementById("community")
            .value
            .trim();

        const riderId =
          boldRidersId.value
            .trim()
            .toUpperCase();


        // -------------------------------------------------
        // VALIDATION
        // -------------------------------------------------

        if (!access) {

          showMessage(
            "Please choose your access.",
            "error"
          );

          return;

        }


        if (!name) {

          showMessage(
            "Please enter your name.",
            "error"
          );

          return;

        }


        if (!whatsapp) {

          showMessage(
            "Please enter your WhatsApp number.",
            "error"
          );

          return;

        }


        if (
          access === "VIP" &&
          !selectedTable
        ) {

          showMessage(
            "Please select your VIP Table Package.",
            "error"
          );

          return;

        }


        // -------------------------------------------------
        // BOLD RIDERS VALIDATION
        // -------------------------------------------------

        if (
          access ===
          "BOLD_RIDERS"
        ) {

          if (
            riderId.length !==
            8
          ) {

            showMessage(
              "ID BOLD RIDERS harus tepat 8 karakter.",
              "error"
            );

            boldRidersId.focus();

            return;

          }


          if (
            boldRiderChecking
          ) {

            showMessage(
              "Sedang memeriksa ID BOLD RIDERS. Tunggu sebentar.",
              "error"
            );

            return;

          }


          if (
            !boldRiderValid ||
            lastValidatedBoldRiderId !==
              riderId
          ) {

            showMessage(
              "ID BOLD RIDERS tidak terdaftar atau belum berhasil divalidasi.",
              "error"
            );

            boldRidersId.focus();

            return;

          }

        }


        // -------------------------------------------------
        // DISABLE BUTTON
        // -------------------------------------------------

        submitButton.disabled =
          true;

        submitButton.textContent =
          "PROCESSING...";


        try {

          // ------------------------------------------------
          // REQUEST BODY
          // ------------------------------------------------

          const body = {

            accessType:
              access,

            tablePackage:
              selectedTable,

            boldRidersId:
              access ===
              "BOLD_RIDERS"
                ? riderId
                : "",

            name:
              name,

            whatsapp:
              whatsapp,

            stayConnected:
              stayConnected,

            community:
              community

          };


          // ------------------------------------------------
          // REGISTER
          // ------------------------------------------------

          const response =
            await fetch(
              API_URL +
              "?action=register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "Accept":
                    "application/json",

                  "apikey":
                    SUPABASE_PUBLISHABLE_KEY,

                  "Authorization":
                    "Bearer " +
                    SUPABASE_PUBLISHABLE_KEY
                },

                body:
                  JSON.stringify(
                    body
                  )
              }
            );


          const raw =
            await response.text();


          console.log(
            "REGISTER HTTP STATUS:",
            response.status
          );

          console.log(
            "REGISTER RAW RESPONSE:",
            raw
          );


          let data;

          try {

            data =
              JSON.parse(raw);

          }

          catch (error) {

            throw new Error(
              "Server mengembalikan response JSON yang tidak valid."
            );

          }


          // ------------------------------------------------
          // API FAILURE
          // ------------------------------------------------

          if (
            !response.ok ||
            !data ||
            data.success !== true
          ) {

            throw new Error(
              data &&
              data.message
                ? data.message
                : "Registration failed."
            );

          }


          // ------------------------------------------------
          // SUCCESS
          // ------------------------------------------------

          showMessage(
            "Registration berhasil.",
            "success"
          );


          passId.textContent =
            data.passId ||
            "";


          let infoText =
            "Access: " +
            (
              data.accessType ||
              ""
            );


          if (
            data.tablePackage
          ) {

            infoText +=
              "<br>Table: " +
              escapeHtml(
                data.tablePackage
              );

          }


          if (
            access ===
            "BOLD_RIDERS"
          ) {

            infoText +=
              "<br>BOLD Riders ID: " +
              escapeHtml(
                riderId
              );

          }


          infoText +=
            "<br>Name: " +
            escapeHtml(
              data.name ||
              name
            );


          infoText +=
            "<br>WhatsApp: " +
            escapeHtml(
              data.whatsapp ||
              whatsapp
            );


          passInfo.innerHTML =
            infoText;


          if (
            data.qrCodeUrl
          ) {

            qrImage.src =
              data.qrCodeUrl;

            qrImage.style.display =
              "inline-block";

          }

          else {

            qrImage.style.display =
              "none";

          }


          passResult.style.display =
            "block";


          // ------------------------------------------------
          // RESET FORM
          // ------------------------------------------------

          form.reset();


          tablePackageGroup
            .classList
            .add("hidden");

          tablePackage.required =
            false;


          boldRidersGroup
            .classList
            .add("hidden");

          boldRidersId.required =
            false;


          resetBoldRiderValidation();

        }

        catch (error) {

          console.error(
            "Registration failed:",
            error
          );


          showMessage(
            error &&
            error.message
              ? error.message
              : "Registration failed.",
            "error"
          );

        }

        finally {

          submitButton.disabled =
            false;

          submitButton.textContent =
            "REGISTER";

        }

      }
    );

  </script>

</body>
</html>
