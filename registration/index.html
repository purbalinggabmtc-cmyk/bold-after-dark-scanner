<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOLD AFTER DARK — Registration</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #242424 0%,
          #111111 45%,
          #050505 100%
        );

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 15px;
    }


    .registration-container {
      width: 100%;
      max-width: 520px;

      background: #111111;

      border: 1px solid #2c2c2c;

      border-radius: 18px;

      padding: 30px 25px 35px;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.55);
    }


    .registration-label {
      text-align: center;

      font-size: 18px;

      font-weight: 700;

      color: #ff1e1e;

      letter-spacing: 2px;

      margin-bottom: 8px;

      text-transform: uppercase;
    }


    .title {
      text-align: center;

      font-size: 34px;

      line-height: 1.1;

      font-weight: 900;

      letter-spacing: 1px;

      margin-bottom: 28px;
    }


    .title-bold {
      color: #ffffff;
    }


    .title-after {
      color: #ff1e1e;
    }


    .title-dark {
      color: #ffffff;
    }


    .form-group {
      margin-bottom: 18px;
    }


    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 700;

      color: #eeeeee;
    }


    .required {
      color: #ff1e1e;
    }


    .optional {
      color: #888888;

      font-size: 12px;

      font-weight: 400;

      margin-left: 5px;
    }


    input,
    select {

      width: 100%;

      padding: 13px 14px;

      border-radius: 9px;

      border: 1px solid #383838;

      background: #1b1b1b;

      color: #ffffff;

      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }


    input:focus,
    select:focus {

      border-color: #ff1e1e;

      box-shadow:
        0 0 0 2px rgba(255,30,30,0.12);
    }


    select {
      cursor: pointer;
    }


    select option {
      background: #171717;

      color: #ffffff;
    }


    .hidden {
      display: none;
    }


    .submit-button {

      width: 100%;

      margin-top: 10px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background: #ff1e1e;

      color: #ffffff;

      font-size: 16px;

      font-weight: 800;

      letter-spacing: 1px;

      cursor: pointer;

      transition:
        transform 0.15s,
        opacity 0.15s;
    }


    .submit-button:hover {
      transform: translateY(-1px);
    }


    .submit-button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

      transform: none;
    }


    .message {

      margin-top: 18px;

      padding: 14px;

      border-radius: 9px;

      font-size: 14px;

      line-height: 1.5;

      display: none;
    }


    .message.success {

      display: block;

      background: rgba(0,180,80,0.12);

      border: 1px solid rgba(0,180,80,0.35);

      color: #8cffb5;
    }


    .message.error {

      display: block;

      background: rgba(255,30,30,0.10);

      border: 1px solid rgba(255,30,30,0.35);

      color: #ff8f8f;
    }


    .pass-result {

      display: none;

      margin-top: 22px;

      padding: 20px;

      border-radius: 12px;

      background: #191919;

      border: 1px solid #333333;

      text-align: center;
    }


    .pass-result h3 {

      margin-top: 0;

      margin-bottom: 15px;

      color: #ff1e1e;
    }


    .pass-id {

      font-size: 20px;

      font-weight: 800;

      letter-spacing: 1px;

      margin-bottom: 12px;
    }


    .pass-info {

      font-size: 13px;

      color: #bbbbbb;

      line-height: 1.7;
    }


    .qr-image {

      width: 220px;

      max-width: 100%;

      margin-top: 18px;

      border-radius: 8px;

      background: #ffffff;

      padding: 5px;
    }


    @media (max-width: 480px) {

      .registration-container {
        padding: 25px 18px 30px;
      }

      .title {
        font-size: 28px;
      }

      .registration-label {
        font-size: 16px;
      }

    }

  </style>

</head>


<body>


  <div class="registration-container">


    <!-- REGISTRATION -->

    <div class="registration-label">
      REGISTRATION
    </div>


    <!-- TITLE -->

    <div class="title">

      <span class="title-bold">
        BOLD
      </span>

      <span class="title-after">
        AFTER
      </span>

      <span class="title-dark">
        DARK
      </span>

    </div>


    <!-- FORM -->

    <form id="registrationForm">


      <!-- ACCESS -->

      <div class="form-group">

        <label for="accessType">

          Choose your access below.
          <span class="required">*</span>

        </label>


        <select
          id="accessType"
          name="accessType"
          required
        >

          <option value="">
            Select Access
          </option>

          <option value="FREE">
            FREE
          </option>

          <option value="VIP">
            VIP
          </option>

        </select>

      </div>


      <!-- TABLE PACKAGE -->

      <div
        class="form-group hidden"
        id="tablePackageGroup"
      >

        <label for="tablePackage">

          Table Package
          <span class="required">*</span>

        </label>


        <select
          id="tablePackage"
          name="tablePackage"
        >

          <option value="">
            Select Table Package
          </option>

          <option value="VIP TABLE - 1 PAX">
            VIP TABLE - 1 PAX
          </option>

          <option value="VIP TABLE — 2 PAX">
            VIP TABLE — 2 PAX
          </option>

          <option value="VIP TABLE — 3 PAX">
            VIP TABLE — 3 PAX
          </option>

          <option value="VIP TABLE — 4 PAX">
            VIP TABLE — 4 PAX
          </option>

          <option value="VIP TABLE — 5 PAX">
            VIP TABLE — 5 PAX
          </option>

          <option value="VIP TABLE — 6 PAX">
            VIP TABLE — 6 PAX
          </option>

          <option value="VIP TABLE — 7 PAX">
            VIP TABLE — 7 PAX
          </option>

          <option value="VIP TABLE — 8 PAX">
            VIP TABLE — 8 PAX
          </option>

        </select>

      </div>


      <!-- NAME -->

      <div class="form-group">

        <label for="name">

          Your Name
          <span class="required">*</span>

        </label>


        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          maxlength="100"
          required
        >

      </div>


      <!-- WHATSAPP -->

      <div class="form-group">

        <label for="whatsapp">

          WhatsApp
          <span class="required">*</span>

        </label>


        <input
          type="tel"
          id="whatsapp"
          name="whatsapp"
          placeholder="08xxxxxxxxxx"
          maxlength="20"
          required
        >

      </div>


      <!-- STAY CONNECTED -->

      <div class="form-group">

        <label for="stayConnected">

          Stay Connected
          <span class="optional">
            Optional
          </span>

        </label>


        <input
          type="text"
          id="stayConnected"
          name="stayConnected"
          placeholder="Instagram / social media"
          maxlength="150"
        >

      </div>


      <!-- COMMUNITY -->

      <div class="form-group">

        <label for="community">

          Your Community
          <span class="optional">
            Optional
          </span>

        </label>


        <input
          type="text"
          id="community"
          name="community"
          placeholder="Your community"
          maxlength="150"
        >

      </div>


      <!-- SUBMIT -->

      <button
        type="submit"
        id="submitButton"
        class="submit-button"
      >

        REGISTER

      </button>


    </form>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- RESULT -->

    <div
      id="passResult"
      class="pass-result"
    >

      <h3>
        REGISTRATION SUCCESSFUL
      </h3>


      <div
        id="passId"
        class="pass-id"
      ></div>


      <div
        id="passInfo"
        class="pass-info"
      ></div>


      <img
        id="qrImage"
        class="qr-image"
        alt="QR Code"
      >

    </div>


  </div>


  <script>


    /* =====================================================
       GOOGLE APPS SCRIPT WEB APP
       =====================================================

       PENTING:

       URL HARUS MENGGUNAKAN:

       /macros/s/

       BUKAN:

       /macros/u/4/s/

       ===================================================== */


    const API_URL =
      'https://script.google.com/macros/s/AKfycbwDlByPLDkvNi000w-2A2_XkA8lfQ9BnhU1cVKV6VxuTY2z5YWU_ZqedEEGLn8bouzBNg/exec';


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const form =
      document.getElementById(
        'registrationForm'
      );


    const accessType =
      document.getElementById(
        'accessType'
      );


    const tablePackageGroup =
      document.getElementById(
        'tablePackageGroup'
      );


    const tablePackage =
      document.getElementById(
        'tablePackage'
      );


    const submitButton =
      document.getElementById(
        'submitButton'
      );


    const message =
      document.getElementById(
        'message'
      );


    const passResult =
      document.getElementById(
        'passResult'
      );


    const passId =
      document.getElementById(
        'passId'
      );


    const passInfo =
      document.getElementById(
        'passInfo'
      );


    const qrImage =
      document.getElementById(
        'qrImage'
      );


    /* =====================================================
       ACCESS CHANGE
       ===================================================== */

    accessType.addEventListener(
      'change',
      function () {

        if (
          this.value === 'VIP'
        ) {

          tablePackageGroup
            .classList
            .remove('hidden');

          tablePackage.required = true;

        }

        else {

          tablePackageGroup
            .classList
            .add('hidden');

          tablePackage.required = false;

          tablePackage.value = '';

        }

      }
    );


    /* =====================================================
       MESSAGE HELPERS
       ===================================================== */

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        'message ' + type;

    }


    function clearMessage() {

      message.textContent =
        '';

      message.className =
        'message';

    }


    /* =====================================================
       JSONP REGISTRATION
       ===================================================== */

    function registerViaJsonp(
      params
    ) {

      return new Promise(
        function (
          resolve,
          reject
        ) {


          const callbackName =
            'BAD_REGISTER_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() * 1000000
            );


          const script =
            document.createElement(
              'script'
            );


          let finished =
            false;


          const timeout =
            setTimeout(
              function () {

                if (finished) {
                  return;
                }


                finished = true;


                cleanup();


                reject(
                  new Error(
                    'The registration server did not respond within the allowed time.'
                  )
                );

              },
              15000
            );


          function cleanup() {

            clearTimeout(
              timeout
            );


            if (
              script.parentNode
            ) {

              script.parentNode
                .removeChild(
                  script
                );

            }


            try {

              delete window[
                callbackName
              ];

            }

            catch (error) {

              window[
                callbackName
              ] = undefined;

            }

          }


          window[
            callbackName
          ] =
            function (
              response
            ) {

              if (finished) {
                return;
              }


              finished = true;


              cleanup();


              resolve(
                response
              );

            };


          const query =
            new URLSearchParams();


          query.set(
            'action',
            'register'
          );


          query.set(
            'accessType',
            params.accessType
          );


          query.set(
            'name',
            params.name
          );


          query.set(
            'whatsapp',
            params.whatsapp
          );


          query.set(
            'stayConnected',
            params.stayConnected
          );


          query.set(
            'community',
            params.community
          );


          query.set(
            'tablePackage',
            params.tablePackage
          );


          query.set(
            'callback',
            callbackName
          );


          script.src =
            API_URL +
            '?' +
            query.toString();


          script.async = true;


          script.onerror =
            function () {

              if (finished) {
                return;
              }


              finished = true;


              cleanup();


              reject(
                new Error(
                  'Unable to connect to the registration server.'
                )
              );

            };


          document.body.appendChild(
            script
          );

        }
      );

    }


    /* =====================================================
       FORM SUBMIT
       ===================================================== */

    form.addEventListener(
      'submit',
      async function (event) {

        event.preventDefault();


        clearMessage();


        passResult.style.display =
          'none';


        /* -----------------------------------------------
           READ VALUES
           ----------------------------------------------- */

        const access =
          accessType.value.trim();


        const selectedTable =
          tablePackage.value.trim();


        const name =
          document
            .getElementById('name')
            .value
            .trim();


        const whatsapp =
          document
            .getElementById('whatsapp')
            .value
            .trim();


        const stayConnected =
          document
            .getElementById('stayConnected')
            .value
            .trim();


        const community =
          document
            .getElementById('community')
            .value
            .trim();


        /* -----------------------------------------------
           FRONTEND VALIDATION
           ----------------------------------------------- */

        if (!access) {

          showMessage(
            'Please choose your access.',
            'error'
          );

          return;

        }


        if (!name) {

          showMessage(
            'Please enter your name.',
            'error'
          );

          return;

        }


        if (!whatsapp) {

          showMessage(
            'Please enter your WhatsApp number.',
            'error'
          );

          return;

        }


        if (
          access === 'VIP' &&
          !selectedTable
        ) {

          showMessage(
            'Please select your VIP Table Package.',
            'error'
          );

          return;

        }


        /* -----------------------------------------------
           DISABLE BUTTON
           ----------------------------------------------- */

        submitButton.disabled =
          true;

        submitButton.textContent =
          'PROCESSING...';


        try {


          /* ---------------------------------------------
             CALL API
             --------------------------------------------- */

          const response =
            await registerViaJsonp({

              accessType:
                access,

              tablePackage:
                selectedTable,

              name:
                name,

              whatsapp:
                whatsapp,

              stayConnected:
                stayConnected,

              community:
                community

            });


          /* ---------------------------------------------
             API FAILURE
             --------------------------------------------- */

          if (
            !response ||
            response.success !== true
          ) {

            throw new Error(
              response &&
              response.message
                ? response.message
                : 'Registration failed.'
            );

          }


          /* ---------------------------------------------
             SUCCESS
             --------------------------------------------- */

          showMessage(
            'Registration berhasil.',
            'success'
          );


          passId.textContent =
            response.passId || '';


          let infoText =
            'Access: ' +
            (
              response.accessType ||
              ''
            );


          if (
            response.tablePackage
          ) {

            infoText +=
              '<br>Table: ' +
              response.tablePackage;

          }


          infoText +=
            '<br>Name: ' +
            (
              response.name ||
              ''
            );


          infoText +=
            '<br>WhatsApp: ' +
            (
              response.whatsapp ||
              ''
            );


          passInfo.innerHTML =
            infoText;


          if (
            response.qrCodeUrl
          ) {

            qrImage.src =
              response.qrCodeUrl;

            qrImage.style.display =
              'inline-block';

          }

          else {

            qrImage.style.display =
              'none';

          }


          passResult.style.display =
            'block';


          /* ---------------------------------------------
             RESET FORM
             --------------------------------------------- */

          form.reset();


          tablePackageGroup
            .classList
            .add('hidden');


          tablePackage.required =
            false;


        }

        catch (error) {

          console.error(
            'Registration failed:',
            error
          );


          showMessage(
            error &&
            error.message
              ? error.message
              : 'Registration failed.',
            'error'
          );

        }


        finally {

          submitButton.disabled =
            false;

          submitButton.textContent =
            'REGISTER';

        }

      }
    );


  </script>

</body>
</html>
